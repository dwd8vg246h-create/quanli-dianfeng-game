<style>
/* ============================================================
   移动端优先 · 墨黑描红
   ------------------------------------------------------------
   原后台是桌面表格布局：9 列宽表 + 横向滚动 + 13px 字 + 32px
   高的小按钮。手机上必须左右拖动才能看全一行，按钮小到指腹
   点不准，且整页浅色在夜间刺眼。

   改法：
     ① 表格改卡片列表——一条档案一张卡，信息竖排，不再横滚
     ② 触控目标一律 ≥40px，主操作做成整行宽按钮
     ③ 配色与游戏一致（墨黑底 + 朱红强调）
     ④ 分区可折叠：一屏只展开当前要用的那一块
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0b0a08;color:#ddd4c6;font-size:14px;line-height:1.7;
  padding-bottom:36px;
}
.wrap{max-width:920px;margin:0 auto;padding:10px 10px 24px}

/* 顶栏 */
.hd{
  background:linear-gradient(135deg,#8c1a1f,#5d0f13);
  color:#fff;padding:13px 15px;border-radius:14px;margin-bottom:11px;
  box-shadow:0 2px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,226,226,.14);
  border:1px solid rgba(255,226,226,.08);
}
.hd h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.5px}
.hd .sub{font-size:11.5px;opacity:.82;margin-top:3px}

/* 卡片 */
.card{
  background:linear-gradient(160deg,#181410,#12100d);
  border:1px solid #2b2521;border-radius:14px;margin-bottom:11px;
  box-shadow:0 2px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,226,226,.06);
  overflow:hidden;
}
.card-h{
  padding:11px 13px;font-weight:800;font-size:13.5px;letter-spacing:.4px;
  background:rgba(0,0,0,.25);border-bottom:1px solid #2b2521;
  border-left:3px solid #c8444c;display:flex;align-items:center;gap:7px;
}
.card-h .fold{margin-left:auto;font-size:11px;color:#c8444c;opacity:.9}
.card-b{padding:11px 13px}

/* 表单 */
input,select,textarea,button{font-family:inherit;font-size:14px}
input,select,textarea{
  width:100%;padding:10px 11px;background:#0d0b09;color:#ddd4c6;
  border:1px solid #3a322c;border-radius:10px;outline:none;
  min-height:42px;
}
input:focus,select:focus,textarea:focus{
  border-color:#c8444c;box-shadow:0 0 0 3px rgba(200,68,76,.16);
}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6}
label.f{display:block;font-size:11.5px;color:#9a9186;margin:0 0 4px 2px}

button{
  padding:10px 14px;border:1px solid #3a322c;background:#1d1915;color:#ddd4c6;
  border-radius:10px;cursor:pointer;min-height:40px;font-weight:600;
}
button:active{transform:scale(.98)}
button.pri{background:linear-gradient(180deg,#c8444c,#8c1a1f);border-color:#8c1a1f;color:#fff;
  box-shadow:0 2px 8px rgba(140,26,31,.35)}
button.dgr{background:linear-gradient(180deg,#7d1620,#4d0c12);border-color:#4d0c12;color:#ffd9d9}
button.sm{padding:7px 11px;font-size:12px;min-height:36px;flex:1;min-width:84px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:130px}
.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}

/* 统计条：手机上横向滑动，不再挤成一团 */
.stat{
  display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:4px;margin-bottom:11px;
}
.stat::-webkit-scrollbar{height:0}
.stat div{
  flex:0 0 auto;min-width:92px;background:linear-gradient(160deg,#181410,#12100d);
  border:1px solid #2b2521;border-radius:12px;padding:9px 11px;text-align:center;
}
.stat b{display:block;font-size:19px;color:#e8656e;line-height:1.3}
.stat span{font-size:11px;color:#8a8170}

/* 档案卡片（取代原来的 9 列宽表） */
.u{
  background:#131110;border:1px solid #2b2521;border-left:3px solid #c8444c;
  border-radius:12px;padding:11px 12px;margin-bottom:9px;
}
.u .t1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.u .nm{font-weight:800;font-size:14.5px;color:#f0e6d8}
.u .eid{font-size:11.5px;color:#8a8170}
.u .t2{font-size:11.5px;color:#9a9186;margin-top:3px;line-height:1.75}
.tag{display:inline-block;padding:2px 8px;border-radius:9px;font-size:10.5px;font-weight:700}
.tag-正常{background:#1e3326;color:#6cc08a;border:1px solid #2f7d4f}
.tag-冻结{background:#3a1418;color:#ff9c9c;border:1px solid #b01e23}
.tag-注销{background:#222;color:#888;border:1px solid #444}
.tag-on{background:#1e3326;color:#6cc08a;border:1px solid #2f7d4f}

.msg{padding:9px 12px;border-radius:10px;margin-bottom:10px;font-size:12.5px;line-height:1.7}
.msg-ok{background:#16281d;color:#7fc99a;border:1px solid #2f7d4f}
.msg-err{background:#2e1216;color:#ff9c9c;border:1px solid #b01e23}
.msg-info{background:#151d28;color:#8fb8e0;border:1px solid #35618a}
.mini{font-size:11px;color:#8a8170}
.warn{background:#241d0f;border:1px solid #6b5320;padding:9px 11px;border-radius:10px;
  font-size:11.5px;color:#d5b46a;line-height:1.8}
.hint{background:#151312;border:1px dashed #3a322c;padding:9px 11px;border-radius:10px;
  font-size:11.5px;color:#9a9186;line-height:1.8}

/* 分区折叠 */
.sec-h{
  display:flex;align-items:center;gap:7px;margin:13px 0 7px;padding:9px 12px;
  font-size:12.5px;font-weight:800;color:#ff9c9c;letter-spacing:.5px;
  background:rgba(0,0,0,.3);border-left:3px solid #c8444c;border-radius:0 10px 10px 0;
  cursor:pointer;user-select:none;
}
.sec-h .n{margin-left:auto;font-size:11px;opacity:.7;font-weight:400}
.sec-h::after{content:"▸";font-size:11px}
.sec-h[data-open="1"]::after{content:"▾"}
.sec-b{display:none}
.sec-b[data-open="1"]{display:block}

/* 编辑抽屉：手机上从底部升起，铺满整屏 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9000;display:none}
.mask[data-open="1"]{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:9001;display:none;
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#181410,#0d0b09);
  border-top:2px solid #c8444c;border-radius:18px 18px 0 0;
  box-shadow:0 -8px 32px rgba(0,0,0,.65);
  padding:6px 12px 92px;
}
.sheet[data-open="1"]{display:block}
.sheet .sh{
  position:sticky;top:0;z-index:2;padding:11px 0 9px;margin:0 -12px;
  background:linear-gradient(180deg,#181410,#181410f0);
  border-bottom:1px solid #2b2521;display:flex;align-items:center;gap:8px;
}
.sheet .sh b{font-size:15px;color:#f0e6d8}
.sheet .sh .x{
  margin-left:auto;background:none;border:1px solid #3a322c;color:#9a9186;
  font-size:16px;min-height:34px;padding:4px 12px;border-radius:9px;
}
.sheet .foot{
  position:fixed;left:0;right:0;bottom:0;z-index:3;padding:9px 12px;
  background:#100e0c;border-top:1px solid #2b2521;display:flex;gap:8px;
}
.sheet .foot button{flex:1;min-height:46px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:420px){ .grid2{grid-template-columns:1fr} }
.fld{margin-bottom:2px}
.pv{font-size:11.5px;color:#e8656e;margin-top:4px;min-height:16px}
.logline{border-bottom:1px solid #241f1c;padding:7px 0;font-size:11.5px;line-height:1.7}
.logline:last-child{border-bottom:0}
</style>

/* eslint-disable */
var $ = function(id){ return document.getElementById(id); };

/* raw0：本次渲染时原始 JSON 文本。用于判断「整份 JSON 区」是否真被改过——

function sha256(s){
  return new Promise(function(res){
    if(window.crypto && crypto.subtle){
      crypto.subtle.digest("SHA-256", new TextEncoder().encode("qlp_admin_" + s))
        .then(function(b){
          res(Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join(""));
        }).catch(function(){ res(simple(s)); });
    } else { res(simple(s)); }
  });
}
function simple(s){ var h=0; for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return "h"+h; }
function msg(el, text, type){ $(el).innerHTML = '<div class="msg msg-'+type+'">'+text+'</div>'; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---------- 分区折叠 ---------- */
function bindSec(headId, bodyId){
  var h = $(headId), b = $(bodyId);
  if(!h || !b) return;
  h.onclick = function(){
    var open = b.getAttribute("data-open") === "1";
    b.setAttribute("data-open", open ? "0" : "1");
    h.setAttribute("data-open", open ? "0" : "1");
  };
}

function cleanUrl(u){
  u = String(u||"").trim().replace(/[\u200b-\u200f\ufeff]/g, "");
  u = u.replace(/\s+/g, "");
  var m = u.match(/^(https?:\/\/[^\/]+)/i);
  return m ? m[1] : u.replace(/\/+$/, "");
}
function setCfgFold(fold, summary){
  try{

/* ---------- 改档能力自检 ----------
   后台改档依赖两只 SECURITY DEFINER 函数（ql_admin_read_save /
   ql_admin_write_save）。它们没部署时，保存会直连 game_saves 写入，
   多数项目被 Data API 访问策略拒绝，表现就是"点了保存没反应、
   改了游戏里没变"，而管理员看不出是自己操作错了还是库里缺东西。
   这里在登录后主动探测一次，缺什么就在顶部红条里写明。 */
function probeFuncs(){
  try{
    if(typeof Cloud.adminProbeFunctions !== "function") return;
    Cloud.adminProbeFunctions().then(function(r){
      var el = document.getElementById("fnWarn");
      if(!el){
        el = document.createElement("div");
        el.id = "fnWarn";
        el.style.cssText = "position:sticky;top:0;z-index:9999;background:#7d1620;color:#ffd9d9;padding:10px 12px;font-size:13px;line-height:1.7;border-bottom:1px solid #e8434f";
        var host = document.getElementById("main") || document.body;
        host.parentNode.insertBefore(el, host);
      }
      if(!r.ok){ el.style.display="none"; return; }
      if(r.read && r.write){ el.style.display="none"; return; }
      var miss = [];
      if(!r.read) miss.push("ql_admin_read_save");
      if(!r.write) miss.push("ql_admin_write_save");
      el.innerHTML = "⚠️ <b>后台改档函数未部署，修改无法写入云端</b><br>" +
        "缺少：" + miss.join("、") +
        "<br>需在 Supabase → SQL Editor 执行「<b>后台改档_一键安装.sql</b>」：" +
        "<br>① SQL Editor → New query" +
        "<br>② 粘贴脚本<b>全文</b>（不是网址）→ Run → 见 Success" +
        "<br>③ 回本页刷新" +
        "<div style='margin-top:8px;display:flex;gap:8px;flex-wrap:wrap'>" +
        "<button id='btnCopySql' style='flex:1;min-width:150px;padding:9px;border:0;border-radius:7px;" +
        "background:#e8434f;color:#fff;font-weight:700;font-size:13px'>📋 复制改档脚本全文</button>" +
        "<button id='btnCopySql2' style='flex:1;min-width:150px;padding:9px;border:1px solid #e8434f;" +
        "border-radius:7px;background:transparent;color:#ffd9d9;font-size:13px'>📋 复制赛季脚本全文</button>" +
        "</div>" +
        (r.uncertain ? "<br><span style='opacity:.8;font-size:12px'>（未能读取 API 定义，结论由试调用推断，可能不准）</span>" : "");
      el.style.display = "";
      bindSqlCopy();
    });
  }catch(e){}
}
/* 复制 SQL 全文：管理员在手机上拿不到脚本正文，
   把网址粘进 SQL Editor 会报 syntax error at or near "https"。
   这里直接把全文送进剪贴板，粘贴即可执行。 */
function copyText(t){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText)
      return navigator.clipboard.writeText(t);
  }catch(e){}
  return new Promise(function(res, rej){
    try{
      var ta = document.createElement("textarea");
      ta.value = t;
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var r = document.execCommand("copy");
      document.body.removeChild(ta);
      r ? res() : rej(new Error("execCommand 失败"));
    }catch(e){ rej(e); }
  });
}
function sqlOf(id){
  var el = document.getElementById(id);
  return el ? el.textContent : "";
}
function bindSqlCopy(){
  var b1 = document.getElementById("btnCopySql");
  var b2 = document.getElementById("btnCopySql2");
  function bind(btn, id, name){
    if(!btn) return;
    btn.onclick = function(){
      var t = sqlOf(id);
      if(!t){ alert("脚本内容缺失，请刷新本页重试。"); return; }
      copyText(t).then(function(){
        btn.textContent = "✓ 已复制 " + t.length + " 字符";
        alert("已复制《"+name+"》全文 "+t.length+" 字符。\n\n"+
              "去 Supabase → SQL Editor → 新建查询 → 长按粘贴 → Run。\n"+
              "注意要粘脚本正文，不是网址。");
      }).catch(function(){
        /* 剪贴板不可用时给出可手动全选的兜底 */
        var ta = document.createElement("textarea");
        ta.value = t;
        ta.style.cssText = "position:fixed;inset:10px;z-index:999999;height:70vh;font-size:11px";
        document.body.appendChild(ta);
        try{ ta.focus(); ta.select(); }catch(e){}
        alert("浏览器未授权剪贴板，已打开文本框，请长按全选复制。");
      });
    };
  }
  bind(b1, "sqlAdmin", "后台改档_一键安装.sql");
  bind(b2, "sqlSeason", "赛季模式_一键安装.sql");
}

  if(typeof Cloud.adminSaves !== "function"){
    window.__saves = {}; window.__savesLoaded = true;
    window.__saveStale = true; window.__saveErr = "";
  } else {
    Cloud.adminSaves().then(function(r){
      window.__saves = (r && r.ok) ? (r.saves||{}) : {};
      window.__saveErr = (r && !r.ok) ? (r.msg||"读取失败") : "";
      window.__saveStale = false; window.__savesLoaded = true;
      if(window.__users) render();
    });

    if(!r.ok){ $("list").innerHTML = '<div class="mini">读取失败（'+esc(r.msg||"离线")+'）</div>'; return; }
    window.__users = r.users || [];
    render();
  });
  Cloud.adminLogs().then(function(r){
    var box = $("logList"), head = $("logN");
    if(!r.ok || !r.logs.length){ box.innerHTML = '<div class="mini">暂无记录</div>'; if(head) head.textContent="0 条"; return; }
    if(head) head.textContent = r.logs.length + " 条";

      return "<div class='logline'><span class='mini'>"+t+"</span> · <b>"+esc(l.action)+"</b> · "+
             esc(l.target||"—")+(l.detail ? "<br><span class='mini'>"+esc(l.detail)+"</span>" : "")+"</div>";
    }).join("");

function saveText(u){
  var saves = window.__saves || {};
  var s = saves[u.id];
  if(!s){
    if(window.__saveStale) return "—（刷新页面可取）";
    if(window.__saveErr) return "—（读取失败）";
    if(!window.__savesLoaded) return "…";
    return "尚无存档";
  }
  var m = s.summary || {}, out = [];
  if(m.职务) out.push(esc(m.职务));
  if(m.年份) out.push(esc(m.年份));
  if(m.政绩 !== undefined && m.政绩 !== null) out.push("政绩 "+esc(String(m.政绩)));
  if(m.道德 !== undefined) out.push("道德 "+esc(String(m.道德)));
  if(m.廉政 !== undefined) out.push("廉政 "+esc(String(m.廉政)));
  if(m.结局) out.push("结局："+esc(m.结局));
  return out.length ? out.join(" · ") : "有新存档";
}

function render(){
  var users = window.__users || [];
  var q = ($("q").value||"").trim().toLowerCase();
  var fs = $("fStatus").value;
  filtered = users.filter(function(u){
    if(fs && u.status !== fs) return false;

    return ((u.emp_id||"")+" "+(u.name||"")+" "+(u.contact||"")).toLowerCase().indexOf(q) >= 0;
  });
  var ONLINE_MS = 5*60000, now = Date.now();

  box.innerHTML = filtered.map(function(u){

      '<div class="t2">'+esc(u.contact||"—")+' · 登录 '+(u.login_count||0)+' 次<br>'+

      '<div class="btnrow">'+
        '<button class="sm" data-act="编辑" data-id="'+u.id+'">📝 修改数据</button>'+

        (u.status==="冻结" || u.status==="注销"
          ? '<button class="sm" data-act="恢复" data-id="'+u.id+'">恢复</button>'
          : '<button class="sm" data-act="冻结" data-id="'+u.id+'">冻结</button>')+
        '<button class="sm" data-act="重置口令" data-id="'+u.id+'">重置口令</button>'+
        '<button class="sm dgr" data-act="注销" data-id="'+u.id+'">注销</button>'+

  Array.prototype.forEach.call(box.querySelectorAll("button[data-act]"), function(b){

function onAct(act, id){

  if(act === "编辑"){ openEdit(u); return; }

  } else if(act === "冻结" || act === "恢复"){
    if(!confirm("确认"+act+"【"+u.emp_id+"】？")) return;
  } else if(act === "重置口令"){
    var np = prompt("为【"+u.emp_id+"】设置新口令：");
    if(!np) return;
    sha256(np).then(function(h){
      Cloud.adminResetPwd(id, h).then(function(r){

         : Cloud.adminSetStatus(id, act==="冻结"?"冻结":"正常");
  fn.then(function(r){
    Cloud.adminLog(act, u.emp_id, r.ok?("成功"+(r.mode?("（"+r.mode+"）"):"")):("失败："+(r.msg||"")));

            "执行后台改档脚本中的 ql_admin_delete_user 后可真删。");
    } else {
      alert(r.ok ? (act+"成功") : (act+"失败："+(r.msg||"离线")));
    }
    loadAll();
  });
}

/* ============================================================
   对账：存档本体 vs 榜单来源
   ------------------------------------------------------------
   后台名录与游戏排行榜读的是同一列 game_saves.summary，
   理论上不会不一致。真被管理员问到"两份对不上"时，差别只可能出在
   「summary 摘要」与「data 存档本体」之间——例如改档只写了 data、
   或玩家端同步后用旧 S 重算了一遍摘要。

   这里把两边并排列出并标红差异，让管理员一眼看到到底哪一层没同步，
   而不是靠猜。
   ============================================================ */
function num(v){ return (v===undefined||v===null||v==="") ? "—" : String(v); }
/* ------------------------------------------------------------
   比对口径：单人弹窗与批量对账共用同一套行定义与差异计数，
   避免两处各写一份、口径悄悄走偏。
   ------------------------------------------------------------ */
/* 「修正后会写成的值」——比对与写入共用这一个口径。
   此前比对是按本体字段手工推一遍、修正又是另一套写法，
   两边对不上时，修正写进去的值依然满足不了比对口径：
   点了修正、提示成功，重新扫描却还是不一致——永远修不完。
   现在比对的就是"将要写入的值"，写完必然一致。 */
function reconExpect(sm, d){
  sm = sm || {}; d = d || {};
  if(typeof Cloud.adminBuildSummary !== "function") return null;
  var sum = Cloud.adminBuildSummary(d, sm);
  var rk = parseInt(d.rank, 10);
  if(!isNaN(rk) && window.ADMIN_RANKS && window.ADMIN_RANKS[rk]){
    sum["职务"] = window.ADMIN_RANKS[rk][0];
    sum["层次"] = window.ADMIN_RANKS[rk][1];
  } else {
    /* 职级表算不出（rank 缺失或超范围）就沿用旧值：
       此时没有"正确答案"可写，硬写一个只会永远对不上。 */
    sum["职务"] = sm["职务"] || "";
    sum["层次"] = sm["层次"] || "";
  }
  return sum;
}

function reconRows(sm, d){
  sm = sm || {}; d = d || {};
  var rk = parseInt(d.rank, 10);
  var tp = (!isNaN(rk) && window.ADMIN_RANKS && window.ADMIN_RANKS[rk])
         ? window.ADMIN_RANKS[rk] : ["", ""];
  var ex = reconExpect(sm, d);                 /* 修正后会写成的值 */
  var e  = ex || {};
  return {
    rank: rk, tp: tp, expect: e,
    rows: [
      ["姓名", sm["姓名"], e["姓名"]],
      ["职务", sm["职务"], e["职务"]],
      ["层次", sm["层次"], e["层次"]],
      ["位阶", sm["位阶"], e["位阶"]],
      ["年龄", sm["年龄"], e["年龄"]],
      ["年份", sm["年份"], e["年份"]],
      ["政绩", sm["政绩"], e["政绩"]],
      ["道德", sm["道德"], e["道德"]],
      ["廉政", sm["廉政"], e["廉政"]],
      ["上榜", (sm["上榜"]===false?"否":"是"), (e["上榜"]===false?"否":"是")]
    ]
  };
}
function reconDiffN(rows){
  var n = 0;
  rows.forEach(function(p){
    var a = num(p[1]), b = num(p[2]);
    if(String(a) !== String(b) && !(a === "—" && b === "—")) n++;
  });
  return n;
}
function reconTableHtml(rows){
  var diffN = reconDiffN(rows);
  var html = '<table style="width:100%;border-collapse:collapse;font-size:13px">'+
    '<tr style="opacity:.6;font-size:11px"><th align="left">字段</th>'+
    '<th align="left">当前摘要</th><th align="left">按本体重算后</th></tr>';
  rows.forEach(function(p){
    var a = num(p[1]), b = num(p[2]);
    var same = (String(a) === String(b));
    html += '<tr style="border-top:1px solid rgba(255,255,255,.08)">'+
      '<td style="padding:6px 4px;opacity:.7">'+esc(p[0])+'</td>'+
      '<td style="padding:6px 4px;color:'+(same?"#8fd0a0":"#ff8b8b")+'">'+esc(a)+'</td>'+
      '<td style="padding:6px 4px;color:'+(same?"#c9bfae":"#ff8b8b")+'">'+esc(b)+'</td></tr>';
  });
  html += '</table>';
  return {html: html, diffN: diffN};
}
/* 按存档本体重算摘要并回写。
   注意：回写会整份覆盖 data，故必须传整份存档——
   批量扫描拿到的只是投影字段，直接回写会把其余字段清空。 */
function reconFixSave(userId, sm, d, cb){
  /* 写入的就是比对时展示的那个值（同一函数算出），
     因此修正成功后重新扫描必然为 0 处不一致。
     唯一还会不一致的情况是写入本身失败（权限/函数未部署），
     那属于数据库配置，界面会单独报出原因。 */
  var sum = reconExpect(sm, d) || sm;
  Cloud.adminWriteSave(userId, d, {summary: sum, prevSummary: sm}).then(cb);
}
/* 写入失败的原因归类：直连被拒（写权限）与函数未部署，
   两者的处置方式都是执行同一份脚本，但报给管理员的文字应分开，
   否则"没权限"被说成"没部署"，照着做也解决不了。 */
function reconFailHint(txt){
  txt = String(txt || "");
  if(/permission denied|42501|row-level|violates|policy/i.test(txt))
    return "\n\n数据库未授予写权限：请在 Supabase 执行「后台改档_一键安装.sql」。";
  if(/PGRST202|function.*not exist|Could not find the public function/i.test(txt))
    return "\n\n改档函数未部署：请在 Supabase 执行「后台改档_一键安装.sql」。";
  return "";
}

      '<b style="font-size:15px">🔍 对账 · '+esc(u.emp_id)+'</b>'+
      '<span style="flex:1"></span>'+
      '<button id="rcClose" style="background:transparent;border:0;color:#c9bfae;font-size:20px">✕</button>'+
    '</div>'+
    '<div id="rcBody"><div style="opacity:.7;font-size:13px">读取中…</div></div></div>';
  document.body.appendChild(box);
  var close = function(){ if(box.parentNode) box.parentNode.removeChild(box); };
  box.querySelector("#rcClose").onclick = close;
  box.onclick = function(e){ if(e.target === box) close(); };

  var body = box.querySelector("#rcBody");
  var finish = function(html){ body.innerHTML = html; };

  if(typeof Cloud.adminReadSave !== "function"){
    finish('<div style="color:#e8838a;font-size:13px;line-height:1.8">'+
      '当前 cloud.js 过旧，不含 adminReadSave，无法对账。<br>请刷新页面重新拉取。</div>');
    return;
  }
  Cloud.adminReadSave(u.id).then(function(r){
    if(!r.ok){
      finish('<div style="color:#e8838a;font-size:13px">读取失败：'+esc(r.msg||"离线")+'</div>');
      return;
    }
    if(r.empty){
      finish('<div style="opacity:.75;font-size:13px">该账号尚无云端存档。</div>');
      return;
    }
    var sm = r.summary || {}, d = r.data || {};
    var t = reconTableHtml(reconRows(sm, d).rows);
    var diffN = t.diffN;
    var html = '<div style="font-size:12px;opacity:.75;line-height:1.8;margin-bottom:10px">'+
      '左：<b>当前摘要</b>（后台名录与游戏排行榜读的就是它）<br>'+
      '右：<b>按存档本体重算后应当写成的值</b>　·　不一致处标红<br>'+
      '<span style="opacity:.6">右列即点「修正」后写入的内容，故修正成功后重新对账必为 0 处。</span></div>'+ t.html;
    html += '<div style="margin-top:12px;padding:10px;border-radius:8px;font-size:12px;line-height:1.9;'+
      'background:'+(diffN? "rgba(232,67,79,.12)":"rgba(111,192,138,.12)")+
      ';border:1px solid '+(diffN? "rgba(232,67,79,.35)":"rgba(111,192,138,.3)")+'">'+
      (diffN
        ? ('有 <b>'+diffN+'</b> 处不一致。<br>'+
           '摘要滞后于本体：多因玩家端自动同步时用旧存档重算了摘要，'+
           '或改档只写入了本体。<br>'+
           '点「按本体重算摘要」即可让名录与排行榜立即对齐。')
        : '两边一致。若排行榜仍显示别的值，那是玩家端尚未同步——'+
          '让其退出游戏后重新登录即可拉取。')+
      '</div>';
    if(diffN){
      html += '<button id="rcFix" style="margin-top:10px;width:100%;padding:11px;border:0;'+
        'border-radius:8px;background:#e8434f;color:#fff;font-weight:700;font-size:14px">'+
        '按本体重算摘要</button>';
    }
    html += '<div style="margin-top:10px;font-size:11px;opacity:.55">'+
      '存档时间：'+esc(r.savedAt ? new Date(r.savedAt).toLocaleString("zh-CN") : "—")+'</div>';
    finish(html);
    var fb = box.querySelector("#rcFix");
    if(fb && typeof Cloud.adminWriteSave === "function"){
      fb.onclick = function(){
        fb.disabled = true; fb.textContent = "重算中…";
        reconFixSave(u.id, sm, d, function(res){
          if(!res.ok){
            Cloud.adminLog("重算摘要", u.emp_id, "失败："+(res.msg||""));
            alert("重算失败："+(res.msg||"")+reconFailHint(res.msg));
            close(); loadAll();
            return;
          }
          /* 写后读回校验：返回成功 ≠ 真正落库。
             「对账完还是不一致」多源于此——界面显示成功，
             云端仍是旧值，重扫自然照旧报错。
             只有读回来比对一次，才能把"没写进去"和"写了又不一致"分开。 */
          Cloud.adminReadSave(u.id).then(function(v){
            var left = (v.ok && !v.empty)
              ? reconDiffN(reconRows(v.summary || {}, v.data || {}).rows) : -1;
            Cloud.adminLog("重算摘要", u.emp_id, left === 0 ? "成功" : ("失败：读回仍差 "+left+" 处"));
            alert(left === 0
              ? "已按存档本体重算摘要，名录与排行榜刷新后即一致。"
              : ("写入返回成功，但读回仍差 "+left+" 处——数据库并未真正写入。"+
                 "\n\n请在 Supabase 执行「后台改档_一键安装.sql」后再试。"));
            close(); loadAll();
          });
        });
      };
    }
  });
}

/* ============================================================
   一键对账：全库扫描「摘要 vs 本体」
   ------------------------------------------------------------
   单人弹窗只能一个个点，几百份档案根本查不过来——
   真正要回答的是"到底哪些人的摘要滞后了"，这需要全库比对。

   扫描只取比对所需的少量字段（jsonb 投影），不拉整份存档；
   修正时才逐个取整份回写，因为回写会整份覆盖 data。
   ============================================================ */
function openReconAll(){
  var users = (window.__users || []).slice();
  var box = document.createElement("div");
  box.style.cssText = "position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.6);"+
    "display:flex;align-items:flex-end;justify-content:center";
  box.innerHTML = '<div style="background:#141110;color:#e8e2d8;width:100%;max-width:560px;'+
    'max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px 20px">'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'+
      '<b style="font-size:15px">🔍 一键对账 · 全库</b>'+
      '<span style="flex:1"></span>'+
      '<button id="rcaClose" style="background:transparent;border:0;color:#c9bfae;font-size:20px">✕</button>'+
    '</div>'+
    '<div id="rcaBody"><div style="opacity:.7;font-size:13px">扫描中…</div></div></div>';
  document.body.appendChild(box);
  var close = function(){ if(box.parentNode) box.parentNode.removeChild(box); };
  box.querySelector("#rcaClose").onclick = close;
  box.onclick = function(e){ if(e.target === box) close(); };
  var body = box.querySelector("#rcaBody");

  if(typeof Cloud.adminReconAll !== "function"){
    body.innerHTML = '<div style="color:#e8838a;font-size:13px;line-height:1.8">'+
      '当前 cloud.js 过旧，不含 adminReconAll。<br>请刷新页面重新拉取。</div>';
    return;
  }
  if(!users.length){
    body.innerHTML = '<div style="opacity:.75;font-size:13px">名录为空，请先刷新。</div>';
    return;
  }

  var byId = {};
  users.forEach(function(u){ byId[u.id] = u; });

  Cloud.adminReconAll(users.map(function(u){ return u.id; }), function(done, total){
    body.innerHTML = '<div style="font-size:13px;opacity:.8">扫描中… '+done+
      (total ? (" / "+total) : "")+'</div>';
  }).then(function(r){
    if(!r.ok){
      body.innerHTML = '<div style="color:#e8838a;font-size:13px;line-height:1.8">'+
        '扫描失败：'+esc(r.msg||"离线")+'</div>';
      return;
    }
    var bad = [];
    r.rows.forEach(function(row){
      var n = reconDiffN(reconRows(row.summary, row.data).rows);
      if(n) bad.push({userId: row.userId, n: n, sm: row.summary || {}, partial: !!row.partial});
    });
    var html = '<div style="font-size:12px;opacity:.75;line-height:1.8;margin-bottom:10px">'+
      '已扫描 <b>'+r.rows.length+'</b> 份存档，其中 <b style="color:'+
      (bad.length?"#ff8b8b":"#8fd0a0")+'">'+bad.length+'</b> 份摘要与本体不一致。'+
      (r.via === "full" ? '<br><span style="opacity:.7">（逐份读取模式，耗时略长）</span>' : '')+
      '</div>';
    if(!bad.length){
      html += '<div style="padding:10px;border-radius:8px;font-size:12px;line-height:1.9;'+
        'background:rgba(111,192,138,.12);border:1px solid rgba(111,192,138,.3)">'+
        '全部一致。若排行榜仍显示别的值，那是玩家端尚未同步——让其退出后重新登录即可。</div>';
      body.innerHTML = html;
      return;
    }
    html += '<button id="rcaFixAll" style="width:100%;padding:11px;border:0;border-radius:8px;'+
      'background:#e8434f;color:#fff;font-weight:700;font-size:14px;margin-bottom:10px">'+
      '一键修正全部 '+bad.length+' 份</button>';
    html += bad.map(function(it, i){
      var u = byId[it.userId] || {};
      return '<div style="border-top:1px solid rgba(255,255,255,.08);padding:9px 0">'+
        '<div style="font-size:13px"><b>'+esc(u.emp_id||"（未知工号）")+'</b> '+
        '<span style="opacity:.7">'+esc(u.name||"")+'</span></div>'+
        '<div style="font-size:12px;opacity:.75;margin:3px 0 7px">'+
          '摘要：'+esc((it.sm["职务"]||"—")+" · 政绩 "+num(it.sm["政绩"]))+
          '　·　<span class="diffTag" style="color:#ff8b8b">'+it.n+' 处不一致</span></div>'+
        '<button class="sm" data-fix="'+i+'" style="min-height:36px">修正这一份</button>'+
      '</div>';
    }).join("");
    body.innerHTML = html;

    Array.prototype.forEach.call(body.querySelectorAll("button[data-fix]"), function(b){
      b.onclick = function(){
        var it = bad[parseInt(b.getAttribute("data-fix"), 10)];
        var u = byId[it.userId] || {};
        b.disabled = true; b.textContent = "修正中…";
        /* 投影数据不能直接回写，先取整份 */
        Cloud.adminReadSave(it.userId).then(function(rr){
          if(!rr.ok || rr.empty){ b.textContent = "读取失败"; return; }
          reconFixSave(it.userId, rr.summary || {}, rr.data || {}, function(res){
            Cloud.adminLog("重算摘要", u.emp_id || "", res.ok ? "成功" : ("失败："+(res.msg||"")));
            if(!res.ok){
              b.textContent = "写入失败"; b.style.color = "#ff8b8b";
              b.title = res.msg || "";
              return;
            }
            /* 写入后本地复检：写入的就是比对口径算出的值，故应为 0 处 */
            var left = reconDiffN(reconRows(res.summary || {}, rr.data).rows);
            it.n = left;
            var tag = b.parentNode ? b.parentNode.querySelector(".diffTag") : null;
            if(left === 0){
              b.textContent = "已对齐"; b.style.color = "#8fd0a0";
              if(tag){ tag.textContent = "已对齐"; tag.style.color = "#8fd0a0"; }
            } else {
              b.textContent = "仍差 " + left + " 处"; b.style.color = "#ff8b8b";
              if(tag){ tag.textContent = left + " 处不一致"; }
            }
          });
        });
      };
    });

    var fa = body.querySelector("#rcaFixAll");
    if(fa){
      fa.onclick = function(){
        if(!confirm("将按存档本体重算 "+bad.length+" 份摘要，使名录与排行榜对齐。继续？")) return;
        fa.disabled = true;
        var i = 0, ok = 0, fail = 0, fails = [];
        /* 首份即失败时立刻中止：
           几百份档案逐一重试同一个注定失败的请求毫无意义，
           还会让管理员以为"修了但没生效"——
           实际上第一份就没写进去。 */
        var abort = function(why){
          fa.textContent = "已中止"; fa.style.background = "#7a2a30";
          alert("修正无法生效，已中止。\n\n"+why+
                "\n\n已成功 "+ok+" 份，未处理 "+(bad.length - i)+" 份。");
          close(); loadAll();
        };
        var step = function(){
          if(i >= bad.length){
            Cloud.adminLog("一键修正", "全库", "成功 "+ok+" 份，失败 "+fail+" 份");
            /* 复检：修正完重新扫描一遍，用结果说话，
               而不是让管理员"感觉还是不一致"却无从判断。 */
            fa.textContent = "复核中…";
            Cloud.adminReconAll(users.map(function(u){ return u.id; })).then(function(r2){
              var left = 0;
              if(r2.ok) r2.rows.forEach(function(row){
                if(reconDiffN(reconRows(row.summary, row.data).rows)) left++;
              });
              var msg = "修正完成：成功 " + ok + " 份，失败 " + fail + " 份。\n\n" +
                "重新扫描：" + (r2.ok ? ("仍不一致 " + left + " 份") : ("复核扫描失败：" + (r2.msg||"")));
              if(fail){
                msg += "\n\n失败原因（最多 3 条）：\n" + fails.slice(0,3).join("\n");
                if(/permission denied|42501|row-level|violates|function.*not exist|PGRST202/i.test(fails.join(" ")))
                  msg += "\n\n数据库未授予写权限或改档函数未部署：请执行「后台改档_一键安装.sql」。";
              }
              alert(msg);
              close(); loadAll();
            });
            return;
          }
          var it = bad[i++], u = byId[it.userId] || {};
          fa.textContent = "修正中… " + i + " / " + bad.length;
          Cloud.adminReadSave(it.userId).then(function(rr){
            if(!rr.ok || rr.empty){ fail++; step(); return; }
            reconFixSave(it.userId, rr.summary || {}, rr.data || {}, function(res){
              var tag = (u.emp_id || it.userId);
              if(!res.ok){
                fail++; if(fails.length < 5) fails.push(tag+"："+(res.msg||"未知原因"));
                Cloud.adminLog("重算摘要", u.emp_id || "", "失败："+(res.msg||""));
                abort("首次修正即失败，已中止剩余 "+(bad.length - i)+" 份。\n\n"+fails[0]+
                      reconFailHint(fails.join(" ")));
                return;
              }
              /* 写后读回校验：成功回调只代表请求没被拒，
                 不代表值真的落库。逐份读回比对，才能把
                 「没写进去」与「写了仍不一致」区分开。 */
              Cloud.adminReadSave(it.userId).then(function(v){
                var left = (v.ok && !v.empty)
                  ? reconDiffN(reconRows(v.summary || {}, v.data || {}).rows) : -1;
                if(left === 0){
                  ok++;
                  Cloud.adminLog("重算摘要", u.emp_id || "", "成功");
                  step();
                  return;
                }
                fail++;
                var why = (left < 0) ? "写后读回失败"
                        : ("写入返回成功但读回仍差 "+left+" 处（数据库未真正写入）");
                if(fails.length < 5) fails.push(tag+"："+why);
                Cloud.adminLog("重算摘要", u.emp_id || "", "失败："+why);
                abort(why+"，已中止剩余 "+(bad.length - i)+" 份。\n\n"+fails[0]+
                      reconFailHint(fails.join(" ")));
              });
            });
          });
        };
        step();
      };
    }
  });
}

/* ============================================================
   修改玩家档案数据
   ------------------------------------------------------------
   此前后台能看摘要、能冻结注销，唯独不能改数据：
   玩家存档损坏、数值异常、误触结局时，管理员只能注销重来，
   而注销会连带清除整个档案，代价远大于问题本身。

   现在：点「修改数据」拉取该玩家整份存档，分组列出常用字段
   直接编辑，保存时回写 data 并重算 summary（否则名录与排行榜
   仍显示旧值，看起来像没改成功）。

   必须说清的一点：游戏以本机 localStorage 为权威，云端是副本。
   玩家若正在游戏，其下一次自动同步会覆盖此处修改。因此界面
   上明确提示——修改适用于处置异常存档、协助离线玩家，
   对在线玩家不保证持久。
   ============================================================ */

    {k:"生态", t:"生态", type:"num"},
    {k:"营商", t:"营商", type:"num"},

  ]},
  {sec:"派系与风险", items:[

];

function openEdit(u){
  EDIT.user = u; EDIT.S = null; EDIT.summary = null;
  $("shTitle").textContent = "📝 " + (u.emp_id||"") + " · " + (u.name||"");
  $("shBody").innerHTML = '<div class="mini">正在读取云端存档…</div>';
  $("mask").setAttribute("data-open","1");
  $("sheet").setAttribute("data-open","1");
  if(typeof Cloud.adminReadSave !== "function"){
    $("shBody").innerHTML = '<div class="msg msg-err">云端模块过旧，不支持读取整份存档。请刷新页面重新拉取 cloud.js。</div>';
    return;
  }
  Cloud.adminReadSave(u.id).then(function(r){
    if(!r.ok){ $("shBody").innerHTML = '<div class="msg msg-err">读取失败：'+esc(r.msg||"离线")+'</div>'; return; }
    if(r.empty){ $("shBody").innerHTML = '<div class="msg msg-info">该账号尚无云端存档，无法修改数据。</div>'; return; }
    EDIT.S = r.data; EDIT.summary = r.summary || {};

}

function renderEdit(){
  var S = EDIT.S || {};
  var html = "";
  html += '<div class="hint" style="margin-bottom:10px">'+
    '存档时间：'+esc((EDIT.summary&&EDIT.summary.年份)||"—")+' · 职务：'+esc((EDIT.summary&&EDIT.summary.职务)||"—")+
    '<br><b style="color:#e8656e">注意</b>：玩家若此刻正在游戏，其自动同步可能在你写入后立刻覆盖回来。'+
    '保存后会读回校验，不一致会明确提示——建议先让其退出游戏再改。</div>';

  FIELDS.forEach(function(g, gi){
    html += '<div class="sec-h" data-ef="'+gi+'" data-open="'+(gi===0?"1":"0")+'">'+g.sec+' <span class="n">'+g.items.length+' 项</span></div>';
    html += '<div class="sec-b" data-efb="'+gi+'" data-open="'+(gi===0?"1":"0")+'"><div class="card"><div class="card-b"><div class="grid2">';
    g.items.forEach(function(f){
      var v = S[f.k];
      if(v === undefined || v === null) v = "";
      html += '<div class="fld"><label class="f">'+f.t+'<span class="mini" style="margin-left:4px">'+f.k+'</span></label>'+
              '<input type="'+(f.type==="num"?"number":"text")+'" data-k="'+f.k+'" value="'+esc(String(v))+'">'+
              (f.rank ? '<div class="pv" data-pv="rank">'+esc(rankName(v))+'</div>' : '')+
              '</div>';
    });
    html += '</div></div></div></div>';
  });

  html += '<div class="sec-h" data-ef="q" data-open="0">快捷处置</div>'+
    '<div class="sec-b" data-efb="q" data-open="0"><div class="card"><div class="card-b">'+
    '<div class="btnrow" style="margin-top:0">'+
      '<button class="sm" data-q="rankup">职级 +1</button>'+
      '<button class="sm" data-q="rankdn">职级 −1</button>'+
      '<button class="sm" data-q="heal">健康满值</button>'+
      '<button class="sm" data-q="clean">廉政风险清零</button>'+
      '<button class="sm" data-q="money">资金 +10 万</button>'+
      '<button class="sm" data-q="resetend">清除结局</button>'+
    '</div></div></div></div>';

  html += '<div class="sec-h" data-ef="j" data-open="0">原始存档（JSON）</div>'+
    '<div class="sec-b" data-efb="j" data-open="0"><div class="card"><div class="card-b">'+
    '<div class="mini" style="margin-bottom:6px">整份读取与替换。改动将覆盖上面的分项编辑。</div>'+
    '<textarea id="rawJson" rows="8" style="width:100%">'+esc(JSON.stringify(S))+'</textarea>'+
    '<div class="btnrow"><button class="sm" data-q="fmt">格式化</button>'+
    '<button class="sm" data-q="reload">还原为刚读取的内容</button></div>'+
    '<div class="mini" id="jsonMsg" style="margin-top:6px"></div>'+
    '</div></div></div>';

  $("shBody").innerHTML = html;
  EDIT.raw0 = JSON.stringify(S||{});

  Array.prototype.forEach.call($("shBody").querySelectorAll(".sec-h[data-ef]"), function(h){
    h.onclick = function(){
      var gi = h.getAttribute("data-ef");
      var b = $("shBody").querySelector('[data-efb="'+gi+'"]');
      if(!b) return;
      var open = b.getAttribute("data-open") === "1";
      b.setAttribute("data-open", open?"0":"1");
      h.setAttribute("data-open", open?"0":"1");
    };
  });
  var rk = $("shBody").querySelector('[data-k="rank"]');
  if(rk) rk.oninput = function(){
    var pv = $("shBody").querySelector('[data-pv="rank"]');
    if(pv) pv.textContent = rankName(rk.value) || "—";
  };
  Array.prototype.forEach.call($("shBody").querySelectorAll("button[data-q]"), function(b){
    b.onclick = function(){ quickAct(b.getAttribute("data-q")); };
  });
}

function collectEdits(){
  var S = EDIT.S || {};
  Array.prototype.forEach.call($("shBody").querySelectorAll("input[data-k]"), function(i){
    var k = i.getAttribute("data-k");
    var v = i.value;
    if(i.type === "number"){ v = (v === "" ? 0 : parseFloat(v)); if(isNaN(v)) v = 0; }
    S[k] = v;
  });
  return S;
}

function quickAct(q){
  var S = collectEdits();
  if(q === "rankup"){ S.rank = Math.min((window.ADMIN_RANKS||[]).length-1, (parseInt(S.rank,10)||0)+1); }
  else if(q === "rankdn"){ S.rank = Math.max(0, (parseInt(S.rank,10)||0)-1); }
  else if(q === "heal"){ S.健康 = 100; }
  else if(q === "clean"){ S.廉政风险暴露 = 0; S.攀附风险 = 0; }
  else if(q === "money"){ S.cash = (parseFloat(S.cash)||0) + 100000; }
  else if(q === "resetend"){ S.ending = ""; }
  else if(q === "fmt"){
    var ta = $("rawJson");
    try{ ta.value = JSON.stringify(JSON.parse(ta.value), null, 2); $("jsonMsg").textContent = "已格式化"; }
    catch(e){ $("jsonMsg").textContent = "JSON 解析失败："+e.message; }
    return;
  }
  else if(q === "reload"){
    var ta2 = $("rawJson");
    if(ta2){ ta2.value = JSON.stringify(EDIT.S||{}); $("jsonMsg").textContent = "已还原"; }
    return;
  }
  EDIT.S = S;
  renderEdit();
  var rk = $("shBody").querySelector('[data-k="rank"]');
  if(rk){ rk.scrollIntoView({block:"center"}); }
}

function closeEdit(){
  $("mask").setAttribute("data-open","0");
  $("sheet").setAttribute("data-open","0");
}
$("shClose").onclick = closeEdit;
$("shCancel").onclick = closeEdit;
$("mask").onclick = closeEdit;

$("shSave").onclick = function(){
  if(!EDIT.user || !EDIT.S) return;
  var ta = $("rawJson");
  /* 先取分项编辑结果；仅当「整份 JSON」区确实被改动过才以它为准。
     旧实现里只要 textarea 存在就永远走 JSON 分支，而 textarea 内容是
     刚读取时的原样——结果分项输入框里改的数值一个都存不进去。 */
  var S = collectEdits();
  if(ta && (ta.value||"").trim() && ta.value !== EDIT.raw0){
    try{
      var parsed = JSON.parse(ta.value);
      if(parsed && typeof parsed === "object") S = parsed;
    }catch(e){
      alert("原始 JSON 解析失败，已按分项编辑保存。\n"+e.message);
    }
  }
  var r = parseInt(S.rank,10);
  var sum = (typeof Cloud.adminBuildSummary === "function")
    ? Cloud.adminBuildSummary(S, EDIT.summary||{})
    : (EDIT.summary||{});
  if(!isNaN(r) && window.ADMIN_RANKS && window.ADMIN_RANKS[r]){
    sum["职务"] = window.ADMIN_RANKS[r][0];
    sum["层次"] = window.ADMIN_RANKS[r][1];
  }
  if(typeof Cloud.adminWriteSave !== "function"){
    alert("云端模块过旧，不支持写回存档。请刷新页面重新拉取 cloud.js。"); return;
  }
  var btn = $("shSave");
  btn.disabled = true; btn.textContent = "保存中…";
  Cloud.adminWriteSave(EDIT.user.id, S, {summary:sum, prevSummary:EDIT.summary||{}})
    .then(function(res){
      var detail = "职级 "+r+" · 政绩 "+(sum["政绩"]||0)+" · "+
                   (res.ok ? ("成功["+(res.via||"table")+"]") : ("失败："+(res.msg||"")));
      Cloud.adminLog("修改存档", EDIT.user.emp_id, detail);
      if(!res.ok){
        btn.disabled = false; btn.textContent = "保存修改";
        alert("保存失败：" + (res.msg||"离线") +
              "\n\n若含「权限」「policy」「permission」字样，请在 Supabase 执行\n「后台改档_一键安装.sql」后再试。");
        return;
      }
      /* 写后读回：确认云端真的变了，而不是刚写进去就被玩家端同步盖回去 */
      btn.textContent = "校验中…";
      var probe = {};
      ["rank","政绩","cash","廉政","健康"].forEach(function(k){
        if(S[k] !== undefined) probe[k] = S[k];
      });
      if(typeof Cloud.adminVerifySave !== "function"){
        btn.disabled = false; btn.textContent = "保存修改";
        alert("已保存。名录稍后刷新可见新数值。"); closeEdit(); loadAll(); return;
      }
      Cloud.adminVerifySave(EDIT.user.id, probe).then(function(v){
        btn.disabled = false; btn.textContent = "保存修改";
        if(!v.ok){
          alert("已写入，但读回校验没完成：" + (v.msg||"") + "\n请稍后在名录中确认。");
        } else if(v.matched === false){
          alert("⚠️ 写入成功，但读回发现数值不一致：\n\n" + (v.diff||[]).join("\n") +
                "\n\n最常见的原因：该玩家此刻正在游戏，自动同步在写入后立刻覆盖回来。\n" +
                "请让其退出游戏后再改，或改后由其重新登录拉取。");
        } else {
          alert("已保存并校验通过（修订号 " + v.rev + "）。\n玩家重新登录或稍后自动同步即可看到新数值。");
        }
        closeEdit(); loadAll();
      });
    });
};

$("q").oninput = render;

function hardReloadAdmin(url){
  var done = function(){
    try{ location.replace(url); }
    catch(e){ try{ location.href = url; }catch(e2){} }
  };
  var p = null;
  try{ if(typeof fetch === "function") p = fetch(url, {cache:"reload", credentials:"same-origin"}); }catch(e){ p = null; }
  if(p && p.then){ p.then(function(){ setTimeout(done, 80); }, function(){ setTimeout(done, 80); }); }
  else { setTimeout(done, 30); }
}

function checkAdminUpdate(){
  try{
    if(typeof fetch !== "function") return;
    var href = location.href || "";
    var pure = href.split("#")[0].split("?")[0];
    var base = pure.replace(/[^\/]*$/, "");
    var cur = String(window.ADMIN_VERSION||"");
    var tries = 0;
    try{ tries = parseInt(sessionStorage.getItem("qlp_admin_bust_n")||"0",10)||0; }catch(e){}
    fetch(base + "admin_version.json?t=" + Date.now(), {cache:"no-store", headers:{"Cache-Control":"no-cache"}})
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
      .then(function(d){
        if(!d || !d.v) return;
        var latest = String(d.v);
        if(latest === cur){ try{ sessionStorage.removeItem("qlp_admin_bust_n"); }catch(e){} return; }
        if(tries < 1){
          try{ sessionStorage.setItem("qlp_admin_bust_n", String(tries+1)); }catch(e){}
          hardReloadAdmin(pure + "?_v=" + encodeURIComponent(latest) + "&_t=" + Date.now());
          return;
        }
        var old = document.getElementById("adminUpdBar");
        if(old && old.parentNode) old.parentNode.removeChild(old);
        var dismissKey = "qlp_admin_skip_" + latest;
        var skipped = "";
        try{ skipped = localStorage.getItem(dismissKey)||""; }catch(e){}
        if(skipped === cur) return;   /* 该版本已手动忽略，不再反复提示 */
        var bar = document.createElement("div");
        bar.id = "adminUpdBar";
        bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b01e23;"+
          "color:#fff;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 -2px 12px rgba(0,0,0,.3)";
        bar.innerHTML = '<div style="flex:1;line-height:1.6">后台有新版本：v'+cur+' → v'+latest+
          '<br><span style="opacity:.85;font-size:12px">页面被缓存，请强制刷新</span></div>';
        var b = document.createElement("button");
        b.textContent = "强制刷新";
        b.style.cssText = "background:#fff;color:#b01e23;border:0;border-radius:6px;padding:8px 12px;font-weight:700;white-space:nowrap";
        b.onclick = function(){
          if(tries >= 3){
            // 多次强刷仍不一致：多半是版本号本身没同步，不再反复刷新，改为提示
            b.textContent = "已尝试多次";
            try{ sessionStorage.setItem("qlp_admin_bust_n", "0"); }catch(e){}
            try{ window.location.reload(); }catch(e){}
            return;
          }
          b.disabled = true; b.textContent = "刷新中…";
          try{ sessionStorage.setItem("qlp_admin_bust_n", String(tries+1)); }catch(e){}
          hardReloadAdmin(pure + "?_v=" + encodeURIComponent(latest) + "&_t=" + Date.now());
        };
        bar.appendChild(b);
        var close = document.createElement("button");
        close.textContent = "忽略";
        close.style.cssText = "background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);"+
          "border-radius:6px;padding:7px 10px;font-size:12px;white-space:nowrap";
        close.onclick = function(){
          try{ localStorage.setItem(dismissKey, String(cur)); }catch(e){}
          if(bar.parentNode) bar.parentNode.removeChild(bar);
        };
        bar.appendChild(close);
        document.body.appendChild(bar);
      });
  }catch(e){}
}
try{ checkAdminUpdate(); }catch(e){}

/* 自动刷新：输入时不打断 */
setInterval(function(){

    if(!$("main") || $("main").style.display === "none") return;

}, 60000);

})();

<script type="text/plain" id="sqlAdmin">
-- ============================================================
-- 后台改档 · 一键安装
-- ------------------------------------------------------------
-- 用途：让管理后台在"直连数据表被访问策略拒绝"时仍能读写玩家存档。
--
-- 适用现象（满足其一即需执行）：
--   · 后台点「保存修改」提示含 permission / policy / 403 字样
--   · 提示"已保存"，但读回校验报数值不一致，或玩家端始终看不到
--   · 后台打开编辑面板提示"读取失败"
--
-- 原理：这两个函数是 SECURITY DEFINER，以定义者权限执行，
--       不受 Data API 访问策略与 RLS 限制；内部仍只读写 game_saves
--       的 data / summary 两列，不额外开放任何其它能力。
--
-- 重复执行无副作用（create or replace）。
-- ============================================================

-- 读：取整份存档
create or replace function ql_admin_read_save(p_user_id text)
returns table(data jsonb, summary jsonb, saved_at timestamptz)
language sql
security definer
set search_path = public
as $$
  select s.data, s.summary, s.saved_at
    from game_saves s
   where s.user_id::text = p_user_id
   limit 1;
$$;

-- 写：整份回写，并写入管理端修订号
create or replace function ql_admin_write_save(
  p_user_id text,
  p_data    jsonb,
  p_summary jsonb,
  p_rev     bigint
) returns jsonb
language plpgsql
security definer
set search_path = public
as $$
declare
  v_summary jsonb;
  v_version int;
  v_typ     text;
begin
  v_summary := coalesce(p_summary, '{}'::jsonb);
  if p_rev is not null then
    v_summary := jsonb_set(v_summary, '{管理端修订}', to_jsonb(p_rev), true);
  end if;
  v_version := coalesce(nullif(p_data->>'version','')::int, 1);

  /* user_id 在不同项目里可能是 uuid 也可能是 text，
     硬写 ::uuid 会在 text 项目上直接报错，故按实际列类型拼 SQL。 */
  select format_type(a.atttypid, a.atttypmod)
    into v_typ
    from pg_attribute a
   where a.attrelid = 'game_saves'::regclass
     and a.attname  = 'user_id'
     and a.attnum   > 0;
  v_typ := coalesce(v_typ, 'text');

  execute format(
    'insert into game_saves(user_id, data, summary, saved_at, version)
     values (%L::%s, %L::jsonb, %L::jsonb, now(), %s)
     on conflict (user_id) do update
       set data = excluded.data,
           summary = excluded.summary,
           saved_at = excluded.saved_at,
           version = excluded.version',
    p_user_id, v_typ,
    coalesce(p_data, '{}'::jsonb)::text,
    v_summary::text,
    v_version
  );

  return v_summary;
end;
$$;

-- 允许匿名（publishable key）调用；函数内部已限定只动 game_saves
do $$
begin
  execute 'grant execute on function ql_admin_read_save(text) to anon';
  execute 'grant execute on function ql_admin_write_save(text,jsonb,jsonb,bigint) to anon';
exception when others then
  raise notice 'grant 失败（可忽略，若角色不存在）：%', sqlerrm;
end $$;

-- ============================================================
-- 注销账号（真删）
-- ------------------------------------------------------------
-- 现象：后台点「注销」提示失败（permission denied / 403）。
--
-- 根因：安全加固脚本出于安全考虑收回了 anon 的 DELETE——
--       不收回的话，任何人拿到 URL + key 就能一条请求清空全部档案。
--       于是 Cloud.adminDeleteUser 的 DELETE 请求必然被拒。
--
-- 原理：本函数 SECURITY DEFINER，以定义者权限执行，不受该限制；
--       内部先删 game_saves 再删 game_users，顺序不可颠倒
--       （有外键时先删子表；即便有 on delete cascade，显式删也更稳）。
--
-- 未执行也不影响注销：后台会自动降级为「置状态注销 + 清空云端存档」，
-- 只用到 UPDATE/INSERT，同样能立即生效并退出排行榜。
-- 区别在于本函数是真删记录，降级方案保留账号行。
--
-- 重复执行无副作用（create or replace）。
-- ============================================================
create or replace function ql_admin_delete_user(p_user_id text)
returns jsonb
language plpgsql
security definer
set search_path = public
as $$
declare
  v_typ text;
  v_s   int;
  v_u   int;
begin
  select format_type(a.atttypid, a.atttypmod)
    into v_typ
    from pg_attribute a
   where a.attrelid = 'game_saves'::regclass
     and a.attname  = 'user_id'
     and a.attnum   > 0;
  v_typ := coalesce(v_typ, 'text');

  execute format('delete from game_saves where user_id::text = %L', p_user_id);
  get diagnostics v_s = row_count;

  execute format('delete from game_users where id::text = %L', p_user_id);
  get diagnostics v_u = row_count;

  return jsonb_build_object('deleted_users', v_u, 'deleted_saves', v_s);
end;
$$;

do $$
begin
  execute 'grant execute on function ql_admin_delete_user(text) to anon';
exception when others then
  raise notice 'grant 失败（可忽略，若角色不存在）：%', sqlerrm;
end $$;

</script>
<script type="text/plain" id="sqlSeason">
-- ============================================================
-- 赛季模式 · 一键安装
-- ============================================================
-- 规则（由后台设定，此处为默认）：
--   · 赛季以【本存档开局日】为锚点，第一季恒为 S1，此后每 2 个月递进一季：
--       开局日 → S1，满 2 个月 → S2，满 4 个月 → S3 …
--       （赛季序号由客户端按锚点推算后上报，本表只负责存榜单与归档）
--   · 赛季切换时，旧存档归档为「往季档案」，可回看但不参与新赛季
--   · 赛季榜按「赛季内峰值」计名次：
--       记录本赛季达到过的最高政绩 / 最高位阶，
--       即便后来被查办降级，峰值仍保留
--
-- 隐私约定（与既有榜单一致）：
--   · 只吐脱敏字段，不返回联系方式 / 密码哈希 / 完整存档
--   · 尊重退出意愿：summary->>'上榜' = false 的不进入赛季榜
--
-- 撤销：
--   drop table if exists public.game_season_archive;
--   drop table if exists public.game_season_stats;
--   drop table if exists public.game_seasons;
--   drop function if exists public.ql_rank_season(text, text, int);
--   drop function if exists public.ql_rank_season_me(text, text, text);
-- ============================================================

-- ---------- 1. 赛季表 ----------
create table if not exists public.game_seasons (
  season_key  text primary key,          -- 'S1' / 'S2' …（跨年连续递增）
  seq         int  not null,             -- 第几季（1 起）
  started_at  timestamptz not null,
  ends_at     timestamptz not null,
  status      text not null default 'active',   -- active / closed
  note        text default ''
);

-- ---------- 2. 赛季成绩（峰值 + 终值）----------
create table if not exists public.game_season_stats (
  season_key  text not null,
  user_id     uuid not null,
  peak_merit  int  not null default 0,   -- 赛季内最高政绩
  peak_tier   int  not null default 0,   -- 赛季内最高位阶
  peak_title  text not null default '',  -- 峰值时的职务名
  final_merit int  not null default 0,   -- 赛季末快照
  final_tier  int  not null default 0,
  final_title text not null default '',
  ending      text not null default '',  -- 赛季内最终结局
  months      int  not null default 0,   -- 赛季内经历月数
  updated_at  timestamptz not null default now(),
  primary key (season_key, user_id)
);
create index if not exists idx_season_stats on public.game_season_stats(season_key);

-- ---------- 3. 往季档案（赛季切换时归档的整份存档，供回看）----------
create table if not exists public.game_season_archive (
  season_key  text not null,
  user_id     uuid not null,
  data        jsonb not null,
  summary     jsonb not null default '{}'::jsonb,
  archived_at timestamptz not null default now(),
  primary key (season_key, user_id)
);
create index if not exists idx_season_archive on public.game_season_archive(season_key);

-- ---------- 4. 权限 ----------
-- 与既有榜单一致：赛季信息本就是公开的，
-- 但函数体只吐脱敏字段，即便被直接调用也拿不到联系方式。
do $$
begin
  execute 'revoke all on public.game_seasons from anon, authenticated';
  execute 'grant select on public.game_seasons to anon';
  execute 'revoke all on public.game_season_stats from anon, authenticated';
  execute 'grant select, insert, update on public.game_season_stats to anon';
  execute 'revoke all on public.game_season_archive from anon, authenticated';
  execute 'grant select, insert on public.game_season_archive to anon';
exception when others then
  raise notice '授权跳过：%', SQLERRM;
end $$;

alter table public.game_seasons       enable row level security;
alter table public.game_season_stats  enable row level security;
alter table public.game_season_archive enable row level security;

drop policy if exists "seasons_read" on public.game_seasons;
create policy "seasons_read" on public.game_seasons
  for select to anon, authenticated using (true);

drop policy if exists "season_stats_all" on public.game_season_stats;
create policy "season_stats_all" on public.game_season_stats
  for all to anon, authenticated using (true) with check (true);

drop policy if exists "season_arch_all" on public.game_season_archive;
create policy "season_arch_all" on public.game_season_archive
  for all to anon, authenticated using (true) with check (true);

-- ---------- 5. 赛季榜：按指定赛季 + 维度排名 ----------
create or replace function public.ql_rank_season(
  p_season text default null,
  p_sort   text default 'merit',
  p_limit  int  default 100
)
returns table(
  pos          bigint,
  emp_id       text,
  name_masked  text,
  title        text,
  level        text,
  tier         int,
  merit        int,
  peak_merit   int,
  peak_tier    int,
  months       int,
  ending       text,
  updated_at   timestamptz,
  total_count  bigint
)
language sql
security definer
set search_path = public
stable
as $$
  with cur as (
    select coalesce(p_season, (select season_key from public.game_seasons
                               order by seq desc limit 1)) as k
  ),
  base as (
    select st.*, s.summary
    from public.game_season_stats st
    join cur on st.season_key = cur.k
    left join public.game_saves s on s.user_id = st.user_id
    where coalesce((s.summary ->> '上榜')::boolean, true) is true
  ),
  ranked as (
    select
      b.*,
      row_number() over (
        order by
          case when p_sort = 'merit'
               then b.peak_merit end desc nulls last,
          case when p_sort = 'tier'
               then b.peak_tier end desc nulls last,
          case when p_sort = 'months'
               then b.months end desc nulls last,
          case when p_sort = 'final'
               then b.final_merit end desc nulls last,
          /* 兜底：峰值位阶 → 峰值政绩 */
          b.peak_tier desc,
          b.peak_merit desc
      )                       as pos,
      count(*) over ()        as total_count
    from base b
  )
  select
    r.pos,
    left(r.user_id::text, 8),
    case
      when coalesce(r.summary ->> '姓名', '') = '' then '匿名干部'
      else left(r.summary ->> '姓名', 1)
           || repeat('*', greatest(1, least(3, length(r.summary ->> '姓名') - 1)))
    end,
    coalesce(r.peak_title, ''),
    coalesce(r.summary ->> '层次', ''),
    r.peak_tier,
    r.peak_merit,
    r.peak_merit,
    r.peak_tier,
    r.months,
    coalesce(r.ending, ''),
    r.updated_at,
    r.total_count
  from ranked r
  order by r.pos
  limit least(greatest(coalesce(p_limit, 100), 1), 300);
$$;

-- 只回答"我本赛季排第几"
create or replace function public.ql_rank_season_me(
  p_self   text default null,
  p_season text default null,
  p_sort   text default 'merit'
)
returns table(
  pos         bigint,
  total_count bigint,
  peak_merit  int,
  peak_tier   int
)
language sql
security definer
set search_path = public
stable
as $$
  with cur as (
    select coalesce(p_season, (select season_key from public.game_seasons
                               order by seq desc limit 1)) as k
  ),
  base as (
    select st.*
    from public.game_season_stats st
    join cur on st.season_key = cur.k
  ),
  ranked as (
    select
      b.user_id,
      b.peak_merit,
      b.peak_tier,
      row_number() over (
        order by
          case when p_sort = 'merit' then b.peak_merit end desc nulls last,
          case when p_sort = 'tier'  then b.peak_tier  end desc nulls last,
          case when p_sort = 'months' then b.months    end desc nulls last,
          case when p_sort = 'final' then b.final_merit end desc nulls last,
          b.peak_tier desc,
          b.peak_merit desc
      ) as pos
    from base b
  )
  select
    r.pos,
    (select count(*) from base),
    r.peak_merit,
    r.peak_tier
  from ranked r
  where left(r.user_id::text, 8) = nullif(coalesce(p_self, ''), '')
  limit 1;
$$;

do $$
begin
  execute 'grant execute on function public.ql_rank_season(text, text, int) to anon';
  execute 'grant execute on function public.ql_rank_season(text, text, int) to authenticated';
  execute 'grant execute on function public.ql_rank_season_me(text, text, text) to anon';
  execute 'grant execute on function public.ql_rank_season_me(text, text, text) to authenticated';
exception when others then
  raise notice '授权跳过：%', SQLERRM;
end $$;
