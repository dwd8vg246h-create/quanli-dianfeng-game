<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>权利的巅峰</title>
<style>
  :root{
    --red:#b01e23; --dark-red:#7a1418; --gold:#c9a96a; --ink:#222;
    --paper:#f4f0e6; --paper2:#ebe5d6; --line:#c8bfa8; --green:#2f7d4f;
    --shadow:0 2px 12px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    background:#2c2c2c; color:var(--ink);
    max-width:480px; margin:0 auto; min-height:100vh;
    background:#3a3a3a;
  }
  #app{
    background:var(--paper); min-height:100vh; position:relative;
    overflow-x:hidden;
  }
  /* 顶部状态栏 */
  #topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#8a1a1e,#b01e23);
    color:#fff; padding:8px 12px; box-shadow:var(--shadow);
  }
  .tb-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .tb-title{font-size:15px; font-weight:700; letter-spacing:1px;}
  .tb-sub{font-size:11px; opacity:.85; margin-top:2px;}
  .attrs{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .attr{background:rgba(255,255,255,.16); border-radius:4px; padding:2px 6px; font-size:10px;}
  .attr b{color:var(--gold);}
  .bar-wrap{height:4px; background:rgba(255,255,255,.25); border-radius:2px; margin-top:3px; width:40px; display:inline-block; vertical-align:middle;}
  .bar{height:100%; background:var(--gold); border-radius:2px;}

  /* 主体区域 */
  #main{padding:12px; padding-bottom:80px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
  }
  .card-h{
    background:var(--paper2); border-bottom:1px solid var(--line);
    padding:8px 12px; font-weight:700; font-size:13px; color:var(--dark-red);
  }
  .card-b{padding:12px; font-size:13px; line-height:1.7;}
  .muted{color:#7a7364; font-size:12px;}
  .tag{display:inline-block; background:var(--red); color:#fff; font-size:10px; padding:1px 6px; border-radius:3px; margin-right:4px;}

  /* 指标条 */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .stat{background:var(--paper2); border-radius:5px; padding:6px 8px; font-size:11px;}
  .stat .n{font-weight:700; font-size:13px;}
  .stat .lbl{color:#6b6354;}

  /* 按钮 */
  .btn{
    display:block; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-left:4px solid var(--red);
    border-radius:5px; padding:10px 12px; margin:8px 0 0; font-size:13px;
    cursor:pointer; transition:.15s; line-height:1.5;
  }
  .btn:active{background:var(--paper2); transform:scale(.99);}
  .btn .bt{font-weight:700; color:var(--dark-red);}
  .btn .bd{font-size:11px; color:#7a7364; margin-top:2px;}
  .btn.primary{background:var(--red); color:#fff; border-color:var(--red);}
  .btn.primary .bt,.btn.primary .bd{color:#fff;}

  /* 底部导航 */
  #nav{
    position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    background:#fff; border-top:1px solid var(--line); display:flex; z-index:50;
  }
  #nav .tab{flex:1; text-align:center; padding:8px 0; font-size:10px; color:#7a7364; cursor:pointer;}
  #nav .tab.active{color:var(--red); font-weight:700;}
  #nav .tab .ic{font-size:18px; display:block;}

  /* 弹窗 */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:none; align-items:center; justify-content:center; padding:20px;}
  .modal.show{display:flex;}
  .modal-box{background:var(--paper); border-radius:10px; max-width:420px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 8px 30px rgba(0,0,0,.4);}
  .modal-h{background:var(--red); color:#fff; padding:12px; font-weight:700; text-align:center; font-size:15px;}
  .modal-b{padding:16px;}

  /* 闪屏提示 */
  #toast{position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:200; display:none;}
  .toast-item{background:rgba(0,0,0,.82); color:#fff; font-size:12px; padding:8px 14px; border-radius:20px; margin-top:6px; white-space:nowrap;}

  .scene-title{font-size:16px; font-weight:700; color:var(--dark-red); border-left:4px solid var(--gold); padding-left:10px; margin:4px 0 10px;}
  .event-text{font-size:13px; line-height:1.8; text-indent:2em; margin-bottom:6px;}
  .result-box{background:#faf6ec; border:1px dashed var(--gold); border-radius:6px; padding:10px; margin-top:10px; font-size:12px; line-height:1.7;}
  .result-box b{color:var(--red);}

  .mini{font-size:11px; color:#6b6354;}
  .center{text-align:center;}
  .hidden{display:none !important;}

  /* 开始/结束页 */
  .cover{padding:40px 20px; text-align:center;}
  .cover h1{font-size:28px; color:var(--red); letter-spacing:3px; margin:0;}
  .cover .sub{color:#7a7364; font-size:13px; margin-top:8px;}
  .cover .seal{width:90px; height:90px; border:3px solid var(--red); border-radius:8px; color:var(--red); font-size:40px; line-height:84px; margin:24px auto; font-weight:700;}
</style>
</head>

/* ===== 动态构建：省级任职地（全部34个省级行政区）===== */
function buildProvinceLocations(){
  const out = [];
  const provinces = Object.keys(PROVINCE_CITY);
  provinces.forEach(p=>{
    const info = PROVINCE_INFO[p] || {tag:"省级行政区", desc:""};
    out.push({name:p, prov:p, tag:info.tag, desc:info.desc,
              capital:PROVINCE_CAPITAL[p]||""});
  });
  return out;
}

/* ===== 动态构建：地市级任职地（全部地级行政区，含地区/盟/自治州/林区）===== */
function buildCityLocations(){
  const out = [];
  Object.keys(PROVINCE_CITY).forEach(prov=>{
    const cities = PROVINCE_CITY[prov]||[];
    cities.forEach(city=>{
      // 直辖市/特别行政区：本身既是省也是市，跳过重复的"市"
      let tag = "", extra = "";
      if(PLAN_SEPARATE_CITIES.indexOf(city)>=0){ tag="计划单列市"; extra="副省级城市，享有省级经济管理权限。"; }
      else if(SUB_PROVINCIAL_CITIES.indexOf(city)>=0){ tag="副省级城市"; extra="副省级城市，市直部门为副厅级建制。"; }
      else if(PROVINCE_CAPITAL[prov]===city){ tag="省会城市"; extra=prov+"省会，全省政治经济文化中心。"; }
      else if(CITY_FAMOUS[city]){ tag=CITY_FAMOUS[city]; }
      else {
        if(/地区$/.test(city)) tag="地区";
        else if(/盟$/.test(city)) tag="盟";
        else if(/自治州$/.test(city)) tag="自治州";
        else if(/林区$/.test(city)) tag="林区";
        else tag="地级市";
      }
      out.push({name:city, prov:prov, tag:tag,
                desc:((prov===city)?"":(prov+" "))+city+(extra?("　"+extra):"")});
    });
  });
  return out;
}

/* 取指标元数据 */
function indMeta(key){
  return INDICATOR_META.find(m=>m.key===key) || {key, name:key, brief:"", items:[], gauge:"", note:"", weight:0, icon:"📊", color:"#666"};
}
/* 指标当前值 */
function indVal(key){ return (S&&typeof S[key]==="number") ? S[key] : 0; }
/* 综合考核得分（加权，满分100）——即"实绩考核得分" */
function performanceScore(){
  let s=0;
  INDICATOR_META.forEach(m=>{ s += indVal(m.key) * m.weight; });
  return Math.round(clamp(s,0,100));
}
/* 考核等次（现实中的优秀/良好/一般/较差） */
function performanceGrade(){
  const v=performanceScore();
  if(v>=85) return {t:"优秀", c:"#2f7d4f"};
  if(v>=70) return {t:"良好", c:"#35618a"};
  if(v>=60) return {t:"一般", c:"#8a6a35"};
  return {t:"较差", c:"#b01e23"};
}
/* 一票否决项检查（现实中的安全生产、生态环境、党风廉政） */

  const out=[];
  if(indVal("治安")<=15) out.push({t:"重特大安全事故", d:"发生重特大生产安全事故，平安建设一票否决。"});

}

/* 计算财政健康度（0-100） */
function fiscalHealth(){
  const f = S.财政数据 || {};
  const 自给率 = (f.财政自给率 || 0) / 100;
  const 债务率 = (f.政府债务率 || 0) / 100;
  const 转移依赖 = (f.转移支付依赖度 || 0) / 100;
  // 自给率占50%，债务率占30%，转移支付依赖占20%（越低越好）
  let score = 自给率*100*0.5;
  score += Math.max(0, (1.5 - 债务率)/1.5)*100*0.3;
  score += (1 - 转移依赖)*100*0.2;
  return Math.round(clamp(score, 0, 100));
}
function fiscalGrade(){
  const v = fiscalHealth();
  return FISCAL_SYSTEM.grades.find(g=>v>=g.min) || FISCAL_SYSTEM.grades[FISCAL_SYSTEM.grades.length-1];
}

/* 初始化/更新财政数据（随任职地与职级变化） */
function refreshFiscal(){
  const loc = S.任职地 || {};
  const layer = rankLayer(S.rank);
  // 基准值：按层级与地区差异生成
  const base = {"试用期":0.5,"科员级":0.5,"股所级":0.6,"乡科级副职":0.7,"乡科级正职":0.8,
    "县处级副职":1.0,"县处级正职":1.1,"厅局级副职":1.3,"厅局级正职":1.4,
    "省部级副职":1.6,"省部级正职":1.7,"国家级副职":2.0,"国家级正职":2.0}[layer] || 1;
  // 地区系数：沿海发达地区高，西部欠发达地区低
  const prov = loc.prov || "";
  const rich = ["广东省","江苏省","浙江省","上海市","北京市","山东省","福建省"];
  const poor = ["西藏自治区","青海省","宁夏回族自治区","甘肃省","贵州省","云南省","广西壮族自治区","新疆维吾尔自治区"];
  let coef = 1.0;
  if(rich.some(p=>prov.includes(p.slice(0,2)))) coef = 1.35;
  else if(poor.some(p=>prov.includes(p.slice(0,2)))) coef = 0.62;
  // 用指标联动：营商影响税收、GDP影响收入、民生影响支出压力
  const 营商 = indVal("营商"), GDP = indVal("GDP"), 民生 = indVal("民生");
  const 收入质量 = clamp(0.55 + 营商*0.0035, 0.45, 0.92);          // 税收占比
  const 自给率 = clamp((0.22 + GDP*0.0062) * coef, 0.08, 1.25);     // 财政自给率
  const 转移依赖 = clamp(1 - 自给率*0.85, 0.05, 0.92);              // 转移支付依赖度
  const 债务率 = clamp(2.6 - 自给率*1.5 - 营商*0.006, 0.35, 3.2);   // 债务率（倍数）
  const 土地依赖 = clamp(0.42 - 营商*0.0022, 0.05, 0.55);           // 土地出让收入依赖度
  S.财政数据 = {
    一般公共预算收入: Math.round(base*coef*18*(0.6+GDP*0.009)),  // 亿元
    税收占比: Math.round(收入质量*100),
    财政自给率: Math.round(自给率*100),
    上级转移支付: Math.round(base*coef*22*转移依赖),
    转移支付依赖度: Math.round(转移依赖*100),
    政府性基金收入: Math.round(base*coef*14*(0.5+土地依赖)),
    土地出让依赖度: Math.round(土地依赖*100),
    政府债务率: Math.round(债务率*100),
    三保保障: clamp(Math.round(100 - (1-自给率)*55 - (民生<30?18:0)), 0, 100),
    层级: layer,
  };
  return S.财政数据;
}

/* 取当前层级可用项目 */
function availableProjects(){
  const tier = (S.管辖区域 && S.管辖区域.tier) || "乡镇级";
  const limited = { "乡镇级":["rural_road","water_supply","elderly_care","culture_sport","park_green",
                             "waste_sort","old_community","digital_gov","school_build","hospital_build"] };
  if(tier==="乡镇级"){
    return URBAN_PROJECTS.filter(p=>limited["乡镇级"].includes(p.id));
  }
  // 县区及以上：除轨道交通（需更高层级）外均可
  if(tier==="县区级"){
    return URBAN_PROJECTS.filter(p=>p.id!=="rail_transit");
  }
  return URBAN_PROJECTS;
}

/* 启动建设项目 */
function startProject(pid){
  const p = URBAN_PROJECTS.find(x=>x.id===pid);
  if(!p) return;
  const f = S.财政数据 || refreshFiscal();
  // 财政承受能力评估
  if(S.cash < p.cost){
    addToast("资源点不足，无法启动该项目");
    return;
  }
  if(f.政府债务率 > 120 && p.财政依赖 >= 0.8){
    addToast("⚠ 债务率超警戒线，高依赖类项目不予立项");
    pushLog(`⚠ 债务率 ${f.政府债务率}%（超120%警戒线），【${p.name}】未通过财政承受能力评估。`);
    return;
  }
  S.cash -= p.cost;
  S.在建项目 = S.在建项目 || [];
  S.在建项目.push({
    id:p.id, name:p.name, cat:p.cat, months:p.months, left:p.months,
    gain:p.gain, risk:p.risk, cost:p.cost, start:`${S.year}年${S.month}月`,
  });
  pushLog(`🏗️ 【${p.cat}】<b>${p.name}</b> 立项开工。投入资源点 <b>${p.cost}</b>，工期 ${p.months} 个月。`);
  addToast("项目已开工："+p.name);
  save(); renderTopbar(); renderMain(curTab);
}

/* 项目月度推进（在 monthlySettlement 中调用） */
function advanceProjects(){
  if(!S.在建项目 || !S.在建项目.length) return;
  const done = [];
  S.在建项目.forEach(p=>{
    p.left--;
    if(p.left<=0){
      done.push(p);
      Object.keys(p.gain||{}).forEach(k=>{
        if(k==="GDP") S.GDP = clamp(S.GDP+p.gain[k],0,100);
        else if(k==="财政") S.财政 = clamp(S.财政+p.gain[k],0,100);
        else if(k==="民生") S.民生 = clamp(S.民生+p.gain[k],0,100);
        else if(k==="生态") S.生态 = clamp(S.生态+p.gain[k],0,100);
        else if(k==="营商") S.营商 = clamp(S.营商+p.gain[k],0,100);
        else if(k==="治安") S.治安 = clamp(S.治安+p.gain[k],0,100);
      });
      S.政绩 += 12;
      pushLog(`✅ 【${p.cat}】<b>${p.name}</b> 竣工投用，${Object.keys(p.gain||{}).map(k=>k+'+'+p.gain[k]).join(' ')}，政绩+12。`);
    }
  });
  if(done.length){
    S.在建项目 = S.在建项目.filter(p=>!done.includes(p));
    S.完工项目 = (S.完工项目||0) + done.length;
    addToast("🏗️ 项目竣工："+done.map(p=>p.name).join('、'));
  }
}

                  "林","郭","何","高","罗","郑","梁","谢","宋","唐","许","韩","冯","邓","曹",
                  "彭","曾","肖","田","董","袁","潘","蒋","蔡","余","杜","叶","程","苏","魏"];
const GIVEN_NAMES = ["建国","建军","志强","国强","伟","明","军","涛","波","辉","刚","强","磊",
                     "鹏","宇","晨","峰","斌","杰","超","勇","军","平","安","宁","静","丽","娟",
                     "敏","慧","华","芳","燕","霞","秀英","桂英","玉兰","红梅","春燕","海燕",

/* 生成姓名 */
function genLeaderName(){
  const s = SURNAMES[Math.floor(Math.random()*SURNAMES.length)];
  const g = GIVEN_NAMES[Math.floor(Math.random()*GIVEN_NAMES.length)];
  return s+g;
}

/* 按当前职级判断所属班子类型 */
function leadershipType(){
  const layer = rankLayer(S.rank);
  const dept = S.部门 || {};
  const deptName = dept.name || "";
  // 部门负责人 / 部门内设机构
  if(deptName.includes("部")||deptName.includes("委员会")||deptName.includes("总局")||deptName.includes("总署")){
    return "部委";
  }
  const map = {
    "试用期":"县局", "科员级":"县局", "股所级":"县局",
    "乡科级副职":"乡镇政府", "乡科级正职":"乡镇政府",
    "县处级副职":"县局", "县处级正职":"县政府",
    "厅局级副职":"市局", "厅局级正职":"市政府",
    "省部级副职":"省厅", "省部级正职":"省政府",
    "国家级副职":"部委", "国家级正职":"部委",
  };
  return map[layer] || "县局";
}

/* 生成领导班子（同事 + 上司） */
function generateLeadership(){
  const type = leadershipType();
  const Q = LEADERSHIP_QUOTA[type] || LEADERSHIP_QUOTA["县局"];
  const layer = rankLayer(S.rank);
  const myTitle = rankTitle(S.rank);
  const deptName = (S.部门 && S.部门.name) || "本机关";

  const members = [];
  const usedNames = new Set();
  const mkName = ()=>{ let n; do{ n=genLeaderName(); }while(usedNames.has(n)); usedNames.add(n); return n; };

  // 副职数量
  let viceN;
  if(Array.isArray(Q.副职)) viceN = Q.副职[0] + Math.floor(Math.random()*(Q.副职[1]-Q.副职[0]+1));
  else viceN = Q.副职;
  // 委员数量
  let memberN = 0;
  if(Q.委员) memberN = Q.委员[0] + Math.floor(Math.random()*(Q.委员[1]-Q.委员[0]+1));

  const isGov = type.includes("政府");
  const isDept = ["县局","市局","省厅","部委"].includes(type);
  const unitName = isGov ? ({"乡镇政府":"乡镇","县政府":"县","市政府":"市","省政府":"省"}[type]||"本府") :
                   isDept ? deptName.replace(/局|厅|部|委员会$/,"") : "党委";

  // 职务名生成（预先计算，避免模板字符串内嵌套复杂三元）
  const govZheng = {"省":"省长","市":"市长","县":"县长","乡镇":"乡镇长"}[unitName] || "行政主官";
  const govFu = "副"+govZheng;
  const deptBase = deptName.replace(/局$/,'').replace(/厅$/,'').replace(/部$/,'').replace(/委员会$/,'');
  const deptZheng = deptBase + (type==="部委"?"部长":(type==="省厅"?"厅长":"局长"));
  const deptFu = "副" + (type==="部委"?"部长":(type==="省厅"?"厅长":"局长"));

  // —— 正职（一把手）——
  {
    const t = LEADER_TYPES[Math.floor(Math.random()*LEADER_TYPES.length)];
    const o = LEADER_ORIGINS[Math.floor(Math.random()*LEADER_ORIGINS.length)];
    members.push({
      role:"正职", title:(isGov?govZheng:(isDept?deptZheng:"书记")),
      name:mkName(),
      age:({
        "部委":58, "省厅":54, "市局":52, "县局":50,
        "省政府":58, "市政府":54, "县政府":52, "乡镇政府":50
      }[type] || 52),
      duty:LEADER_DUTIES[0],  // 主持全面工作
      type:t, origin:o,
      relation:60 + Math.floor(Math.random()*20),
      isBoss:true, isDirectBoss:false,
      note:"主持全面工作，对班子成员分工负总责。",
    });
  }

  // —— 常务副职（分管日常工作）——
  {
    const t = LEADER_TYPES[Math.floor(Math.random()*LEADER_TYPES.length)];
    const o = LEADER_ORIGINS[Math.floor(Math.random()*LEADER_ORIGINS.length)];
    members.push({
      role:"常务副职",
      title:(isGov?("常务"+govFu):("分管日常工作的"+deptFu)),
      name:mkName(),
      age:isDept?(type==="部委"?54:(type==="省厅"?51:(type==="市局"?49:47)))
                :(type==="省政府"?55:(type==="市政府"?52:50)),
      duty:LEADER_DUTIES.find(d=>d.key==="分管日常工作"),
      type:t, origin:o,
      relation:55 + Math.floor(Math.random()*20),
      isBoss:false, isDirectBoss:false,
      note:"协助正职处理日常工作，正职外出期间主持工作。",
    });
  }

  // —— 纪检监察（派驻，不分管业务）——
  {
    const t = LEADER_TYPES.find(x=>x.key==="原则型") || LEADER_TYPES[3];
    const o = LEADER_ORIGINS[Math.floor(Math.random()*LEADER_ORIGINS.length)];
    members.push({
      role:"纪检监察",
      title:isDept?"派驻纪检监察组组长":"纪委书记（监委主任）",
      name:mkName(),
      age:(type==="部委"?53:(type==="省厅"?52:(type==="市局"?50:(type==="县局"?48:50)))),
      duty:LEADER_DUTIES.find(d=>d.key==="纪检监察"),
      type:t, origin:o,
      relation:50 + Math.floor(Math.random()*15),
      isBoss:false, isDirectBoss:false, isDiscipline:true,
      note:"由上级纪委监委提名、派驻，专司监督执纪问责，按规矩不分管具体业务。",
    });
  }

  // —— 其他副职 ——
  const viceDuties = LEADER_DUTIES.filter(d=>!["分管日常工作","纪检监察"].includes(d.key));
  for(let i=0; i<viceN-1; i++){
    const t = LEADER_TYPES[Math.floor(Math.random()*LEADER_TYPES.length)];
    const o = LEADER_ORIGINS[Math.floor(Math.random()*LEADER_ORIGINS.length)];
    const d = viceDuties[Math.floor(Math.random()*viceDuties.length)];
    const isDirect = (i===0);   // 第一个业务副职作为直接上司
    members.push({
      role:"副职",
      title:(isGov?govFu:deptFu),
      name:mkName(),
      age:(isDept?(40+Math.floor(Math.random()*6)):(42+Math.floor(Math.random()*6))),
      duty:d, type:t, origin:o,
      relation:50 + Math.floor(Math.random()*25),
      isBoss:false, isDirectBoss:isDirect,
      note:`分管${d.key}，${d.desc}。`,
    });
  }

  // —— 党委/班子委员（内设机构负责人或中层）——
  const midTitle = {"县局":"股长/科长","市局":"科长","省厅":"处长","部委":"司长/处长",
                    "乡镇政府":"乡镇党委委员","县政府":"县委常委","市政府":"市委常委","省政府":"省委常委"}[type] || "干部";
  const midDuties = LEADER_DUTIES.filter(d=>!["纪检监察"].includes(d.key));
  for(let i=0; i<memberN; i++){
    const t = LEADER_TYPES[Math.floor(Math.random()*LEADER_TYPES.length)];
    const o = LEADER_ORIGINS[Math.floor(Math.random()*LEADER_ORIGINS.length)];
    const d = midDuties[Math.floor(Math.random()*midDuties.length)];
    members.push({
      role:"班子成员",
      title:midTitle,
      name:mkName(),
      age:38+Math.floor(Math.random()*10),
      duty:d, type:t, origin:o,
      relation:45 + Math.floor(Math.random()*30),
      isBoss:false, isDirectBoss:false, isPeer:true,
      note:`${midTitle}层级，分管${d.key}。班子内部既是协作关系，也是职务晋升的竞争关系。`,
    });
  }

  S.领导班子 = {
    type, quota:Q, 单位:deptName, 我的职务:myTitle,
    members,
    生成时间:`${S.year}年${S.month}月`,
  };
  S.直接上司 = members.find(m=>m.isDirectBoss) || null;
  S.一把手 = members.find(m=>m.isBoss) || null;
  S.纪检负责人 = members.find(m=>m.isDiscipline) || null;
  return S.领导班子;
}

/* 取班子成员（若未生成或层级已变则重新生成） */
function getLeadership(force){
  const type = leadershipType();
  if(!force && S.领导班子 && S.领导班子.type===type && S.领导班子.members && S.领导班子.members.length) return S.领导班子;
  return generateLeadership();
}

/* 执行与领导的互动 */
function interactLeader(idx, ikey){
  const L = getLeadership();
  const m = L.members[idx];
  if(!m) return;
  const act = LEADER_INTERACTIONS.find(a=>a.key===ikey);
  if(!act) return;

  // 资源检查
  if(act.cost.cash && (S.cash||0) < act.cost.cash){ addToast("资源点不足"); return; }
  if(act.cost.cash) S.cash -= act.cost.cash;
  if(act.cost.健康) S.健康 = clamp(S.健康 - act.cost.健康, 0, 100);
  Object.keys(act.gain||{}).forEach(k=>{
    if(k==="能力") S.能力 = clamp(S.能力+act.gain[k],0,100);
    if(k==="政绩") S.政绩 = (S.政绩||0)+act.gain[k];
  });

  // 关系变化：受领导类型影响
  const react = (m.type && m.type.react) ? m.type.react : {};
  let delta = act.relDelta;
  if(ikey==="组织聚餐") delta = act.relDelta * (react.宴请!==undefined?(react.宴请/2+0.5):1);
  if(ikey==="登门拜访") delta = act.relDelta * (react.送礼!==undefined?(1 + react.送礼/10):1);
  if(ikey==="请示汇报"||ikey==="送阅材料") delta = act.relDelta * (react.汇报!==undefined?react.汇报:1);
  if(ikey==="加班加点") delta = act.relDelta * (react.汇报!==undefined?react.汇报:1);

  // 纪检干部对违规行为反应更强烈
  if(m.isDiscipline && act.risk>0) delta = -Math.abs(delta)*2;

  m.relation = Math.round(clamp((m.relation||50) + delta, 0, 100));

  // 道德风险
  if(act.risk>0){
    S.道德 = clamp(S.道德 - act.risk, 0, 100);
    S.廉政风险暴露 = (S.廉政风险暴露||0) + act.risk;
    if(m.isDiscipline){
      pushLog(`⛔ 你向纪检监察干部${m.name}示好，这是极其危险的做法——监督者最忌讳被打招呼。`);
      addToast("⛔ 纪检干部不吃这一套");
    }
    // 被查处风险
    if(act.risk>=15 && Math.random() < 0.12){
      S.道德 = clamp(S.道德 - 25, 0, 100);
      pushLog(`🚨 你向${m.name}${m.title}赠送礼品礼金的行为被反映到纪检监察机关，受到组织处理。道德大幅下降。`);
      addToast("🚨 违纪行为被查处！");
    }
  }

  // 直接上司影响上司好感
  if(m.isDirectBoss) S.上司好感 = clamp((S.上司好感||0) + delta*0.35, 0, 100);
  if(m.isBoss) S.上司好感 = clamp((S.上司好感||0) + delta*0.25, 0, 100);

  pushLog(`【${act.key}】${act.log.replace(/%s/g, m.name+m.title)}`);
  if(act.warn) pushLog(`　　${act.warn}`);
  addToast(`${act.icon} ${act.key}：${m.name}关系 ${delta>0?"+":""}${Math.round(delta)}`);
  save(); renderTopbar(); renderMain(curTab);
}

/* 按职级返回任职地层级 */
function locationTierFor(layer){
  if(layer==="试用期") return "乡镇级";
  if(layer==="科员级"||layer==="股所级") return "乡镇级";
  if(layer==="乡科级副职"||layer==="乡科级正职") return "乡镇级";
  if(layer==="县处级副职"||layer==="县处级正职") return "县区级";
  if(layer==="厅局级副职"||layer==="厅局级正职") return "地市级";
  if(layer==="省部级副职"||layer==="省部级正职") return "省级";
  return "中央级";
}

/* 为当前职级随机分配一个现实任职地（避开籍贯省，落实地域回避） */
function pickLocation(rank, avoidProv){
  const layer = rankLayer(rank);
  const tier = locationTierFor(layer);
  const pool = LOCATIONS[tier] || LOCATIONS["乡镇级"];
  if(!pool || !pool.length) return null;
  // 先尝试避开籍贯省
  if(avoidProv){
    const other = pool.filter(l=>l.prov && l.prov!==avoidProv && !avoidProv.startsWith(l.prov.slice(0,2)));
    if(other.length) return other[Math.floor(Math.random()*other.length)];
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ================= 兼任职务的地域解析 =================
   兼任职务的机构名称随任职地变化：在苏州市任副市长，兼任的是
   "苏州市公安局局长"；副省级城市（15个）的市直部门为副厅级建制，
   比普通地级市高半级，兼任后的个人级别也相应上浮。 */
function isSubProvincialCity(city){
  return !!city && SUB_PROVINCIAL_CITIES.indexOf(city)>=0;
}
function isPlanSeparateCity(city){
  return !!city && PLAN_SEPARATE_CITIES.indexOf(city)>=0;
}
function isProvCapital(city){
  const prov = S && S.任职地 ? S.任职地.prov : "";
  return !!city && PROVINCE_CAPITAL[prov]===city;
}

/* 取任职地名称（用于拼接机构名） */
function locCity(){
  if(!S || !S.任职地) return "";
  const L = S.任职地;
  // 地市级任职地：用城市名；县区级：用县区名
  if(L.tier==="地市级") return L.name;
  if(L.tier==="县区级") return L.name;
  if(L.tier==="省级")   return L.name;
  return L.name;
}
function locProv(){
  if(!S || !S.任职地) return "";
  return S.任职地.prov || S.任职地.name || "";
}

/* 将兼任模板解析为具体机构名与级别
   P.organ 支持占位符：{city} / {prov}
   P.levels.normal / P.levels.sub 分别对应普通地级市与副省级城市 */
function resolveConcurrent(P){
  const city = locCity(), prov = locProv();
  const sub = isSubProvincialCity(city);
  const organ = (P.organ||"").replace(/\{city\}/g, city).replace(/\{prov\}/g, prov);
  const post  = (P.post ||"").replace(/\{city\}/g, city).replace(/\{prov\}/g, prov);
  let organLevel = P.organLevel, personLevel = P.personLevel;
  if(P.levels){
    const lv = sub ? (P.levels.sub||P.levels.normal) : P.levels.normal;
    organLevel  = lv.organ;
    personLevel = lv.person;
  }
  return {
    id:P.id, layer:P.layer, by:P.by,
    post, organ, organLevel, personLevel,
    highProfile:P.highProfile,
    subProvincial: sub,
    desc: (P.desc||"").replace(/\{city\}/g, city).replace(/\{prov\}/g, prov),
    gain:P.gain, cost:P.cost, req:P.req,
    note: sub ? "副省级城市：市直部门为副厅级建制，兼任后个人级别相应上浮。" : "",
  };
}

/* 按当前层次取可选的兼任职务 */
function availableConcurrent(){
  const layer = rankLayer(S.rank);
  const taken = (S.兼任||[]).map(x=>x.id);
  return CONCURRENT_POSTS.filter(p=>p.layer===layer && !taken.includes(p.id))
                         .map(p=>resolveConcurrent(p));
}

/* 判断当前是否处于"高配"状态（兼任了机构建制低于个人级别的职务）*/
function highProfileStatus(){
  const arr = S.兼任||[];
  if(!arr.length) return null;
  const hp = arr.filter(x=>x.highProfile);
  return hp.length ? hp : null;
}

/* 判断当前职务是否属于「机构建制 ≠ 个人级别」的高配情形 */
function highProfileNote(title){
  if(!title) return null;
  const t = title.toString();
  // 按从高到低匹配（省级优先，避免"省纪委书记"被"县纪委书记"规则误伤）
  if(t.includes("省委政法委书记") || t.includes("省纪委书记·政法委书记")) return ORG_VS_PERSON.province_political;
  if(t.includes("省纪委书记")) return ORG_VS_PERSON.province_discipline;
  if(t.includes("市委政法委书记")) return ORG_VS_PERSON.city_political;
  if(t.includes("县政法委书记")) return ORG_VS_PERSON.county_political;
  if(t.includes("县纪委书记")) return ORG_VS_PERSON.county_discipline;
  return null;
}

/* ---------- 兼任高配：申请 / 辞去 ---------- */
function applyConcurrent(id){
  const RAW = CONCURRENT_POSTS.find(p=>p.id===id);
  if(!RAW) return;
  const P = resolveConcurrent(RAW);
  if(!S.兼任) S.兼任 = [];
  if(S.兼任.length>=2){ addToast("最多兼任2个职务"); return; }
  if(S.兼任.some(x=>x.id===id)) return;
  const req = P.req||{};
  if(req.道德 && S.道德<req.道德){ addToast(`道德不足（需${req.道德}）`); return; }
  if(req.能力 && S.能力<req.能力){ addToast(`能力不足（需${req.能力}）`); return; }
  S.兼任.push({id:P.id, post:P.post, organ:P.organ, organLevel:P.organLevel,
                personLevel:P.personLevel, highProfile:P.highProfile, by:P.by,
                subProvincial:!!P.subProvincial, note:P.note||""});
  // 立即获得一次性收益
  const g = P.gain||{};
  if(g.治安) S.治安 = clamp(S.治安 + g.治安, 0, 100);
  if(g.GDP)  S.GDP  = clamp(S.GDP  + g.GDP,  0, 100);
  if(g.财政) S.财政 = clamp(S.财政 + g.财政, 0, 100);
  if(g.人脉) S.人脉 = (S.人脉||0) + g.人脉;
  if(g.能力) S.能力 = clamp(S.能力 + g.能力, 0, 100);
  if(g.上司好感) S.上司好感 = clamp(S.上司好感 + g.上司好感, 0, 100);
  if(g.廉政积分) S.廉政积分 = (S.廉政积分||0) + g.廉政积分;
  addToast("兼任："+P.post);
  pushLog(`组织决定：你以【${P.by}】身份<b>兼任${P.post}</b>。${P.highProfile?`（高配：${P.organ}建制为${P.organLevel}，你个人为${P.personLevel}）`:""}`);
  save(); renderTopbar(); renderMain(curTab);
}

function resignConcurrent(id){
  if(!S.兼任) return;
  const P = CONCURRENT_POSTS.find(p=>p.id===id);
  const cur = (S.兼任||[]).find(x=>x.id===id);
  S.兼任 = S.兼任.filter(x=>x.id!==id);
  if(cur){
    pushLog(`你辞去了兼任的【${cur.post}】，得以将精力集中到主职上。`);
    addToast("已辞去："+cur.post);
  } else if(P){
    pushLog(`你辞去了兼任的【${P.post}】，得以将精力集中到主职上。`);
    addToast("已辞去："+P.post);
  }
  save(); renderTopbar(); renderMain(curTab);
}

/* 兼任带来的月度收益与消耗 */
function concurrentMonthlyEffect(){
  let 政绩加成 = 0, 健康消耗 = 0;
  (S.兼任||[]).forEach(x=>{
    const P = CONCURRENT_POSTS.find(p=>p.id===x.id);
    if(!P) return;
    const g = P.gain||{}, c = P.cost||{};
    政绩加成 += (g.政绩产出||0);
    健康消耗 += (c.健康||0);
  });
  return {政绩加成, 健康消耗};
}

/* ---------- 任职地分配与地域回避 ---------- */
function assignLocation(notify){
  const layer = rankLayer(S.rank);
  const tier = locationTierFor(layer);
  const cur = S.任职地;
  // 层级未变则保留原任职地
  if(cur && cur.tier===tier) return;
  const homeProv = (S.hometownProvince||"");
  const loc = pickLocation(S.rank, homeProv);
  if(!loc) return;
  S.任职地 = Object.assign({}, loc, {tier});
  S.地域回避提示 = false;
  if(notify){
    const where = loc.city ? `${loc.prov}${loc.city}${loc.name}` : `${loc.prov||""}${loc.name}`;
    pushLog(`组织安排你赴 <b>${where}</b> 任职${loc.tag?`（${loc.tag}）`:""}。`);
    if(loc.desc) pushLog(`　　${loc.desc}`);
  }
}

/* 地域回避检查：县处级正职（县长/县委书记）等岗位不得在成长地担任 */
const AVOIDANCE_LAYERS = ["县处级正职"];
function checkAvoidance(){
  if(!S.任职地 || !S.hometownProvince) return null;
  const layer = rankLayer(S.rank);
  if(!AVOIDANCE_LAYERS.includes(layer)) return null;
  const prov = S.任职地.prov || "";
  const home = S.hometownProvince || "";
  if(!prov || !home) return null;
  const same = (prov===home) || (home.startsWith(prov.slice(0,2))) || (prov.startsWith(home.slice(0,2)));
  if(!same) return null;
  return {
    post: rankTitle(S.rank),
    place: S.任职地.name,
    prov: prov,
    home: home,
    desc:"按照党政领导干部回避制度，担任县（市）委书记、县（市）长以及县（市）纪检、组织、法院、检察院、公安部门主要领导职务的，一般不得在本人成长地担任。",
  };
}

/* 执行地域回避：交流到其他地区 */
function doAvoidanceTransfer(){
  const homeProv = S.hometownProvince||"";
  const tier = S.任职地 ? S.任职地.tier : locationTierFor(rankLayer(S.rank));
  const pool = (LOCATIONS[tier]||[]).filter(l=>l.prov && l.prov!==homeProv && !homeProv.startsWith(l.prov.slice(0,2)));
  if(!pool.length){ S.地域回避提示 = true; return; }
  const old = S.任职地;
  S.任职地 = Object.assign({}, pool[Math.floor(Math.random()*pool.length)], {tier});
  S.地域回避提示 = true;
  S.人脉 = Math.max(0, (S.人脉||0) - 10);   // 异地交流，人脉受损
  pushLog(`【地域回避】你主动申请异地交流，由 ${old?old.name:"原地"} 调往 <b>${S.任职地.name}</b>（${S.任职地.prov}）任职。熟悉的人脉网络需要重新开始（人脉-10）。`);
  addToast("已落实地域回避：异地交流");
  save(); renderTopbar(); renderMain(curTab);
}

/* 不回避：承担违规风险 */
function doAvoidanceStay(){
  S.地域回避提示 = true;
  S.道德 = clamp(S.道德 - 8, 0, 100);
  pushLog(`【地域回避】你选择留在成长地任职，虽有本土优势，但违反了领导干部地域回避规定，组织上对此有看法（道德-8）。`);
  addToast("未落实地域回避：道德-8");
  save(); renderTopbar(); renderMain(curTab);
}

/* 按职级层次返回可选的部门层级 */
function deptTierFor(layer){
  if(layer==="试用期"||layer==="科员级"||layer==="股所级") return "乡镇/街道级";
  if(layer==="乡科级副职"||layer==="乡科级正职") return "乡镇/街道级";
  if(layer==="县处级副职"||layer==="县处级正职") return "县/区级";
  if(layer==="厅局级副职"||layer==="厅局级正职") return "市/厅级";
  if(layer==="省部级副职"||layer==="省部级正职") return "省/部级";
  return "中央/国家级";
}

/* 为当前职级随机分配一个所属部门 */
function pickDepartment(rank){
  const layer = rankLayer(rank);
  const tier = deptTierFor(layer);
  const pool = DEPT_LIBRARY[tier] || DEPT_LIBRARY["乡镇/街道级"];
  if(!pool || !pool.length) return null;
  return Object.assign({}, pool[Math.floor(Math.random()*pool.length)], {tier});
}

/* 取当前层级全部可选部门 */
function availableDepartments(){
  const tier = deptTierFor(rankLayer(S.rank));
  return (DEPT_LIBRARY[tier]||[]).map(d=>Object.assign({}, d, {tier}));
}

/* 分配部门并写入日志 */
function assignDepartment(notify){
  const tier = deptTierFor(rankLayer(S.rank));
  const cur = S.部门;
  if(cur && cur.tier===tier) return;   // 层级未变则保留
  const d = pickDepartment(S.rank);
  if(!d) return;
  S.部门 = d;
  S.部门履历 = S.部门履历 || [];
  S.部门履历.push({name:d.name, cat:d.cat, rank:S.rank});
  if(notify){
    pushLog(`组织安排你到 <b>${d.name}</b> 工作。${d.func}`);
    addToast("所属部门："+d.name);
  }
}

/* 主动调动部门（同层级内） */
function transferDepartment(name){
  const tier = deptTierFor(rankLayer(S.rank));
  const pool = DEPT_LIBRARY[tier]||[];
  const d = pool.find(x=>x.name===name);
  if(!d) return;
  const old = S.部门;
  if(old && old.name===name){ addToast("已在该部门"); return; }
  S.部门 = Object.assign({}, d, {tier});
  S.部门履历 = S.部门履历 || [];
  S.部门履历.push({name:d.name, cat:d.cat, rank:S.rank});
  S.人脉 = Math.max(0, (S.人脉||0) - 8);    // 换部门，人脉需重建
  S.能力 = clamp((S.能力||0) + 3, 0, 100);  // 新岗位带来新锻炼
  pushLog(`【岗位交流】你由 ${old?old.name:"原部门"} 调任 <b>${d.name}</b>。熟悉的人脉需要重新开始（人脉-8），但新岗位锻炼了能力（能力+3）。`);
  addToast("已调任："+d.name);
  save(); renderTopbar(); renderMain(curTab);
}

/* 部门月度加成 */
function departmentMonthlyEffect(){
  if(!S.部门) return {加成:{}, 廉政:0};
  const e = DEPT_EFFECT[S.部门.cat] || {};
  return {加成:e, 廉政:(e.廉政积分||0), cat:S.部门.cat};
}

/* 当前职务显示：部委任职显示部委职务；副国级/正国级显示分支职位 */
function rankTitle(rank){
  const r = RANKS[rank||0]; if(!r) return "—";
  // 副国级（国家级副职）：按所选方向显示具体职位
  if(S && S.natPath && S.natPath.vice && r[1]==="国家级副职"){
    const P = VICE_NATIONAL_PATHS[S.natPath.vice];
    if(P){
      const viceIdx = ["国务委员 / 全国政协副主席","国务院副总理 / 中共中央政治局委员","国家副主席"].indexOf(r[0]);
      if(viceIdx>=0 && P.titles[viceIdx]) return P.titles[viceIdx];
    }
  }
  // 正国级：按政治局常委席位显示完整头衔（含兼任）
  if(S && S.natPath && S.natPath.top && r[1]==="国家级正职"){
    const P = TOP_NATIONAL_POSITIONS[S.natPath.top];
    if(P){
      if(rank>=RANKS.length-1) return P.fullTitle;      // 顶层：完整头衔
      if(rank===RANKS.length-2) return "中共中央政治局常委"; // 入常：尚未就任具体职位
    }
  }
  if(S && S.dept && r[5] && r[5]!=="—") return r[5];
  return r[0];
}
/* 行政层次标签 */
function rankLayer(rank){
  const r = RANKS[rank||0]; return r ? r[1] : "—";
}
/* 公务员职级（虚职） */
function rankGrade(rank){
  const r = RANKS[rank||0]; return r ? r[4] : "—";
}

/* 级联：根据所选省份刷新城市下拉 */
function updateCities(){
  const pvEl=$("ci_province"), ctEl=$("ci_city");
  if(!pvEl||!ctEl) return;
  const cities=PROVINCE_CITY[pvEl.value]||[];
  ctEl.innerHTML=cities.map(c=>`<option>${c}</option>`).join("");
}
/* 籍贯全称：省 + 市（直辖市/特别行政区只显示一次） */
function hometownFull(prov, city){
  if(!prov) return "";
  if(!city || prov===city) return prov;
  if(prov==="北京市"||prov==="天津市"||prov==="上海市"||prov==="重庆市"||
     prov.indexOf("特别行政区")>=0) return prov;
  return prov + " " + city;
}

/* ---- 存储层：兼容 file:// 离线打开（localStorage 可能被浏览器禁用） ---- */
const MEM = {};             // 内存兜底：localStorage 不可用时暂存进度
let storageOK = true;       // localStorage 是否可用
try {
  const probe = "__qlp_probe__";
  localStorage.setItem(probe, "1");
  localStorage.removeItem(probe);
} catch(e) {
  storageOK = false;        // Safari/某些浏览器 file:// 下会禁用
}

function _rawSet(k, v){
  if(storageOK){ try{ localStorage.setItem(k, v); return true; }catch(e){ storageOK=false; } }
  MEM[k] = v;               // 降级到内存（本次会话仍可存档/续玩）
  return false;
}
function _rawGet(k){
  if(storageOK){ try{ const v = localStorage.getItem(k); if(v!==null) return v; }catch(e){ storageOK=false; } }
  return MEM[k] || null;
}
function _rawDel(k){
  if(storageOK){ try{ localStorage.removeItem(k); }catch(e){ storageOK=false; } }
  delete MEM[k];
}

function save(){ _rawSet("qlp_top", JSON.stringify(S)); }
function load(){
  const t = _rawGet("qlp_top");
  if(t){ try{ S = JSON.parse(t); }catch(e){ _rawDel("qlp_top"); } }
  // 旧存档兼容：补齐后续版本新增的字段
  if(S){
    if(S.兼任===undefined) S.兼任 = [];
    if(S.部门履历===undefined) S.部门履历 = [];
    if(!S.部门){ try{ assignDepartment(false); }catch(e){} }
    if(!S.财政数据){ try{ refreshFiscal(); }catch(e){} }
    if(!S.管辖区域){ try{ refreshJurisdiction(); }catch(e){} }
    if(S.在建项目===undefined) S.在建项目 = [];
    if(!S.领导班子){ try{ generateLeadership(); }catch(e){} }
    if(S.地域回避提示===undefined) S.地域回避提示 = false;
    if(S.基层月数===undefined) S.基层月数 = 0;
    if(!S.任职地){ try{ assignLocation(false); }catch(e){} }
  }
}
function hasSave(){ return !!_rawGet("qlp_top"); }
function clearSave(){ _rawDel("qlp_top"); }

/* 统一收敛所有数值指标到合理区间（部委技能等大额增减后调用） */
function clampAll(){
  if(!S) return;
  const range = {
    能力:[0,999], 政绩:[0,99999], 政绩点:[0,9999],
    道德:[0,100], 健康:[0,100], 人脉:[0,100], 上司好感:[0,100],
    财政:[0,100], GDP:[0,100], 民生:[0,100], 生态:[0,100],
    营商:[0,100], 治安:[0,100], 廉政积分:[0,999], 法治:[0,100],
    国际声望:[0,100], 科创:[0,100], 金融风险:[0,100], 科技长期:[0,99],
    partyRep:[0,100], neutralRep:[0,100], reformRep:[0,100],
  };
  Object.keys(range).forEach(k=>{
    if(typeof S[k]==='number'){ S[k]=clamp(Math.round(S[k]), range[k][0], range[k][1]); }
  });

/* 每月结算 */
function monthlySettlement(){
  const r=S.rank>=6?0.6:1; // 前期事件密集
  // 自然衰减/增长
  // 轮岗适应期：政绩产出下降50%（政绩真空期）
  const adapt = (S.rotation && S.rotation.adaptation>0) ? 0.5 : 1;
  // 政绩积累 = 六项实绩考核加权综合得分 × 系数（不再唯GDP论）
  S.政绩 += Math.round(performanceScore()*r*0.15*adapt);
  // 适应期倒计时
  if(S.rotation && S.rotation.adaptation>0){
    S.rotation.adaptation--;
    if(S.rotation.adaptation===0){
      pushLog("✅ 轮岗适应期结束：你已完全熟悉新部门业务，政绩产出恢复正常。");
      addToast("📈 适应期结束，政绩产出恢复");
    }
  }
  // Buff：懂基层的部委大员（政策接地气，不易引发群体性事件）
  if(hasBuff('grassroots_insight')){
    S.民生 = clamp(S.民生 + 0.5, 0, 100);
    S.治安 = clamp(S.治安 + 0.5, 0, 100);
  }
  // 领导班子影响：直接上司关系度影响月度人际评价
  {
    const L = S.领导班子;
    if(L && L.members && L.members.length){
      const boss = S.一把手, direct = S.直接上司;
      if(direct && typeof direct.relation === "number"){
        // 直接上司关系每偏离50点1度，影响好感0.03
        S.上司好感 = clamp((S.上司好感||0) + (direct.relation-50)*0.03, 0, 100);
      }
      if(boss && typeof boss.relation === "number"){
        S.上司好感 = clamp((S.上司好感||0) + (boss.relation-50)*0.02, 0, 100);
      }
      // 廉政风险暴露度累积：纪检干部会盯上
      if((S.廉政风险暴露||0) > 0){
        const disc = S.纪检负责人;
        if(disc && disc.relation < 40 && Math.random() < 0.08){
          S.道德 = clamp(S.道德 - 6, 0, 100);
          pushLog(`⚠ 派驻纪检监察组对你的一些做法提出了提醒，要求你注意廉洁自律。`);
        }
        // 每月自然衰减（风头过去）
        S.廉政风险暴露 = Math.max(0, S.廉政风险暴露 - 1);
      }
    }
  }
  // 部门月度加成（按部门类别影响指标与廉政积分）
  {
    const de = departmentMonthlyEffect();
    const a = de.加成 || {};
    if(a.GDP)   S.GDP   = clamp(S.GDP   + a.GDP,   0, 100);
    if(a.财政)  S.财政  = clamp(S.财政  + a.财政,  0, 100);
    if(a.治安)  S.治安  = clamp(S.治安  + a.治安,  0, 100);
    if(a.民生)  S.民生  = clamp(S.民生  + a.民生,  0, 100);
    if(a.人脉)  S.人脉  = (S.人脉||0) + a.人脉;
    if(a.能力)  S.能力  = clamp(S.能力  + a.能力,  0, 100);
    if(a.道德)  S.道德  = clamp(S.道德  + a.道德,  0, 100);
    if(a.上司好感) S.上司好感 = clamp(S.上司好感 + a.上司好感, 0, 100);
    if(a.政绩产出) S.政绩 = Math.round(S.政绩 * (1 + a.政绩产出));
    if(S.route==='discipline' && de.廉政) S.廉政积分 = (S.廉政积分||0) + de.廉政;
  }
  // 城市建设项目月度推进
  advanceProjects();
  // 一票否决事项：触及则政绩与晋升资格受严重影响
  {
    const vs = vetoCheck();
    if(vs.length){
      S.政绩 = Math.max(0, S.政绩 - 30*vs.length);
      S.上司好感 = clamp((S.上司好感||0) - 10*vs.length, 0, 100);
      if(!S.一票否决次数) S.一票否决次数 = 0;
      S.一票否决次数 += vs.length;
      pushLog(`⛔ <b>一票否决</b>：${vs.map(v=>v.t).join('、')}。本月政绩 -${30*vs.length}，上级评价下降。`);
      addToast("⛔ 触及一票否决事项");
    }
  }
  // 基层工作经历累积：县处级副职（索引11）以下岗位计入基层经历
  if(!S.基层月数) S.基层月数 = 0;
  if(S.rank < 11){ S.基层月数 += 1; }
  // 兼任职务的月度收益与消耗
  {
    const ce = concurrentMonthlyEffect();
    if(ce.政绩加成>0){
      S.政绩 = Math.round(S.政绩 * (1 + ce.政绩加成));
    }
    if(ce.健康消耗>0){
      S.健康 = clamp(S.健康 - ce.健康消耗, 0, 100);
    }
  }
  S.健康 = clamp(S.健康 - (S.rank>=22?0:1) - (S.健康>90?0:0), 0, 100);
  // 指标缓慢回归
  const drift=(cur,target)=> cur + (target-cur)*0.03;
  S.生态=clamp(drift(S.生态,65),0,100);
  S.治安=clamp(drift(S.治安,60),0,100);
  // 部委专属技能冷却递减
  if(S.deptCd){ Object.keys(S.deptCd).forEach(k=>{ if(S.deptCd[k]>0) S.deptCd[k]--; }); }
  S.month++;
  if(S.month>12){
    S.month=1; S.year++;
    const gain = Math.floor(S.政绩/100);
    S.政绩点 += hasBuff('multi_post') ? Math.ceil(gain*1.2) : gain;  // 复合型干部+20%
  }
  // ==== 选调生墩苗计时 ====
  if(S.mode==='selective' && S.dunmiao && !S.returned){
    S.dunmiaoMonths = (S.dunmiaoMonths||0) + 1;
    if(S.dunmiaoMonths >= 24){
      // 墩苗期满：100%回流部委 + 火箭晋升
      S.dunmiao = false; S.returned = true;
      promoteBy(2); // 回流破格晋升（模拟"火箭晋升"）
      S.政绩 += 50; S.上司好感 += 30; S.人脉 += 20;
      pushLog("🎖️ 墩苗2年考核优秀，100%调回中央部委定岗，进入『火箭式』轮岗培养（职级跃升）。");
      addToast("🔥 回流部委 · 火箭晋升");
      // 回流后分配具体部委
      setTimeout(()=>{ openDeptChoice(); }, 400);
    }
  }
  // 健康检查
  if(S.健康<=0){ endGame("积劳成疾"); return; }
  if(S.道德<=0){ endGame("身陷囹圄"); return; }
  save();
}

/* 检查晋升 */
/* 晋升条件明细（供 UI 展示与判定共用） */
function promotionStatus(){
  const need=RANKS[S.rank+1];
  if(!need) return null;
  const months=S.month + (S.year-2026)*12;
  const routeBonus = S.route==='youth'? 0.85 : 1;
  const needMonths = Math.round(need[3] * routeBonus);
  const 廉政达标 = S.route==='discipline' && (S.廉政积分||0)>=30;
  // ===== 现实规则：破格提拔 =====
  // 特别优秀（政绩远超标准 + 能力出众 + 道德过硬）可突破任职资格规定
  const 政绩溢出 = S.政绩 / (need[2]||1);
  const 破格候选 = 政绩溢出>=1.5 && S.能力>=75 && S.道德>=60;
  const 年限缺口 = Math.max(0, needMonths - months);
  // 破格最多可免除 40% 的年限要求
  const 破格OK = 破格候选 && (months >= Math.ceil(needMonths*0.6));
  // ===== 现实规则：基层工作经历（提任县处级需2年以上）=====
  const 目标层次 = need[1];
  const 需要基层经历 = ["县处级副职","县处级正职","厅局级副职","厅局级正职",
                     "省部级副职","省部级正职","国家级副职","国家级正职"].includes(目标层次);
  const 基层月数 = S.基层月数 || 0;
  const 基层OK = !需要基层经历 || 基层月数>=REAL_PROMOTION_YEARS.countyLevel.基层经历;
  return {
    need, months, needMonths,
    政绩OK: S.政绩>=need[2],
    年限OK: months>=needMonths,
    道德OK: S.道德>=30,
    上司OK: (S.上司好感>=40) || 廉政达标,
    廉政达标,
    破格候选, 破格OK, 年限缺口, 需要基层经历, 基层OK, 基层月数,
    nextTitle: rankTitle(Math.min(S.rank+1, RANKS.length-1)),
    nextLayer: rankLayer(Math.min(S.rank+1, RANKS.length-1)),
  };
}

function checkPromotion(){
  const need=RANKS[S.rank+1];
  if(!need) return;
  const req政绩 = need[2], req年限 = need[3];
  const months=S.month + (S.year-2026)*12;
  const routeBonus = S.route==='youth'? 0.85 : 1;
  const needMonths = Math.round(req年限 * routeBonus);
  const cond1=S.政绩>=req政绩, cond2=months>=needMonths, cond3=S.道德>=30, cond4=S.上司好感>=40;
  // 纪检政法路线：廉政积分达标可突破"上司好感"门槛（反腐干部口碑加成）
  const ps = promotionStatus();
  // 破格提拔：年限未达标但符合条件时，允许放行（现实：特别优秀可突破任职资格规定）
  const cond2Final = cond2 || (ps && ps.破格OK && ps.基层OK);
  const routeCond = S.route==='discipline' ? (S.廉政积分>=30 || S.上司好感>=40) : true;
  const finalCond4 = S.route==='discipline' ? (S.上司好感>=40 || S.廉政积分>=30) : cond4;
  // 基层工作经历不达标则无法晋升（现实：提任县处级需2年以上基层经历）
  const finalCond5 = ps ? ps.基层OK : true;
  if(cond1&&cond2Final&&cond3&&finalCond4&&finalCond5){
    // 破格提拔提示（现实：特别优秀可突破任职资格规定）
    if(!cond2 && cond2Final){
      pushLog(`【破格提拔】你的政绩与能力特别突出，经组织批准突破任职资格年限规定，提前晋升（仍需基层经历达标）。`);
    }
    if(S.rank===12 && !S.route){
      // 选调生 / 基层扎根模式：不强制在县委常委节点选传统四路线，各自有专属路径
      if(S.mode==='selective' || S.mode==='grassroots'){
        S.route = (S.mode==='selective') ? 'admin' : 'party'; // 给一个默认归属，不影响玩法
        pushLog(`（${MODES[S.mode].name}）你在关键节点延续了专属培养路径，未走传统路线分支。`);
      } else {
        openRouteChoice(); return;
      }
    }
    // 纪检路线：晋升时消耗廉政积分转化为政绩点奖励
    if(S.route==='discipline' && S.廉政积分>0){
      const bonus=Math.min(S.廉政积分, 20);
      S.政绩点+=Math.floor(bonus/5);
      pushLog(`凭借扎实的廉政口碑，你的晋升考核获得额外认可（廉政积分+${Math.floor(bonus/5)}政绩点）。`);
      S.廉政积分-=bonus;
    }
    doPromote();
  }
}
function doPromote(){
  S.rank++;
  const ttl=rankTitle(S.rank), lyr=rankLayer(S.rank), grd=rankGrade(S.rank);
  addToast("🎉 晋升："+ttl);
  pushLog(`晋升为【${ttl}】（${lyr}${grd&&grd!=="—"?" · "+grd:""}）`);
  // 股所级：说明其并非法定领导职务层次
  if(lyr==="股所级"){
    pushLog(`（注：${GRASSROOT_NOTE}）`);
  }
  // 高配职务：说明机构建制 ≠ 个人级别
  const hp = highProfileNote(ttl);
  if(hp){
    pushLog(`（注：${hp.desc}）`);
  }
  // 晋升奖励
  S.能力+=5; S.政绩点+=3; S.上司好感+=10; S.cash+=60;
  // 到达顶层（正国级）：先选择终极职位，再结算结局
  if(S.rank>=RANKS.length-1){
    S.natPath = S.natPath || {};
    if(!S.natPath.top){ save(); setTimeout(()=>{ openTopNationalChoice(); }, 500); return; }
    endGame("大国领袖"); return;
  }
  save();
  // ==== 职级变动后重新分配现实任职地（层级跨档时才换地方）====
  assignLocation(true);
  // ==== 部门随层级调整（层级跨档时才换部门层级）====
  {
    const oldDept = S.部门;
    const oldDeptName = oldDept ? oldDept.name : null;
    assignDepartment(true);
    // 部门变化 → 领导班子随之调整（现实中"新官上任"面对的班子可能不同）
    if(S.部门 && oldDeptName !== S.部门.name){
      const oldBoss = S.一把手 ? S.一把手.name : null;
      generateLeadership();
      pushLog(`随着岗位变动，你进入新的领导班子。新的正职是 <b>${S.一把手?S.一把手.name+S.一把手.title:"—"}</b>`
        + `，直接上司是 <b>${S.直接上司?S.直接上司.name+S.直接上司.title:"—"}</b>。`);
    }
    // 财政与管辖区域随层级刷新
    refreshFiscal();
    refreshJurisdiction();
    if(S.部门 && (!oldDept || oldDept.name!==S.部门.name)){
      S.部门履历 = S.部门履历 || [];
      S.部门履历.push({name:S.部门.name, cat:S.部门.cat, rank:S.rank});
    }
  }

  // ==== 进入政治局常委会（正国级）：由中央委员会全体会议选举产生 ====
  if(S.rank===50){
    addToast("🌟 当选中共中央政治局常委");
    pushLog("党的全国代表大会闭幕后，中央委员会全体会议选举你为中共中央政治局常务委员会委员——你由此进入党和国家最高领导集体，成为正国级领导人。");
  }
  // ==== 副国级方向选择（晋升至首个国家级副职时触发）====
  if(S.rank===47){
    S.natPath = S.natPath || {};
    if(!S.natPath.vice){
      save();
      setTimeout(()=>{ openViceNationalChoice(); }, 500);
      return;
    }
  }
  // ==== 跨部委轮岗触发（副处级/正处级）====
  if(S.dept && ROTATION_RANKS.includes(S.rank)){
    S.rotation = S.rotation || {};
    S.rotation.triggeredRanks = S.rotation.triggeredRanks || [];
    if(!S.rotation.triggeredRanks.includes(S.rank)){
      S.rotation.triggeredRanks.push(S.rank);
      save();
      setTimeout(()=>{ openRotationChoice(); }, 600);
    }
  }
}

/* 加权随机选事件（避免重复太频繁，路线偏好加权） */
let lastEventId=null, recentEventIds=[];
function pickEvent(){
  const recencyWindow=5;
  // 归一化池：统一转为 {e,w}（w 至少为 1），彻底避免原始对象/包装对象混淆
  // 部委专属危机事件：仅当玩家已归属该部委时才进入池子
  const myDept = (S && S.dept) ? S.dept : null;
  let pool=EVENTS.filter(e=>!recentEventIds.includes(e.id))
                 .filter(e=> !e.dept || e.dept===myDept)
                 .filter(e=> !e.cond || (S && e.cond(S)))   // 前置条件（如长期主义回报）
                 .map(e=>({e,w:1}));
  if(pool.length < EVENTS.length/2) recentEventIds=[]; // 池太小时重置近期列表
  if(!pool.length){ recentEventIds=[]; pool=EVENTS.map(e=>({e,w:1})); } // 兜底：池空则全量重开
  // 路线 / 开局模式偏好加权
  if(S && S.route){
    pool.forEach(item=>{
      const e=item.e; let w=item.w;
      if(S.route==='discipline' && e.route==='discipline') w=4.5;
      else if(S.route==='party' && e.id==='promotion_eval') w=3;
      else if(S.route==='admin' && (e.id==='invest'||e.id==='economic_pressure')) w=3;
      else if(S.route==='youth' && (e.id==='school'||e.id==='promotion_eval')) w=2.5;
      if(S.rank>=22 && (e.id==='economic_pressure'||e.id==='national_plan'||e.id==='corruption_case')) w=2.5;
      if(S.mode==='selective'){
        if(e.route==='selective') w=(e.weight||3)*2;
        if(S.dunmiao && e.id==='sel_dunmiao') w=8;
        if(!S.dunmiao && S.returned && (e.id==='sel_plan_draft'||e.id==='sel_crosspost')) w=6;
      }
      if(S.mode==='grassroots'){
        if(e.route==='grassroots') w=(e.weight||3)*2;
        if(e.id==='invest'||e.id==='economic_pressure') w*=0.4;
      }
      // ---- 所属部委：专属危机事件加权（回流部委后生效） ----
      if(S.dept && e.dept===S.dept){
        w = Math.max(w, 7);
        // 跨部门协作与博弈：中期核心挑战，副处级以上大幅加权
        if(e.id && e.id.indexOf('clash_')===0 && S.rank>=5) w = Math.max(w, 10);
      }
      item.w=w;
    });
  }
  // 加权随机选取
  const total=pool.reduce((a,b)=>a+b.w,0);
  let r=Math.random()*total, chosen=null;
  for(const item of pool){ r-=item.w; if(r<=1e-9){ chosen=item.e; break; } }
  if(!chosen) chosen=pool[pool.length-1].e; // 浮点精度兜底
  recentEventIds.push(chosen.id);
  if(recentEventIds.length>recencyWindow) recentEventIds.shift();
  return chosen;
}

      </div>
      <div class="mini muted" style="margin-top:6px">👆 点任一指标查看财政口径说明</div>

      <div style="margin-top:8px;border:1px solid ${debtColor};border-radius:4px;padding:7px;background:#fafafa">
        <div class="mini" style="color:${debtColor};font-weight:700">债务风险等级：${debtTag}（${debt}%）</div>
        <div class="mini muted" style="margin-top:2px">

        <div class="stat"><span class="lbl">辖区人口</span><div class="n">${j.人口}<span style="font-size:11px;color:#888">${j.人口单位}</span></div></div>
      </div>
      <div class="mini" style="margin-top:8px;line-height:1.7;color:#555">

        <b>下级主官</b>：${j.下级主官}

      <div class="mini muted" style="margin-top:6px;line-height:1.6">${j.说明}</div>

      </div>

        const blocked = !afford || doing || (debt>=120 && p.财政依赖>=0.8);

          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">

            </div>
            <button class="btn mini-btn" data-act="build" data-pid="${p.id}" ${blocked?'disabled':''}
              style="padding:4px 10px;font-size:12px;${blocked?'opacity:0.5':''}">
              <span class="bt">${doing?'在建':(afford?'立项':'资源不足')}</span>
            </button>
          </div>
          <div class="mini" style="color:#666;line-height:1.6;margin-top:4px">${p.desc}</div>
          <div class="mini" style="color:#35618a;margin-top:3px">预期：${Object.keys(p.gain||{}).map(k=>k+'+'+p.gain[k]).join(' ')}</div>
          <div class="mini" style="color:#a05;margin-top:2px">⚠ 风险：${p.risk}</div>
          <div class="mini muted" style="margin-top:3px;font-size:10px;line-height:1.5">${p.note}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  return html;
}

  return {html, acts};
}

let _acts=[];
function renderMain(tab){
  const main=$("main");
  if(tab) curTab = tab;          // 同步当前页签，便于各处回调正确重绘
  if(S.gameOver){ renderEnding(); return; }
  let h="";
  if(tab==='event' || !tab){
    h+=pEvent();
    h+=pStats();
  } else if(tab==='action'){
    const {html,acts}=pAction(); _acts=acts; h+=html; h+=pStats();
  } else if(tab==='city'){
    h+=pCity();
  } else if(tab==='faction'){
    h+=pFaction(); h+=pLeadership(); h+=pStats();
  } else if(tab==='archive'){
    h+=renderArchive();
  }
  main.innerHTML=h;
  bindActions();
}

function bindActions(){
  document.querySelectorAll('[data-act="choose"]').forEach(b=>{
    b.onclick=()=>{
      const eid=b.dataset.eid, idx=+b.dataset.idx;
      const e=EVENTS.find(x=>x.id===eid);
      const opt=e.opts[idx];
      const snap={道德:S.道德, 政绩:S.政绩, 政绩点:S.政绩点, 改革派:S.reformRep};
      const result=opt.fn(S);
      // 纪检政法路线：道德获取 +20%（持续机制，仅放大增益，不放大减损）
      if(S.route==='discipline'){
        const dGain=S.道德 - snap.道德;
        if(dGain>0){ S.道德 = Math.round(S.道德 + dGain*0.2); }
        // 反腐类抉择（改革派声望增长）也享受加成
        const rGain=S.reformRep - snap.改革派;
        if(rGain>0){ S.reformRep = Math.round(S.reformRep + rGain*0.15); }
        // 廉政积分：廉洁抉择积累，反腐抉择额外加成（专属机制）
        const eDef=EVENTS.find(x=>x.id===eid);
        if(dGain>0){ S.廉政积分 = (S.廉政积分||0) + Math.round(dGain*0.5); }
        if(eDef && eDef.route==='discipline'){ S.廉政积分 = (S.廉政积分||0) + 8; }
      }
      // 政绩点奖励
      S.政绩+=8; S.政绩点+=1;
      showResult(e,opt);
      save();

  document.querySelectorAll('[data-fisc]').forEach(el=>{

/* 事件处置效果判定：以"是否损害公共利益"为粗略标准
   判断依据：道德、民生、治安、生态的净变化 */
function buildLevelFeedback(eid, opt){
  const A = eventAttr(eid);
  if(A.lv === "N") return "";
  const lv = A.level;

  // 计算该选项对关键指标的净影响
  const probe = {};
  const snap = {道德:S.道德, 民生:S.民生, 治安:S.治安, 生态:S.生态, 政绩:S.政绩};
  try{
    const tmp = Object.assign({}, S);
    if(typeof opt.fn === "function") opt.fn(tmp);
    const d道德 = (tmp.道德??0) - (snap.道德??0);
    const d民生 = (tmp.民生??0) - (snap.民生??0);
    const d治安 = (tmp.治安??0) - (snap.治安??0);
    const d生态 = (tmp.生态??0) - (snap.生态??0);
    probe.net = d道德*0.4 + d民生*0.25 + d治安*0.2 + d生态*0.15;
  }catch(err){ return ""; }

  const good = probe.net >= 0;
  const delta = good ? lv.bonus : -lv.penalty;
  S.政绩 = Math.max(0, (S.政绩||0) + delta);
  if(good) { S.处置得当 = (S.处置得当||0)+1; } else { S.处置失当 = (S.处置失当||0)+1; }
  pushLog(`${good?"✅":"❌"} 【${lv.short}事件】${eidTitle(eid)}处置${good?"得当":"失当"}，政绩 ${delta>0?"+":""}${delta}。`);

  const c = good ? "#2f7d4f" : "#b01e23";
  return `<div style="margin-top:10px;border:1px solid ${c};border-radius:4px;padding:8px;background:${good?"#f5fbf7":"#fff5f5"}">
    <div style="font-weight:700;color:${c};font-size:13px">
      ${good?"✅ 处置得当":"❌ 处置失当"}　政绩 ${delta>0?"+":""}${delta}
    </div>
    <div class="mini" style="color:#666;margin-top:3px;line-height:1.6">
      ${good
        ? `你在${lv.short}事件中的处置符合应急预案要求，未造成次生影响。`
        : `该${lv.short}事件处置存在明显不足，公共利益受损，可能影响年度考核。`}
    </div>
  </div>`;
}

function doRotate(newDept){
  const oldDept = S.dept;
  const oldD = DEPARTMENTS[oldDept], newD = DEPARTMENTS[newDept];
  // 1) 硬技能冻结（旧部委专业技能）
  S.rotation.hardFrozen = oldD ? oldD.skills.map(x=>x.id) : [];
  // 2) 软技能保留并升级
  const ss = S.rotation.softSkills || {writing:1,crisis:1,mediate:1};
  ss.writing=(ss.writing||1)+1; ss.crisis=(ss.crisis||1)+1; ss.mediate=(ss.mediate||1)+1;
  S.rotation.softSkills = ss;
  // 3) 切换部委：新专业技能进入"学习期"（初始冷却）
  S.dept = newDept;
  S.deptCd = {};
  newD.skills.forEach(sk=>{ S.deptCd[sk.id] = sk.cd; });
  // 4) 代价：人脉断层 + 政治点数
  S.人脉 = clamp((S.人脉||0) - 15, 0, 100);
  S.cash = Math.max(0, (S.cash||0) - 40);
  // 5) 政绩真空期（适应期12个月）
  S.rotation.adaptation = 12;
  S.rotation.count = (S.rotation.count||0) + 1;
  S.rotation.history = S.rotation.history || [];
  S.rotation.history.push(oldDept);
  // 6) 增益判定
  S.rotation.buffs = S.rotation.buffs || [];
  const gained = [];
  if(newDept==='mee' && (oldDept==='ndrc'||oldDept==='mof') && !S.rotation.buffs.includes('green_finance')){
    S.rotation.buffs.push('green_finance'); gained.push(ROTATION_BUFFS.green_finance.name);
  }
  if((S.mode==='grassroots' || (S.dunmiaoMonths||0)>0) && !S.rotation.buffs.includes('grassroots_insight')){
    S.rotation.buffs.push('grassroots_insight'); gained.push(ROTATION_BUFFS.grassroots_insight.name);
  }
  if(S.rotation.history.length>=2 && !S.rotation.buffs.includes('multi_post')){
    S.rotation.buffs.push('multi_post'); gained.push(ROTATION_BUFFS.multi_post.name);
  }
  // 7) 专属指标初始化
  if(S.国际声望===undefined) S.国际声望=50;
  if(S.科创===undefined) S.科创=50;
  if(S.金融风险===undefined) S.金融风险=30;

  pushLog(`🔄 跨部委轮岗：${oldD.short} → ${newD.short}。软技能（${SOFT_SKILLS.map(x=>x.name).join('/')}）100%保留并升级；原专业技能「${oldD.skills.map(x=>x.name).join('、')}」已冻结，新技能需重新学习（12个月适应期，政绩产出-50%）。`);
  if(gained.length){
    pushLog("✨ 轮岗增益：" + gained.join('、') + "。");
    addToast("✨ 获得增益：" + gained.join('、'));
  }
  clampAll();
  save(); renderTopbar(); renderMain(curTab);
  // 新部门的第一天：感受不同的办公室文化
  setTimeout(()=>{ openDeptFirstDay(); }, 500);
}

      if(k==='miit'){ S.科创=(S.科创||50)+15; S.GDP+=8; }
      if(k==='mee'){ S.生态+=15; S.道德+=8; }
      pushLog(`组织分配：你被分配到【${d.name}】，施政流派：${d.school}，核心指标：${d.core}。`);
      addToast("🏛️ 分配至 " + d.short);
      $("modal").classList.remove("show");
      save(); renderTopbar(); renderMain(curTab);
      // 入职第一天：办公室政治
      setTimeout(()=>{ openDeptFirstDay(); }, 400);
    };
  });
}

/* ---------- 8. 路线选择 ---------- */
function openRouteChoice(){
  let opts="";
  Object.keys(ROUTES).forEach(k=>{
    const r=ROUTES[k];
    opts+=`<button class="btn" data-route="${k}"><span class="bt">${r.name}</span><span class="bd">${r.desc}（${r.buff}）</span></button>`;
  });
  $("modalTitle").textContent="🎯 关键抉择：选择晋升路线";
  $("modalBody").innerHTML=`<div class="event-text" style="text-indent:0">你在县委常委任上，需要明确自己的发展方向。路线将影响后续事件与晋升加成。</div>${opts}`;
  $("modal").classList.add("show");
  document.querySelectorAll('[data-route]').forEach(b=>{
    b.onclick=()=>{
      S.route=b.dataset.route;
      const r=ROUTES[S.route];
      // 路线初始加成
      if(S.route==='discipline'){S.道德+=15; S.廉政积分=(S.廉政积分||0);} // 纪检政法路线：开局获得"廉政积分"机制
      if(S.route==='admin'){S.GDP+=5;S.民生+=5;}
      if(S.route==='party')S.政绩+=30;
      if(S.route==='youth')S.上司好感+=15;
      pushLog(`选定路线：${r.name}`);
      addToast("路线已确定："+r.name);
      $("modal").classList.remove("show");
      save(); renderTopbar();
    };
  });
}

function endGame(type){

  const map={
    "大国领袖":{t:"🌟 大国领袖",d:"政绩卓越，道德无瑕。你带领国家实现伟大复兴，问鼎权力巅峰。这是最圆满的结局。"},

    "身陷囹圄":{t:"⚖️ 身陷囹圄",d:"道德底线失守，你在反腐败风暴中被查处。权力游戏的最终结局……"},
  };

    if(S.道德<50) ending=map["大国领袖"]; // 仍可算，但……

    ending={t:"🏛️ 实干家",d:"虽未走到最高位，但你在省长任上留下极佳口碑，造福一方。"};
  }
  if(type!=='积劳成疾'&&type!=='身陷囹圄'&&S.rank<10&&S.政绩>300){
    // 由结局函数统一管理
  }
  // ---- 正国级终极职位定制结局（按现实常委席位）----
  if(type==='大国领袖' && S.natPath && S.natPath.top){
    const P = TOP_NATIONAL_POSITIONS[S.natPath.top];
    if(P){
      const viceName = (S.natPath.vice && VICE_NATIONAL_PATHS[S.natPath.vice])
        ? VICE_NATIONAL_PATHS[S.natPath.vice].name : "—";
      let tail = "";

        tail = `你成为全党核心、军队统帅、人民领袖。${P.concurrent.join('、')}的职务集于一身，这是党和国家领导体制的最高体现。`;
      } else if(P.nature==="入常提级"){
        tail = `需要一提的是，${P.name}这一职务本身仅为国家级副职——你是因进入中共中央政治局常委会，才成为正国级领导人。`;
      } else {
        tail = `这是党和国家领导集体的核心席位之一，位居常委第${P.seat}位。`;
      }
      ending={t:P.icon+" "+P.name,
        d:`你走完了体制内最长的一条路。自试用期未定级的办事员起，历经科员、乡镇、县处、厅局、省部，直至当选中共中央政治局常委，就任【${P.fullTitle}】。${P.desc}${tail}（副国级阶段方向：${viceName}）`};
    }
  }
  // ---- 开局模式专属结局分支 ----
  if(S.mode==='selective' && type==='大国领袖' && !(S.natPath && S.natPath.top)){
    ending={t:"🎖️ 国之栋梁（选调生）",d:"你从中央选调生起步，历经墩苗扎根、部委回流与火箭式轮岗培养，最终成长为国之栋梁。这是精英路线的终极答卷。"};
  }
  if(S.mode==='selective' && S.returned && S.rank>=22){
    ending={t:"🚀 中枢干臣",d:"墩苗期满后你100%回流中央部委，凭借宏观政策视野与专项培养档案，在中枢岗位稳步晋升，成为决策核心的重要一员。"};
  }
  if(S.mode==='grassroots' && S.rank>=17){
    ending={t:"🌾 百姓的好官（扎根基层）",d:"你一生扎根基层，把一方水土治理得井井有条。虽然没有走上最高位，但群众把你的名字刻在了心坎上。"};
  }
  // ---- 轮岗专属结局分支 ----
  if(S.rotation && S.rotation.count>=2){
    ending={t:"🔄 复合型栋梁",d:`你在${S.rotation.count}个中央部委历练过，兼具宏观视野与专业深度。这种复合型履历，正是新时代领导干部最稀缺的品质。`};

    ending={t:"🏛️ 跨部门统帅",d:"历经三个以上部委的淬炼，你既能看懂经济模型，也读得懂干部档案。站在全局高度统筹协调，这是单一部门出身的干部难以企及的境界。"};
  }
  $("modalTitle").textContent=ending.t;
  $("modalBody").innerHTML=`
    <div class="result-box" style="border-style:solid">${ending.d}</div>
    <div class="mini center" style="margin-top:12px">

      任期：${S.year}年${S.month}月 · 路线：${S.route?ROUTES[S.route].name:"—"}
      ${S.mode==='selective'?`<br>墩苗：${S.dunmiaoMonths||0}个月 · 已${S.returned?'回流部委':'在基层'}`:""}
      ${S.dept?`<br>所属部委：<b>${DEPARTMENTS[S.dept].name}</b>（${DEPARTMENTS[S.dept].school}）`:""}

      ${S.部门?`<br>最后所在部门：<b>${S.部门.name}</b>（${S.部门.cat}）`:""}
      ${(S.处置得当||S.处置失当)?`<br>突发事件处置：得当 <b>${S.处置得当||0}</b> 次 · 失当 <b>${S.处置失当||0}</b> 次`:""}
      ${S.一票否决次数?`<br><b>⛔ 累计触及一票否决：${S.一票否决次数} 次</b>`:""}

  }
  // ==== 选调生：资格筛选 ====
  const schools=["北京大学","清华大学","中国人民大学","复旦大学","上海交通大学","浙江大学","南京大学","武汉大学","华中科技大学","中国科学技术大学","北京师范大学","天津大学","南开大学","山东大学","厦门大学","东南大学","中山大学","华南理工大学","哈尔滨工业大学","西安交通大学","吉林大学","四川大学","电子科技大学","中南大学","湖南大学","重庆大学","大连理工大学","西北工业大学","北京航空航天大学","北京理工大学","中国农业大学","华东师范大学","中央财经大学","中国政法大学"];
  let opt=""; schools.forEach(s=>{ opt+=`<option>${s}</option>`; });
  $("modalTitle").textContent="🎖️ 中央选调生 · 资格筛选";
  $("modalBody").innerHTML=`
    <div class="event-text" style="text-indent:0;font-size:12px">
      <b>「黄金开局 · 隐藏最高难度精英路线」</b><br>
      须同时满足以下四项硬性门槛，任一不达标即<b>无法选择此路线</b>：
      <ol style="padding-left:18px;line-height:1.8">
        <li>院校锁定：34所顶尖高校（32所985 + 中央财经/中国政法2所特殊211）</li>
        <li>政治面貌：中共党员（含预备党员）</li>
        <li>履历：连续担任学生干部满1年 + 校级及以上荣誉</li>
        <li>年龄：本科≤25 / 硕士≤28 / 博士≤30</li>
      </ol>
    </div>
    <div style="border:1px solid #ddd;border-radius:8px;padding:12px;margin-top:8px">
      <label style="display:block;margin:6px 0">姓名：<input id="ci_name" class="ipt" value="李为民" style="width:55%" maxlength="8" placeholder="请输入姓名"></label>
      <label style="display:block;margin:6px 0">性别：
        <select id="ci_gender" class="ipt"><option>男</option><option>女</option></select></label>
      <label style="display:block;margin:6px 0">年龄：
        <input id="ci_age" class="ipt" type="number" value="24" min="18" max="40" style="width:70px"> 岁
        <span id="ci_agetip" class="mini" style="margin-left:6px;color:#666"></span></label>
      <label style="display:block;margin:6px 0">籍贯：
        <select id="ci_province" class="ipt" onchange="updateCities()">${HOMETOWNS.map(h=>`<option>${h}</option>`).join("")}</select>
        <select id="ci_city" class="ipt" style="margin-top:4px"></select></label>
      <label style="display:block;margin:6px 0">毕业院校：<select id="ci_school" class="ipt">${opt}</select></label>
      <label style="display:block;margin:6px 0">学历：
        <select id="ci_edu" class="ipt">
          <option value="本科">本科（年龄≤25岁）</option>
          <option value="硕士">硕士（年龄≤28岁）</option>
          <option value="博士">博士（年龄≤30岁）</option>
        </select></label>
      <label style="display:block;margin:6px 0"><input type="checkbox" id="ci_party" checked> 中共党员（含预备）</label>
      <label style="display:block;margin:6px 0"><input type="checkbox" id="ci_cadre" checked> 连续学生干部满1年</label>
      <label style="display:block;margin:6px 0"><input type="checkbox" id="ci_honor" checked> 获校级及以上荣誉</label>
    </div>
    <button class="btn primary" id="ci_ok" style="margin-top:12px">提交资格审核</button>`;
  $("modal").classList.add("show");
  updateCities();   // 初始化城市下拉
  $("ci_ok").onclick=()=>{
    const edu=$("ci_edu").value;
    const age=parseInt($("ci_age").value,10)||0;
    const data={
      mode, name:($("ci_name").value||"李为民").trim(), school:$("ci_school").value,
      edu, age, gender:$("ci_gender").value,
      province:$("ci_province").value, city:$("ci_city").value,
      hometown:hometownFull($("ci_province").value, $("ci_city").value),
      partyMember:$("ci_party").checked, studentCadre:$("ci_cadre").checked, honors:$("ci_honor").checked,
    };
    const AGE_LIMIT={本科:25,硕士:28,博士:30};
    const lim=AGE_LIMIT[edu]||25;
    const fail=[];
    if(!data.partyMember) fail.push("政治面貌须为中共党员");
    if(!data.studentCadre) fail.push("需连续担任学生干部满1年");
    if(!data.honors) fail.push("需获得校级及以上荣誉");
    if(age<18) fail.push("年龄不得低于18岁");
    else if(age>lim) fail.push(`${edu}学历年龄须≤${lim}岁（当前${age}岁）`);
    if(fail.length){
      $("modalBody").insertAdjacentHTML("beforeend",
        `<div class="result-box" style="margin-top:10px;border-color:#c0392b;color:#c0392b">⚠️ 资格不达标：${fail.join("；")}<br>请调整或返回选择其他开局模式。</div>`);
      return;
    }
    // 进入选拔流程：校内推荐 + 笔试 + 面试（用事件模拟）
    $("modal").classList.remove("show");
    newGame(data);
    S.examStage = 0;       // 选拔阶段：0推荐函 1笔试 2面试 3入职
    save();
    curTab='event'; renderTopbar(); renderNav(); renderMain();
    setTimeout(()=>{ runSelectiveExam(); }, 300);
  };
}

/* 选调生选拔流程：用连续事件模拟校内推荐→笔试→面试 */
function runSelectiveExam(){
  const steps = [
    {title:"第一步：争取校内推荐函", text:"中央选调不对外网报，须在校内综合评分（绩点+荣誉+学生工作）中胜出、拿到推荐函。请审慎抉择：",
     opts:[
       {t:"全力冲击综合第一",d:"能力+15，政绩+10，健康-8", fn:s=>{s.能力+=15;s.政绩+=10;s.健康-=8;}, ok:true},
       {t:"扎实积累履历",d:"政绩+12，人脉+10，道德+8", fn:s=>{s.政绩+=12;s.人脉+=10;s.道德+=8;}, ok:true},
     ]},
    {title:"第二步：副省级行测+申论笔试", text:"采用高难度『副省级』试卷，侧重宏观政策与综合分析能力。",
     opts:[
       {t:"宏观破题立意",d:"政绩+20，能力+12，改革派+15", fn:s=>{s.政绩+=20;s.能力+=12;s.reformRep+=15;}, ok:true},
       {t:"稳扎稳打作答",d:"政绩+12，能力+8，健康-5", fn:s=>{s.政绩+=12;s.能力+=8;s.健康-=5;}, ok:true},
     ]},
    {title:"第三步：部委面试（权重极高）", text:"考官连续追问宏观议题，极其考验政治素养与临场应变。面试通过即获得中央选调生资格。",
     opts:[
       {t:"沉着辩证作答",d:"上司好感+25，政绩+18，能力+15", fn:s=>{s.上司好感+=25;s.政绩+=18;s.能力+=15;}, ok:true},
       {t:"务实表态",d:"上司好感+15，政绩+10", fn:s=>{s.上司好感+=15;s.政绩+=10;}, ok:true},
     ]},
  ];
  let i = S.examStage || 0;
  if(i >= steps.length){
    // 选拔完成 → 入职 + 强制墩苗
    S.dunmiao = true; S.dunmiaoMonths = 0; S.returned = false;
    pushLog("✅ 通过全部选拔环节，正式成为中央选调生，入职中央部委并下沉基层墩苗。");
    addToast("🎖️ 中央选调生资格获取成功");
    delete S.examStage; save();
    renderTopbar(); renderMain('event');
    return;
  }
  const st = steps[i];
  $("modalTitle").textContent="🎖️ 选调选拔 · "+st.title;
  let btns="";
  st.opts.forEach((o,idx)=>{ btns+=`<button class="btn" data-idx="${idx}"><span class="bt">${o.t}</span><span class="bd">${o.d}</span></button>`; });
  $("modalBody").innerHTML=`<div class="event-text" style="text-indent:0">${st.text}</div>${btns}`;
  $("modal").classList.add("show");
  document.querySelectorAll('[data-idx]').forEach(b=>{
    b.onclick=()=>{
      const o=st.opts[+b.dataset.idx];
      o.fn(S);
      pushLog("选拔环节【"+st.title+"】："+o.t);
      S.examStage = i+1; save();
      $("modal").classList.remove("show");
      renderTopbar(); renderMain('event');
      setTimeout(()=>{ runSelectiveExam(); }, 350);
    };
  });
}

function init(){
  load();
  if(!S){ startScreen(); return; }
  // 载入后若选调生选拔流程未完成，恢复选拔弹窗
  if(S.mode==='selective' && S.examStage && S.examStage>0 && S.examStage<3){
    curTab='event'; renderTopbar(); renderNav(); renderMain();
    setTimeout(()=>{ runSelectiveExam(); }, 300);
    return;
  }
  renderTopbar(); renderNav(); renderMain();
}

/* 自动存档提示 */
setInterval(()=>{ if(S&&!S.gameOver)save(); }, 30000);

init();
</script>
</body>
