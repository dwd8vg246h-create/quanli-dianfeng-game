<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>权利的巅峰</title>
<style>
  :root{
    --red:#b01e23; --dark-red:#7a1418; --gold:#c9a96a; --ink:#222;
    --paper:#f4f0e6; --paper2:#ebe5d6; --line:#c8bfa8; --green:#2f7d4f;
    --shadow:0 2px 12px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    background:#2c2c2c; color:var(--ink);
    max-width:480px; margin:0 auto; min-height:100vh;
    background:#3a3a3a;
  }
  #app{
    background:var(--paper); min-height:100vh; position:relative;
    overflow-x:hidden;
  }
  /* 顶部状态栏 */
  #topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#8a1a1e,#b01e23);
    color:#fff; padding:8px 12px; box-shadow:var(--shadow);
  }
  .tb-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .tb-title{font-size:15px; font-weight:700; letter-spacing:1px;}
  .tb-sub{font-size:11px; opacity:.85; margin-top:2px;}
  .attrs{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .attr{background:rgba(255,255,255,.16); border-radius:4px; padding:2px 6px; font-size:10px;}
  .attr b{color:var(--gold);}
  .bar-wrap{height:4px; background:rgba(255,255,255,.25); border-radius:2px; margin-top:3px; width:40px; display:inline-block; vertical-align:middle;}
  .bar{height:100%; background:var(--gold); border-radius:2px;}

  /* 主体区域 */
  #main{padding:12px; padding-bottom:80px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
  }
  .card-h{
    background:var(--paper2); border-bottom:1px solid var(--line);
    padding:8px 12px; font-weight:700; font-size:13px; color:var(--dark-red);
  }
  .card-b{padding:12px; font-size:13px; line-height:1.7;}
  .muted{color:#7a7364; font-size:12px;}
  .tag{display:inline-block; background:var(--red); color:#fff; font-size:10px; padding:1px 6px; border-radius:3px; margin-right:4px;}

  /* 指标条 */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .stat{background:var(--paper2); border-radius:5px; padding:6px 8px; font-size:11px;}
  .stat .n{font-weight:700; font-size:13px;}
  .stat .lbl{color:#6b6354;}

  /* 按钮 */
  .btn{
    display:block; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-left:4px solid var(--red);
    border-radius:5px; padding:10px 12px; margin:8px 0 0; font-size:13px;
    cursor:pointer; transition:.15s; line-height:1.5;
  }
  .btn:active{background:var(--paper2); transform:scale(.99);}
  .btn .bt{font-weight:700; color:var(--dark-red);}
  .btn .bd{font-size:11px; color:#7a7364; margin-top:2px;}
  .btn.primary{background:var(--red); color:#fff; border-color:var(--red);}
  .btn.primary .bt,.btn.primary .bd{color:#fff;}

  /* 底部导航 */
  #nav{
    position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    background:#fff; border-top:1px solid var(--line); display:flex; z-index:50;
  }
  #nav .tab{flex:1; text-align:center; padding:8px 0; font-size:10px; color:#7a7364; cursor:pointer;}
  #nav .tab.active{color:var(--red); font-weight:700;}
  #nav .tab .ic{font-size:18px; display:block;}

  /* 弹窗 */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:none; align-items:center; justify-content:center; padding:20px;}
  .modal.show{display:flex;}
  .modal-box{background:var(--paper); border-radius:10px; max-width:420px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 8px 30px rgba(0,0,0,.4);}
  .modal-h{background:var(--red); color:#fff; padding:12px; font-weight:700; text-align:center; font-size:15px;}
  .modal-b{padding:16px;}

  /* 闪屏提示 */
  #toast{position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:200; display:none;}
  .toast-item{background:rgba(0,0,0,.82); color:#fff; font-size:12px; padding:8px 14px; border-radius:20px; margin-top:6px; white-space:nowrap;}

  .scene-title{font-size:16px; font-weight:700; color:var(--dark-red); border-left:4px solid var(--gold); padding-left:10px; margin:4px 0 10px;}
  .event-text{font-size:13px; line-height:1.8; text-indent:2em; margin-bottom:6px;}
  .result-box{background:#faf6ec; border:1px dashed var(--gold); border-radius:6px; padding:10px; margin-top:10px; font-size:12px; line-height:1.7;}
  .result-box b{color:var(--red);}

  .mini{font-size:11px; color:#6b6354;}
  .center{text-align:center;}
  .hidden{display:none !important;}

  /* 开始/结束页 */
  .cover{padding:40px 20px; text-align:center;}
  .cover h1{font-size:28px; color:var(--red); letter-spacing:3px; margin:0;}
  .cover .sub{color:#7a7364; font-size:13px; margin-top:8px;}
  .cover .seal{width:90px; height:90px; border:3px solid var(--red); border-radius:8px; color:var(--red); font-size:40px; line-height:84px; margin:24px auto; font-weight:700;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar"></div>
  <div id="main"></div>
  <div id="nav"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-h" id="modalTitle">提示</div>
    <div class="modal-b" id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

  opts = opts || {};

    const edu = (opts.edu||"本科");
    if(edu==="博士"){ startRank = 3; }       // 二级主任科员（正科待遇）≈ 副乡镇长层级起点
    else if(edu==="硕士"){ startRank = 2; }   // 四级主任科员（副科待遇）

    start政绩 = 40; start上司 = 45; start人脉 = 25; start道德 = 65; // 高起点
  } else if(mode==="grassroots"){
    startRank = 0; start政绩 = 0; start上司 = 28; start人脉 = 20; start道德 = 68; // 本地人脉熟、道德口碑好
  }
  S = {
    name: opts.name || "玩家",
    gender: opts.gender || "男",     // 性别
    age: opts.age || 22,             // 年龄
    hometown: opts.hometown || "山东", // 籍贯
    mode:mode,               // 开局模式：selective / normal / grassroots
    edu: opts.edu || "本科",  // 学历

/* ---- 存储层：兼容 file:// 离线打开（localStorage 可能被浏览器禁用） ---- */
const MEM = {};             // 内存兜底：localStorage 不可用时暂存进度
let storageOK = true;       // localStorage 是否可用
try {
  const probe = "__qlp_probe__";
  localStorage.setItem(probe, "1");
  localStorage.removeItem(probe);
} catch(e) {
  storageOK = false;        // Safari/某些浏览器 file:// 下会禁用
}

function _rawSet(k, v){
  if(storageOK){ try{ localStorage.setItem(k, v); return true; }catch(e){ storageOK=false; } }
  MEM[k] = v;               // 降级到内存（本次会话仍可存档/续玩）
  return false;
}
function _rawGet(k){
  if(storageOK){ try{ const v = localStorage.getItem(k); if(v!==null) return v; }catch(e){ storageOK=false; } }
  return MEM[k] || null;
}
function _rawDel(k){
  if(storageOK){ try{ localStorage.removeItem(k); }catch(e){ storageOK=false; } }
  delete MEM[k];
}

function save(){ _rawSet("qlp_top", JSON.stringify(S)); }
function load(){
  const t = _rawGet("qlp_top");
  if(t){ try{ S = JSON.parse(t); }catch(e){ _rawDel("qlp_top"); } }
}
function hasSave(){ return !!_rawGet("qlp_top"); }
function clearSave(){ _rawDel("qlp_top"); }



/* 辅助：强制连续晋升 N 级（选调生回流 / 基层破格等火箭晋升场景） */
function promoteBy(n){
  for(let i=0;i<n;i++){ if(S.rank<RANKS.length-1) doPromote(); }
}
/* ---------- 3. 数值工具 ---------- */
const $=id=>document.getElementById(id);
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function pushLog(t){ if(!S)return; S.eventsLog.push(t); if(S.eventsLog.length>40)S.eventsLog.shift(); }

/* 统一收敛所有数值指标到合理区间（部委技能等大额增减后调用） */
function clampAll(){
  if(!S) return;
  const range = {
    能力:[0,999], 政绩:[0,99999], 政绩点:[0,9999],
    道德:[0,100], 健康:[0,100], 人脉:[0,100], 上司好感:[0,100],
    财政:[0,100], GDP:[0,100], 民生:[0,100], 生态:[0,100],
    营商:[0,100], 治安:[0,100], 廉政积分:[0,999], 法治:[0,100],
    国际声望:[0,100], 科创:[0,100],
    partyRep:[0,100], neutralRep:[0,100], reformRep:[0,100],
  };
  Object.keys(range).forEach(k=>{
    if(typeof S[k]==='number'){ S[k]=clamp(Math.round(S[k]), range[k][0], range[k][1]); }
  });
  if(S.cash<0) S.cash=0;
}

function addToast(msg){
  const box=$("toast"); box.style.display="block";
  const el=document.createElement("div"); el.className="toast-item"; el.textContent=msg;
  box.appendChild(el);
  setTimeout(()=>{el.remove(); if(!box.children.length)box.style.display="none";},1800);
}

/* 每月结算 */
function monthlySettlement(){
  const r=S.rank>=6?0.6:1; // 前期事件密集
  // 自然衰减/增长
  S.政绩 += Math.round((S.GDP*0.3 + S.民生*0.3 + S.营商*0.2 + S.生态*0.1 + S.治安*0.1)*r*0.15);
  S.健康 = clamp(S.健康 - (S.rank>=10?0:1) - (S.健康>90?0:0), 0, 100);
  // 指标缓慢回归
  const drift=(cur,target)=> cur + (target-cur)*0.03;
  S.生态=clamp(drift(S.生态,65),0,100);
  S.治安=clamp(drift(S.治安,60),0,100);
  // 部委专属技能冷却递减
  if(S.deptCd){ Object.keys(S.deptCd).forEach(k=>{ if(S.deptCd[k]>0) S.deptCd[k]--; }); }
  S.month++;
  if(S.month>12){S.month=1;S.year++;S.政绩点+= Math.floor(S.政绩/100);}
  // ==== 选调生墩苗计时 ====
  if(S.mode==='selective' && S.dunmiao && !S.returned){
    S.dunmiaoMonths = (S.dunmiaoMonths||0) + 1;
    if(S.dunmiaoMonths >= 24){
      // 墩苗期满：100%回流部委 + 火箭晋升
      S.dunmiao = false; S.returned = true;
      promoteBy(2); // 回流破格晋升（模拟"火箭晋升"）
      S.政绩 += 50; S.上司好感 += 30; S.人脉 += 20;
      pushLog("🎖️ 墩苗2年考核优秀，100%调回中央部委定岗，进入『火箭式』轮岗培养（职级跃升）。");
      addToast("🔥 回流部委 · 火箭晋升");
      // 回流后分配具体部委
      setTimeout(()=>{ openDeptChoice(); }, 400);
    }
  }
  // 健康检查
  if(S.健康<=0){ endGame("积劳成疾"); return; }
  if(S.道德<=0){ endGame("身陷囹圄"); return; }
  save();
}

/* 检查晋升 */
function checkPromotion(){
  const need=RANKS[S.rank+1];
  if(!need) return;
  const req政绩 = need[2], req年限 = need[3];
  const months=S.month + (S.year-2026)*12;
  const routeBonus = S.route==='youth'? 0.85 : 1;
  const needMonths = Math.round(req年限 * routeBonus);
  const cond1=S.政绩>=req政绩, cond2=months>=needMonths, cond3=S.道德>=30, cond4=S.上司好感>=40;
  // 纪检政法路线：廉政积分达标可突破"上司好感"门槛（反腐干部口碑加成）
  const routeCond = S.route==='discipline' ? (S.廉政积分>=30 || S.上司好感>=40) : true;
  const finalCond4 = S.route==='discipline' ? (S.上司好感>=40 || S.廉政积分>=30) : cond4;
  if(cond1&&cond2&&cond3&&finalCond4){
    if(S.rank===6 && !S.route){
      // 选调生 / 基层扎根模式：不强制在县委常委节点选传统四路线，各自有专属路径
      if(S.mode==='selective' || S.mode==='grassroots'){
        S.route = (S.mode==='selective') ? 'admin' : 'party'; // 给一个默认归属，不影响玩法
        pushLog(`（${MODES[S.mode].name}）你在关键节点延续了专属培养路径，未走传统路线分支。`);
      } else {
        openRouteChoice(); return;
      }
    }
    // 纪检路线：晋升时消耗廉政积分转化为政绩点奖励
    if(S.route==='discipline' && S.廉政积分>0){
      const bonus=Math.min(S.廉政积分, 20);
      S.政绩点+=Math.floor(bonus/5);
      pushLog(`凭借扎实的廉政口碑，你的晋升考核获得额外认可（廉政积分+${Math.floor(bonus/5)}政绩点）。`);
      S.廉政积分-=bonus;
    }
    doPromote();
  }
}
function doPromote(){
  S.rank++;
  const [name,layer]=RANKS[S.rank];
  addToast("🎉 晋升："+name);
  pushLog(`晋升为【${name}】（${layer}层级）`);
  // 晋升奖励
  S.能力+=5; S.政绩点+=3; S.上司好感+=10; S.cash+=60;
  // 到达顶层？
  if(S.rank>=RANKS.length-1){ endGame("大国领袖"); }
  save();
}

/* 加权随机选事件（避免重复太频繁，路线偏好加权） */
let lastEventId=null, recentEventIds=[];
function pickEvent(){
  const recencyWindow=5;
  // 归一化池：统一转为 {e,w}（w 至少为 1），彻底避免原始对象/包装对象混淆
  // 部委专属危机事件：仅当玩家已归属该部委时才进入池子
  const myDept = (S && S.dept) ? S.dept : null;
  let pool=EVENTS.filter(e=>!recentEventIds.includes(e.id))
                 .filter(e=> !e.dept || e.dept===myDept)
                 .map(e=>({e,w:1}));
  if(pool.length < EVENTS.length/2) recentEventIds=[]; // 池太小时重置近期列表
  if(!pool.length){ recentEventIds=[]; pool=EVENTS.map(e=>({e,w:1})); } // 兜底：池空则全量重开
  // 路线 / 开局模式偏好加权
  if(S && S.route){
    pool.forEach(item=>{
      const e=item.e; let w=item.w;
      if(S.route==='discipline' && e.route==='discipline') w=4.5;
      else if(S.route==='party' && e.id==='promotion_eval') w=3;
      else if(S.route==='admin' && (e.id==='invest'||e.id==='economic_pressure')) w=3;
      else if(S.route==='youth' && (e.id==='school'||e.id==='promotion_eval')) w=2.5;
      if(S.rank>=10 && (e.id==='economic_pressure'||e.id==='national_plan'||e.id==='corruption_case')) w=2.5;
      if(S.mode==='selective'){
        if(e.route==='selective') w=(e.weight||3)*2;
        if(S.dunmiao && e.id==='sel_dunmiao') w=8;
        if(!S.dunmiao && S.returned && (e.id==='sel_plan_draft'||e.id==='sel_crosspost')) w=6;
      }
      if(S.mode==='grassroots'){
        if(e.route==='grassroots') w=(e.weight||3)*2;
        if(e.id==='invest'||e.id==='economic_pressure') w*=0.4;
      }
      // ---- 所属部委：专属危机事件加权（回流部委后生效） ----
      if(S.dept && e.dept===S.dept) w = Math.max(w, 7);
      item.w=w;
    });
  }
  // 加权随机选取
  const total=pool.reduce((a,b)=>a+b.w,0);
  let r=Math.random()*total, chosen=null;
  for(const item of pool){ r-=item.w; if(r<=1e-9){ chosen=item.e; break; } }
  if(!chosen) chosen=pool[pool.length-1].e; // 浮点精度兜底
  recentEventIds.push(chosen.id);
  if(recentEventIds.length>recencyWindow) recentEventIds.shift();
  return chosen;
}

/* ---------- 7. 交互绑定 ---------- */
function bindActions(){
  document.querySelectorAll('[data-act="choose"]').forEach(b=>{
    b.onclick=()=>{
      const eid=b.dataset.eid, idx=+b.dataset.idx;
      const e=EVENTS.find(x=>x.id===eid);
      const opt=e.opts[idx];
      const snap={道德:S.道德, 政绩:S.政绩, 政绩点:S.政绩点, 改革派:S.reformRep};
      const result=opt.fn(S);
      // 纪检政法路线：道德获取 +20%（持续机制，仅放大增益，不放大减损）
      if(S.route==='discipline'){
        const dGain=S.道德 - snap.道德;
        if(dGain>0){ S.道德 = Math.round(S.道德 + dGain*0.2); }
        // 反腐类抉择（改革派声望增长）也享受加成
        const rGain=S.reformRep - snap.改革派;
        if(rGain>0){ S.reformRep = Math.round(S.reformRep + rGain*0.15); }
        // 廉政积分：廉洁抉择积累，反腐抉择额外加成（专属机制）
        const eDef=EVENTS.find(x=>x.id===eid);
        if(dGain>0){ S.廉政积分 = (S.廉政积分||0) + Math.round(dGain*0.5); }
        if(eDef && eDef.route==='discipline'){ S.廉政积分 = (S.廉政积分||0) + 8; }
      }
      // 政绩点奖励
      S.政绩+=8; S.政绩点+=1;
      showResult(e,opt);
      save();
    };
  });
  // 部委专属技能
  document.querySelectorAll('[data-act="deptskill"]').forEach(b=>{
    b.onclick=()=>{
      const idx=+b.dataset.idx;
      const d=DEPARTMENTS[S.dept]; if(!d) return;
      const sk=d.skills[idx]; if(!sk) return;
      const cd=(S.deptCd && S.deptCd[sk.id])||0;
      if(cd>0){ addToast("技能冷却中，还需 "+cd+" 个月"); return; }
      sk.fn(S);
      S.deptCd = S.deptCd||{}; S.deptCd[sk.id] = sk.cd;
      pushLog(`部委施政【${d.short}·${sk.name}】：${sk.effect}`);
      addToast("⚡ 已施展：" + sk.name);
      clampAll();
      renderTopbar(); renderMain('action');
      checkPromotion();
    };
  });
  document.querySelectorAll('[data-act="do"]').forEach(b=>{
    b.onclick=()=>{
      const idx=+b.dataset.idx;
      const r=_acts[idx].fn(S);
      if(r===false) return;
      addToast("已完成："+_acts[idx].t.replace(/^.+? /,""));
      pushLog("日常行动："+_acts[idx].t.replace(/^.+? /,""));
      renderTopbar(); renderMain('action');
      checkPromotion();
    };
  });
  document.querySelectorAll('[data-act="next"]').forEach(b=>{
    b.onclick=()=>{ monthlySettlement(); renderTopbar(); renderMain('event'); addToast("进入下一个月"); };
  });
  document.querySelectorAll('[data-act="save"]').forEach(b=>{ b.onclick=()=>{save();addToast("进度已保存");};});
  document.querySelectorAll('[data-act="restart"]').forEach(b=>{
    b.onclick=()=>{ if(confirm("确定重新开始？当前进度将丢失。")){localStorage.removeItem("qlp_top");location.reload();} }
  });
}

/* 选调生选拔流程：用连续事件模拟校内推荐→笔试→面试 */
function runSelectiveExam(){
  const steps = [
    {title:"第一步：争取校内推荐函", text:"中央选调不对外网报，须在校内综合评分（绩点+荣誉+学生工作）中胜出、拿到推荐函。请审慎抉择：",
     opts:[
       {t:"全力冲击综合第一",d:"能力+15，政绩+10，健康-8", fn:s=>{s.能力+=15;s.政绩+=10;s.健康-=8;}, ok:true},
       {t:"扎实积累履历",d:"政绩+12，人脉+10，道德+8", fn:s=>{s.政绩+=12;s.人脉+=10;s.道德+=8;}, ok:true},
     ]},
    {title:"第二步：副省级行测+申论笔试", text:"采用高难度『副省级』试卷，侧重宏观政策与综合分析能力。",
     opts:[
       {t:"宏观破题立意",d:"政绩+20，能力+12，改革派+15", fn:s=>{s.政绩+=20;s.能力+=12;s.reformRep+=15;}, ok:true},
       {t:"稳扎稳打作答",d:"政绩+12，能力+8，健康-5", fn:s=>{s.政绩+=12;s.能力+=8;s.健康-=5;}, ok:true},
     ]},
    {title:"第三步：部委面试（权重极高）", text:"考官连续追问宏观议题，极其考验政治素养与临场应变。面试通过即获得中央选调生资格。",
     opts:[
       {t:"沉着辩证作答",d:"上司好感+25，政绩+18，能力+15", fn:s=>{s.上司好感+=25;s.政绩+=18;s.能力+=15;}, ok:true},
       {t:"务实表态",d:"上司好感+15，政绩+10", fn:s=>{s.上司好感+=15;s.政绩+=10;}, ok:true},
     ]},
  ];
  let i = S.examStage || 0;
  if(i >= steps.length){
    // 选拔完成 → 入职 + 强制墩苗
    S.dunmiao = true; S.dunmiaoMonths = 0; S.returned = false;
    pushLog("✅ 通过全部选拔环节，正式成为中央选调生，入职中央部委并下沉基层墩苗。");
    addToast("🎖️ 中央选调生资格获取成功");
    delete S.examStage; save();
    renderTopbar(); renderMain('event');
    return;
  }
  const st = steps[i];
  $("modalTitle").textContent="🎖️ 选调选拔 · "+st.title;
  let btns="";
  st.opts.forEach((o,idx)=>{ btns+=`<button class="btn" data-idx="${idx}"><span class="bt">${o.t}</span><span class="bd">${o.d}</span></button>`; });
  $("modalBody").innerHTML=`<div class="event-text" style="text-indent:0">${st.text}</div>${btns}`;
  $("modal").classList.add("show");
  document.querySelectorAll('[data-idx]').forEach(b=>{
    b.onclick=()=>{
      const o=st.opts[+b.dataset.idx];
      o.fn(S);
      pushLog("选拔环节【"+st.title+"】："+o.t);
      S.examStage = i+1; save();
      $("modal").classList.remove("show");
      renderTopbar(); renderMain('event');
      setTimeout(()=>{ runSelectiveExam(); }, 350);
    };
  });
}

function init(){
  load();
  if(!S){ startScreen(); return; }
  // 载入后若选调生选拔流程未完成，恢复选拔弹窗
  if(S.mode==='selective' && S.examStage && S.examStage>0 && S.examStage<3){
    curTab='event'; renderTopbar(); renderNav(); renderMain();
    setTimeout(()=>{ runSelectiveExam(); }, 300);
    return;
  }
  renderTopbar(); renderNav(); renderMain();
}

/* 自动存档提示 */
setInterval(()=>{ if(S&&!S.gameOver)save(); }, 30000);

init();
</script>
</body>
</html>
