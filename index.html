<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>权利的巅峰</title>
<style>
  :root{
    --red:#b01e23; --dark-red:#7a1418; --gold:#c9a96a; --ink:#222;
    --paper:#f4f0e6; --paper2:#ebe5d6; --line:#c8bfa8; --green:#2f7d4f;
    --shadow:0 2px 12px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    background:#2c2c2c; color:var(--ink);
    max-width:480px; margin:0 auto; min-height:100vh;height:100dvh;min-height:100dvh;
    background:#3a3a3a;
  }
  #app{
    background:var(--paper); min-height:100vh;height:100dvh;min-height:100dvh; position:relative;
    overflow-x:hidden;
  }
  /* 顶部状态栏 */
  #topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#8a1a1e,#b01e23);
    color:#fff; padding:8px 12px; box-shadow:var(--shadow);
  }
  .tb-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .tb-title{font-size:15px; font-weight:700; letter-spacing:1px;}
  .tb-sub{font-size:11px; opacity:.85; margin-top:2px;}
  /* 属性行：此前 flex-wrap 换行，状态标签一多就撑成两三行，
     顶栏高度忽高忽低，页面内容跟着上下跳动。
     改为单行横向滚动：高度恒定，多出的状态滑一下即可看到。 */
  .attrs{display:flex; flex-wrap:nowrap; gap:6px; margin-top:6px;
         overflow-x:auto; -webkit-overflow-scrolling:touch;
         scrollbar-width:none; padding-bottom:1px}
  .attrs::-webkit-scrollbar{display:none}
  .attr{background:rgba(255,255,255,.16); border-radius:4px; padding:2px 6px;
        font-size:10px; white-space:nowrap; flex:0 0 auto;}
  .attr b{color:var(--gold);}
  .bar-wrap{height:4px; background:rgba(255,255,255,.25); border-radius:2px; margin-top:3px; width:40px; display:inline-block; vertical-align:middle;}
  .bar{height:100%; background:var(--gold); border-radius:2px;}

  /* 主体区域 */
  #main{padding:12px; padding-bottom:80px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
  }
  .card-h{
    background:var(--paper2); border-bottom:1px solid var(--line);
    padding:8px 12px; font-weight:700; font-size:13px; color:var(--dark-red);
  }
  .card-b{padding:12px; font-size:13px; line-height:1.7;}
  .muted{color:#7a7364; font-size:12px;}
  .tag{display:inline-block; background:var(--red); color:#fff; font-size:10px; padding:1px 6px; border-radius:3px; margin-right:4px;}

  /* 指标条 */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .stat{background:var(--paper2); border-radius:5px; padding:6px 8px; font-size:11px;}
  .stat .n{font-weight:700; font-size:13px;}
  .stat .lbl{color:#6b6354;}

  /* 按钮 */
  .btn{
    display:block; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-left:4px solid var(--red);
    border-radius:5px; padding:10px 12px; margin:8px 0 0; font-size:13px;
    cursor:pointer; transition:.15s; line-height:1.5;
  }
  .btn:active{background:var(--paper2); transform:scale(.99);}
  .btn .bt{font-weight:700; color:var(--dark-red);}
  .btn .bd{font-size:11px; color:#7a7364; margin-top:2px;}
  .btn.primary{background:var(--red); color:#fff; border-color:var(--red);}
  .btn.primary .bt,.btn.primary .bd{color:#fff;}

  /* 底部导航 */
  #nav{
    position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    background:#fff; border-top:1px solid var(--line); display:flex; z-index:50;
  }
  #nav{display:flex;flex-direction:column}
  .nav-row{display:flex}
  #nav .tab{flex:1; text-align:center; padding:6px 0 5px; font-size:11px; color:#7a7364; cursor:pointer;}
  #nav .tab.active{color:var(--red); font-weight:700;}
  #nav .tab .ic{font-size:18px; display:block;}

  /* 弹窗 */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:none; align-items:center; justify-content:center; padding:20px;}
  .modal.show{display:flex;}
  .modal-box{background:var(--paper); border-radius:10px; max-width:420px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 8px 30px rgba(0,0,0,.4);}
  .modal-h{background:var(--red); color:#fff; padding:12px 42px 12px 12px; font-weight:700; text-align:center; font-size:15px; position:relative;}
  .modal-b{padding:16px;}
  /* 弹窗关闭按钮。
     此前所有弹窗都只能靠"继续"或内部按钮关闭，而带 noAutoOk 的弹窗
     （如申请晋升）连"继续"都没有——一旦内部按钮因条件不满足而失效，
     玩家就再也关不掉弹窗，整个游戏卡死。
     这里给所有弹窗统一加一个退路。 */
  .modal-x{position:absolute; top:50%; right:8px; transform:translateY(-50%);
           width:28px; height:28px; line-height:26px; text-align:center;
           border-radius:50%; background:rgba(255,255,255,.16); color:#fff;
           font-size:16px; font-weight:400; cursor:pointer; user-select:none;
           -webkit-tap-highlight-color:transparent;}
  .modal-x:hover,.modal-x:active{background:rgba(255,255,255,.32);}

  /* 闪屏提示 */
  #toast{position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:200; display:none;}
  .toast-item{background:rgba(0,0,0,.82); color:#fff; font-size:12px; padding:8px 14px; border-radius:20px; margin-top:6px; white-space:nowrap;}

  .scene-title{font-size:16px; font-weight:700; color:var(--dark-red); border-left:4px solid var(--gold); padding-left:10px; margin:4px 0 10px;}
  .event-text{font-size:13px; line-height:1.8; text-indent:2em; margin-bottom:6px;}
  .result-box{background:#faf6ec; border:1px dashed var(--gold); border-radius:6px; padding:10px; margin-top:10px; font-size:12px; line-height:1.7;}
  .result-box b{color:var(--red);}

  .mini{font-size:11px; color:#6b6354;}
  .center{text-align:center;}
  .hidden{display:none !important;}

  /* 开始/结束页 */
  .cover{padding:40px 20px; text-align:center;}
  .cover h1{font-size:28px; color:var(--red); letter-spacing:3px; margin:0;}
  .cover .sub{color:#7a7364; font-size:13px; margin-top:8px;}
  .cover .seal{width:90px; height:90px; border:3px solid var(--red); border-radius:8px; color:var(--red); font-size:40px; line-height:84px; margin:24px auto; font-weight:700;}

/* ============ 干部人事档案建档（注册）· 纸质表格风格 ============ */
.form-paper{
  background:#f5ecd9;
  background-image:
    linear-gradient(rgba(180,160,120,.16) 1px, transparent 1px),
    linear-gradient(90deg, rgba(180,160,120,.10) 1px, transparent 1px);
  background-size:100% 26px, 100% 26px;
  border:1px solid #c8b48c;
  border-radius:3px;
  box-shadow:inset 0 0 28px rgba(160,130,80,.14), 0 2px 10px rgba(0,0,0,.08);
  padding:16px 14px;
  font-family:"FangSong","仿宋","STFangsong","SimSun","宋体",serif;
  position:relative;
}
.form-paper::before{
  content:"";position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(circle at 20% 30%, rgba(200,180,140,.10) 0%, transparent 60%),
             radial-gradient(circle at 80% 70%, rgba(190,165,120,.10) 0%, transparent 55%);
  pointer-events:none;border-radius:3px;
}
.form-title{
  text-align:center;font-family:"FangSong","仿宋","STFangsong",serif;
  font-size:19px;font-weight:700;color:#8a1e23;letter-spacing:4px;
  padding-bottom:6px;border-bottom:2px double #b01e23;margin-bottom:4px;
}
.form-sub{
  text-align:center;font-size:11px;color:#8a6a35;letter-spacing:2px;margin-bottom:12px;
  font-family:"FangSong","仿宋",serif;
}
.form-seal{
  position:absolute;right:10px;top:8px;width:56px;height:56px;
  border:2.5px solid #b01e23;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#b01e23;font-weight:800;font-size:12px;line-height:1.15;text-align:center;
  transform:rotate(-14deg);opacity:.5;letter-spacing:1px;
  font-family:"FangSong","仿宋",serif;pointer-events:none;
}
.frow{margin-bottom:12px;position:relative;z-index:1}
.flabel{
  font-size:12px;color:#5a4a30;margin-bottom:3px;display:block;
  font-family:"FangSong","仿宋",serif;letter-spacing:1px;
}
.flabel .req{color:#b01e23}
.finput{
  width:100%;padding:8px 10px;border:1px solid #b8a480;border-radius:2px;
  background:rgba(255,252,244,.85);font-size:16px;color:#3a2f1f;
  font-family:"FangSong","仿宋",serif;box-sizing:border-box;
  border-bottom:1px dashed #b8a480;
}
.finput:focus{outline:none;border-color:#b01e23;background:#fffdf6;
  box-shadow:0 0 0 2px rgba(176,30,35,.08)}
.finput.err{border-color:#b01e23;background:#fff5f5}
.fhint{font-size:11px;color:#8a6a35;margin-top:3px;line-height:1.5;
  font-family:"FangSong","仿宋",serif}
  /* 核验码展示卡（演示模式：醒目呈现，避免用户找不到） */
  .codebox{
    margin-top:8px;padding:10px 12px;border:1px dashed #2f7d4f;border-radius:4px;
    background:rgba(47,125,79,.07);text-align:center;
  }
  .codebox .ct{font-size:11px;color:#5a4a30;font-family:"FangSong","仿宋",serif;line-height:1.6}
  .codebox .cc{
    font-size:28px;font-weight:800;letter-spacing:7px;color:#2f7d4f;margin:7px 0 4px;
    font-family:"Courier New",Courier,monospace;text-indent:7px;
  }
  .codebox .cfill{
    display:inline-block;margin-top:4px;padding:7px 18px;border:1px solid #2f7d4f;
    border-radius:3px;background:#2f7d4f;color:#fff;font-size:13px;font-weight:700;
    letter-spacing:1px;cursor:pointer;
  }
  .codebox .cfill:active{transform:translateY(1px);opacity:.88}
  .codebox .cdone{font-size:12px;color:#2f7d4f;font-weight:700;margin-top:6px}
.ferr{font-size:11px;color:#b01e23;margin-top:3px;line-height:1.5;
  font-family:"FangSong","仿宋",serif;display:none}
.ferr.show{display:block}
.fnote{
  font-size:11px;color:#6a5a40;line-height:1.7;
  font-family:"FangSong","仿宋",serif;
  background:rgba(255,250,238,.7);border-left:3px solid #b01e23;
  padding:6px 9px;margin-bottom:12px;
}
.strength-bar{display:flex;gap:3px;margin-top:5px}
.strength-bar i{
  flex:1;height:5px;background:#ddd5c2;border-radius:2px;display:block;
}
.strength-bar i.on{background:#2f7d4f}
.strength-bar i.on.warn{background:#8a6a35}
.strength-bar i.on.bad{background:#b01e23}
.strength-txt{font-size:11px;margin-top:3px;font-family:"FangSong","仿宋",serif}
.steps{display:flex;gap:4px;margin-bottom:12px;position:relative;z-index:1}
.steps div{
  flex:1;text-align:center;font-size:10px;padding:4px 2px;
  border-bottom:2px solid #d5c8ad;color:#9a8a6a;
  font-family:"FangSong","仿宋",serif;
}
.steps div.on{border-bottom-color:#b01e23;color:#b01e23;font-weight:700}
.steps div.done{border-bottom-color:#8a6a35;color:#8a6a35}
.avatar-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px}
.avatar-item{
  width:56px;height:66px;border:2px solid #d5c8ad;border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;background:rgba(255,252,244,.8);transition:all .15s;
}
.avatar-item.sel{border-color:#b01e23;background:#fff5f0;
  box-shadow:0 0 0 2px rgba(176,30,35,.15)}
.avatar-item .em{font-size:24px;line-height:1}
.avatar-item .nm{font-size:9px;color:#6a5a40;margin-top:3px;text-align:center;
  font-family:"FangSong","仿宋",serif}
.pledge-box{
  max-height:170px;overflow-y:auto;background:rgba(255,253,246,.9);
  border:1px solid #c8b48c;padding:10px;font-size:11px;line-height:1.9;
  color:#4a3f2f;font-family:"FangSong","仿宋",serif;margin-bottom:10px;
}
.pledge-box b{color:#8a1e23}
.pledge-check{
  display:flex;align-items:flex-start;gap:7px;cursor:pointer;
  font-family:"FangSong","仿宋",serif;font-size:12px;color:#4a3f2f;
  padding:6px;border:1px dashed #c8b48c;border-radius:3px;
  background:rgba(255,250,238,.6);
}
.pledge-check input{margin-top:2px;flex-shrink:0}
.reg-nav{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.reg-nav .btn{flex:1}
.seal-stamp{
  position:absolute;right:14px;bottom:14px;width:76px;height:76px;
  border:3px solid #b01e23;border-radius:6px;color:#b01e23;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:11px;line-height:1.3;transform:rotate(-12deg);
  opacity:.28;letter-spacing:1px;font-family:"FangSong","仿宋",serif;
  pointer-events:none;text-align:center;
}
.login-quick{display:flex;gap:8px;margin-top:10px}
.login-quick .btn{flex:1}
.login-quick .btn .bt{font-size:12px}

/* 盖章/打字机音效按钮反馈 */
.btn.stamping{animation:stampPulse .18s ease}
@keyframes stampPulse{
  0%{transform:scale(1)}
  40%{transform:scale(.965)}
  100%{transform:scale(1)}
}


/* ============================================================
   全局 UI 美化 · 政务质感视觉体系
   策略：纯样式增强，不改动任何 HTML 结构与类名
   ============================================================ */

/* —— 1. 色彩体系升级 —— */
:root{
  --red:#9e1b20; --dark-red:#6f1418; --gold:#c9a227; --ink:#1f1c17;
  --paper:#f7f4ec; --paper2:#efe9da; --line:#ddd5c0; --green:#2f7d4f;
  --shadow:0 2px 12px rgba(0,0,0,.10);
  --shadow-lg:0 8px 28px rgba(0,0,0,.16);
  --radius:10px;
  --sans:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",-apple-system,sans-serif;
  --serif:"Songti SC","STSong","SimSun","宋体",serif;
}

/* —— 2. 页面底色：深色画布 + 微妙纹理 —— */
body{
  background:#2a2724;
  background-image:radial-gradient(circle at 50% 0%, #3a352f 0%, #232120 70%);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
#app{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(201,162,39,.05) 0%, transparent 45%),
    radial-gradient(circle at 85% 92%, rgba(158,27,32,.04) 0%, transparent 45%);
  box-shadow:0 0 40px rgba(0,0,0,.5);
}

/* —— 3. 顶栏：红金纵深渐变 + 底部光边 —— */
#topbar{
  background:linear-gradient(160deg,#a51f24 0%,#8c1a1f 45%,#6f1418 100%);
  padding:10px 14px 11px;
  box-shadow:0 2px 14px rgba(111,20,24,.32);
  position:relative;
}
#topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.75;
}
.tb-title{
  font-size:17px;letter-spacing:1.5px;font-weight:800;
  text-shadow:0 1px 2px rgba(0,0,0,.28);
}
.tb-sub{font-size:11px;opacity:.9;line-height:1.5;margin-top:3px;letter-spacing:.2px;}
.attrs{gap:5px;margin-top:7px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.attr{flex:0 0 auto;white-space:nowrap;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.14);
  border-radius:5px;padding:3px 7px;font-size:10px;
  backdrop-filter:blur(4px);
}
.attr b{color:#f0d67a;font-weight:800;}
.bar-wrap{
  height:5px;background:rgba(0,0,0,.24);border-radius:3px;
  overflow:hidden;margin-top:5px;
}
.bar{
  background:linear-gradient(90deg,#e8c95a,#c9a227);
  border-radius:3px;box-shadow:0 0 6px rgba(201,162,39,.55);
  transition:width .45s cubic-bezier(.4,0,.2,1);
}

/* —— 4. 卡片：细腻层次 —— */
.card{
  background:#fffdf8;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 3px rgba(60,50,35,.06), 0 6px 18px rgba(60,50,35,.05);
  margin-bottom:12px;overflow:hidden;
  transition:box-shadow .2s, transform .2s;
}
.card:hover{
  box-shadow:0 2px 6px rgba(60,50,35,.08), 0 10px 26px rgba(60,50,35,.09);
}
.card-h{
  background:linear-gradient(180deg,#f7f2e4,#efe8d6);
  border-bottom:1px solid var(--line);
  padding:9px 13px;font-weight:800;font-size:13px;color:var(--dark-red);
  letter-spacing:.6px;position:relative;
}
.card-h::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--red),var(--gold));
}
.card-b{padding:13px;font-size:13px;line-height:1.75;color:#332e26;}

/* —— 5. 指标格 —— */
.stat-grid{gap:8px}
.stat{
  background:linear-gradient(180deg,#faf7ee,#f2ecdd);
  border:1px solid #e8e0cc;border-radius:8px;padding:8px 10px;
  box-shadow:inset 0 1px 0 #fff;
  transition:transform .18s;
}
.stat:active{transform:scale(.975)}
.stat .n{font-weight:800;font-size:16px;color:var(--dark-red);letter-spacing:.5px}
.stat .lbl{color:#7a7160;font-size:10px;letter-spacing:.3px}

/* —— 6. 按钮：立体质感 + 明确反馈 —— */
.btn{
  background:linear-gradient(180deg,#fffefb,#faf6ea);
  border:1px solid var(--line);
  border-left:4px solid var(--red);
  border-radius:8px;padding:11px 13px;margin:9px 0 0;
  font-size:13px;cursor:pointer;line-height:1.55;
  box-shadow:0 1px 2px rgba(60,50,35,.05);
  transition:transform .14s cubic-bezier(.4,0,.2,1), box-shadow .14s, background .14s;
}
.btn:active{
  transform:scale(.978);
  background:var(--paper2);
  box-shadow:inset 0 1px 3px rgba(60,50,35,.10);
}
.btn .bt{font-weight:800;color:var(--dark-red);font-size:13px;letter-spacing:.3px}
.btn .bd{font-size:11px;color:#7a7160;margin-top:3px;display:block}
.btn.primary{
  background:linear-gradient(180deg,#b02328,#8c1a1f);
  border-color:#7f171b;border-left-color:var(--gold);
  box-shadow:0 2px 8px rgba(140,26,31,.28);
}
.btn.primary:active{
  background:linear-gradient(180deg,#9a1e22,#7a161a);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.22);
}
.btn.primary .bt,.btn.primary .bd{color:#fff}
.btn.primary .bd{opacity:.88}
.btn:disabled{opacity:.45;filter:grayscale(.5);cursor:not-allowed}
/* 通用触摸目标下限：确保任何按钮都点得中 */
.btn{min-height:38px}
@media (max-width:380px){ .btn{min-height:42px} }
.btn.mini-btn{
  display:inline-block;width:auto;margin:0;
  /* 触摸目标：4px 内边距在手机上太小，指腹难以点准。
     提到 8px 并设 min-height，兼顾苹果(44pt)与安卓(48dp)的可点击性。 */
  padding:8px 11px;min-height:34px;border-radius:6px;border-left-width:3px;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn.mini-btn .bt{font-size:11px;font-weight:700}
/* 小屏进一步加大触摸区 */
@media (max-width:380px){
  .btn.mini-btn{padding:9px 12px;min-height:38px}
}

/* —— 7. 底部导航：毛玻璃 + 顶部指示条 —— */
#nav{
  background:rgba(255,253,248,.94);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  box-shadow:0 -2px 16px rgba(60,50,35,.08);
  padding-bottom:env(safe-area-inset-bottom);
}
#nav{display:flex;flex-direction:column}
.nav-row{display:flex}
#nav .tab{
  flex:1;padding:6px 0 5px;font-size:11px;color:#8a8170;
  position:relative;transition:color .18s;
}
#nav .tab .ic{font-size:17px;display:block;margin-bottom:1px;transition:transform .18s}
#nav .tab.active{color:var(--red);font-weight:800}
#nav .tab.active .ic{transform:translateY(-1px) scale(1.08)}
#nav .tab.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:24px;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,var(--red),var(--gold));
}
#nav .tab:active{background:rgba(158,27,32,.05)}

/* —— 8. 弹窗：柔和圆角 + 入场动画 —— */
.modal{background:rgba(30,26,22,.55);backdrop-filter:blur(3px);padding:18px}
.modal-box{
  background:var(--paper);border-radius:14px;max-width:430px;
  max-height:88vh;box-shadow:0 16px 48px rgba(0,0,0,.36);
  border:1px solid rgba(201,162,39,.28);
  animation:modalIn .26s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(22px) scale(.965)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.modal-h{
  background:linear-gradient(160deg,#a51f24,#6f1418);
  padding:13px 44px 13px 13px;font-size:15px;letter-spacing:1.2px;font-weight:800;
  border-radius:13px 13px 0 0;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  position:relative;   /* 供右上角关闭按钮定位 */
}
.modal-b{padding:16px;font-size:13px;line-height:1.8}

/* —— 9. 提示条 —— */
#toast{top:76px}
.toast-item{
  background:linear-gradient(180deg,rgba(38,32,28,.94),rgba(24,20,17,.94));
  backdrop-filter:blur(8px);
  border:1px solid rgba(201,162,39,.30);
  font-size:12px;padding:9px 16px;border-radius:22px;
  box-shadow:0 6px 20px rgba(0,0,0,.34);
  letter-spacing:.3px;
  animation:toastIn .3s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes toastIn{
  from{opacity:0;transform:translateY(-12px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* —— 10. 正文排版 —— */
.event-text{
  font-family:var(--serif);
  font-size:14px;line-height:2.0;text-indent:2em;
  color:#2b2620;margin-bottom:8px;letter-spacing:.2px;
}
.scene-title{
  font-size:17px;font-weight:800;color:var(--dark-red);
  border-left:4px solid var(--gold);padding-left:11px;
  margin:6px 0 12px;letter-spacing:.8px;
}
.result-box{
  background:linear-gradient(180deg,#fdfaf0,#f8f3e4);
  border:1px solid rgba(201,162,39,.4);
  border-radius:8px;padding:12px;margin-top:12px;
  font-size:12px;line-height:1.85;
  box-shadow:inset 0 1px 0 #fff;
}
.result-box b{color:var(--red);font-weight:800}
.mini{font-size:11px;color:#756c5c;line-height:1.65}
.muted{color:#8a8170}
.tag{
  background:linear-gradient(180deg,#b02328,#8c1a1f);
  font-size:10px;padding:2px 7px;border-radius:4px;
  font-weight:700;letter-spacing:.3px;
  box-shadow:0 1px 3px rgba(140,26,31,.24);
}

/* —— 11. 封面 —— */
.cover{padding:44px 20px 32px}
.cover h1{
  font-size:30px;letter-spacing:5px;font-weight:800;
  background:linear-gradient(180deg,#b02328,#6f1418);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 3px rgba(111,20,24,.18));
}
.cover .sub{color:#7a7160;font-size:12px;margin-top:9px;letter-spacing:2.5px}
.cover .seal{
  width:94px;height:94px;border:3px solid var(--red);border-radius:10px;
  color:var(--red);font-size:42px;line-height:88px;
  margin:26px auto 20px;font-weight:800;letter-spacing:2px;
  box-shadow:0 0 0 1px rgba(201,162,39,.5) inset, 0 4px 14px rgba(111,20,24,.16);
  background:linear-gradient(145deg,rgba(158,27,32,.05),rgba(201,162,39,.07));
  transform:rotate(-3deg);
  animation:sealFloat 5s ease-in-out infinite;
}
@keyframes sealFloat{
  0%,100%{transform:rotate(-3deg) translateY(0)}
  50%{transform:rotate(-3deg) translateY(-5px)}
}

/* —— 12. 滚动条美化 —— */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.04);border-radius:3px}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#c9a227,#a8861f);
  border-radius:3px;
}
::-webkit-scrollbar-thumb:hover{background:#8c1a1f}

/* —— 13. 输入框 —— */
select, input[type="text"], input[type="number"], input[type="password"], textarea{
  font-family:var(--sans);
}
.ipt, .finput{
  /* iOS Safari：表单控件字号小于 16px 时，聚焦会自动放大整个页面。
     创建角色等弹窗用的是 .ipt，此前未显式设字号，继承浏览器默认的
     13px 左右 —— 手机上每点一个输入框页面就放大一次，且不会缩回。
     .finput 早已是 16px，此处补齐 .ipt。 */
  font-size:16px;
  border-radius:6px !important;
  transition:border-color .16s, box-shadow .16s;
}
/* 通用兜底：任何表单控件都不得小于 16px */
input, select, textarea{ font-size:16px; }
.ipt:focus, .finput:focus{
  border-color:var(--red) !important;
  box-shadow:0 0 0 3px rgba(158,27,32,.10) !important;
  outline:none;
}

/* —— 14. 分隔与细节 —— */
hr, .divider{border:none;border-top:1px dashed var(--line);margin:12px 0}
details summary{
  cursor:pointer;color:var(--red);font-weight:700;
  padding:4px 0;user-select:none;
}
details summary:active{opacity:.7}

}

结构失衡，需要消耗大量政治资本进行「去产能」改革。"},mof:{short:"财政部",name:"中华人民共和国财政部",tagline:"国家治理的「钱袋子」",school:"资源调配",core:"财政资金",desc:"主管国家财政收支、财税政策、政府预算和国有资本金基础工作。掌握全游戏最核心的财政资金指标，擅长通过转移支付和税收杠杆调节地方发展。",role:"运筹帷幄的「操盘手」",skills:[{id:"mof_transfer",name:"专项转移支付",cd:6,desc:"向特定地区或领域定向拨款，迅速提升该地区的民生福祉或营商环境。",effect:"民生+20 营商+14 财政-16",fn:e=>{e.民生+=20,e.营商+=14,e.财政-=16}},{id:"mof_tax",name:"税制改革",cd:8,desc:"调整增值税或企业所得税率，影响全国企业活力和政府长期财政收入。",effect:"财政+16 营商+12 GDP+8 民生-6",fn:e=>{e.财政+=16,e.营商+=12,e.GDP+=8,e.民生-=6}}],crisis:"地方债务危机",crisisDesc:"若对地方盲目举债监管不力，可能引发系统性金融风险，导致中央财政被迫兜底，严重削弱上司好感度。"},mfa:{short:"外交部",name:"中华人民共和国外交部",tagline:"大国博弈的「执剑人」",school:"国际博弈",core:"国际声望",desc:"贯彻执行国家外交战略，维护国家主权、安全和发展利益。拥有独特的国际声望指标，擅长通过外交斡旋和国际贸易协定获取外部资源。",role:"冲锋陷阵的「破局者」",skills:[{id:"mfa_summit",name:"多边峰会",cd:6,desc:"主办或参与G20、APEC等国际会议，大幅提升国际声望和国内支持率。",effect:"国际声望+22 政绩+16 改革派+14",fn:e=>{e.国际声望=(e.国际声望||50)+22,e.政绩+=16,e.reformRep+=14}},{id:"mfa_fta",name:"贸易协定",cd:8,desc:"签署自由贸易协定(FTA)，为国内企业打开海外市场，拉动出口和GDP。",effect:"GDP+16 营商+16 国际声望+10",fn:e=>{e.GDP+=16,e.营商+=16,e.国际声望=(e.国际声望||50)+10}}],crisis:"外交摩擦",crisisDesc:"处理领土争端或贸易壁垒时，态度过于强硬可能引发制裁影响经济；过于软弱则遭国内民族主义情绪反噬，支持率暴跌。"},zzb:{short:"中组部",name:"中共中央组织部",tagline:"干部队伍的「总枢纽」",school:"人事布局",core:"干部档案",desc:"主管党的组织工作、干部队伍建设和人才工作。不直接管理经济或民生，但掌握干部档案和晋升推荐权，是游戏内最顶级的「造王者」路线。",role:"深藏不露的「执棋者」",skills:[{id:"zzb_inspect",name:"干部考察",cd:5,desc:"提前洞察下属或地方官员的忠诚度与潜在腐败风险，避免用人失误。",effect:"能力+16 廉政积分+12 道德+8 法治+8",fn:e=>{e.能力+=16,e.廉政积分=(e.廉政积分||0)+12,e.道德+=8,e.法治=(e.法治||60)+8}},{id:"zzb_select",name:"定向选调",cd:8,desc:"优先提拔自己培养的嫡系干部到关键岗位，构建稳固的执政基本盘。",effect:"人脉+22 务实派+16 改革派+10 上司好感+12",fn:e=>{e.人脉+=22,e.partyRep+=16,e.reformRep+=10,e.上司好感+=12}}],crisis:"买官卖官",crisisDesc:"若在人事任命中过度偏向个人利益，可能触发「巡视组进驻」事件，一旦查实，直接面临身陷囹圄的结局。"},miit:{short:"工信部",name:"工业和信息化部",tagline:"实体经济的「压舱石」",school:"产业升级",core:"科技创新",desc:"拟订并组织实施工业行业规划、产业政策和标准，推动信息化和工业化融合。专注于科技创新和制造业竞争力，推动国家从制造大国向制造强国转型。",role:"冲锋陷阵的「破局者」",skills:[{id:"miit_giant",name:"专精特新",cd:6,desc:"扶持「小巨人」企业，突破「卡脖子」技术，提升国家核心竞争力。",effect:"科创+22 政绩+18 GDP+10 财政-10",fn:e=>{e.科创=(e.科创||50)+22,e.政绩+=18,e.GDP+=10,e.财政-=10}},{id:"miit_infra",name:"新基建",cd:8,desc:"推动5G、人工智能、工业互联网等新型基础设施建设，奠定未来十年增长基础。",effect:"GDP+16 科创+12 营商+12 财政-14",fn:e=>{e.GDP+=16,e.科创=(e.科创||50)+12,e.营商+=12,e.财政-=14}}],crisis:"技术封锁",crisisDesc:"在国际博弈中可能遭遇核心技术断供，导致产业链瘫痪，需要消耗巨额资金和极长时间进行「国产替代」。"},mee:{short:"生态环境部",name:"中华人民共和国生态环境部",tagline:"绿色发展的「守门员」",school:"长期主义",core:"生态指数",desc:"建立健全生态环境基本制度，统一负责生态环境监测和执法工作。短期可能因关停污染企业拖累GDP，但长期显著提升生态指数和民生福祉，是高质量发展的关键。",role:"高瞻远瞩的「布道者」",skills:[{id:"mee_inspect",name:"环保督察",cd:6,desc:"对地方进行突击检查，强制关停违规企业，迅速提升生态指标，但会得罪地方利益集团。",effect:"生态+26 道德+12 GDP-12 民生-6 人脉-8（懂经济的环保官：民生/人脉损失减半）",fn:e=>{const n=hasBuff("green_finance");e.生态+=26,e.道德+=12,e.GDP-=12,e.民生-=n?3:6,e.人脉-=n?4:8}},{id:"mee_carbon",name:"碳交易市场",cd:8,desc:"建立全国碳排放权交易市场，用市场化手段推动节能减排，同时创造新经济增长点。",effect:"生态+16 GDP+10 营商+10 财政+8",fn:e=>{e.生态+=16,e.GDP+=10,e.营商+=10,e.财政+=8}}],crisis:"一刀切",crisisDesc:"若执行环保政策过于激进，导致大量企业倒闭和工人失业，会引发严重的社会不稳定事件。"},mps:{short:"公安部",name:"中华人民共和国公安部",tagline:"平安中国的「守夜人」",school:"平安建设",core:"社会治安",desc:"国务院组成部门，主管全国公安工作，维护社会治安秩序、打击违法犯罪、管理道路交通与出入境。治安与法治两项指标在此能获得最直接的增长。",role:"冲锋陷阵的「破局者」",skills:[{id:"mps_crackdown",name:"专项严打整治",cd:6,desc:"针对突出治安问题开展集中打击整治，短期内显著改善治安状况，但高强度行动消耗队伍精力。",effect:"治安+24 法治+8 政绩+18 民生+6 健康-6",fn:e=>{e.治安=(e.治安||60)+24,e.法治=(e.法治||60)+8,e.政绩+=18,e.民生+=6,e.健康-=6}},{id:"mps_smart",name:"智慧警务",cd:8,desc:"推进执法规范化与信息化建设，既提升办案质效，也把权力关进制度的笼子。",effect:"治安+14 法治+18 能力+10 政绩+8",fn:e=>{e.治安=(e.治安||60)+14,e.法治=(e.法治||60)+18,e.能力+=10,e.政绩+=8}}],crisis:"执法不规范",crisisDesc:"若一味追求破案率与打击数，可能酿成冤假错案或执法粗暴事件，一旦舆情发酵，将严重损害法治指标与上级信任。"},moe:{short:"教育部",name:"中华人民共和国教育部",tagline:"百年树人的「奠基者」",school:"长期主义",core:"人力资本",desc:"国务院组成部门，主管全国教育事业与语言文字工作。教育投入见效慢，但对民生与科创的长期拉动最为扎实。",role:"高瞻远瞩的「布道者」",skills:[{id:"moe_balance",name:"义务教育均衡",cd:6,desc:"推动优质师资轮岗与集团化办学，缩小校际差距，是最得民心的改革之一。",effect:"民生+22 道德+10 法治+6 财政-10",fn:e=>{e.民生+=22,e.道德+=10,e.法治=(e.法治||60)+6,e.财政-=10}},{id:"moe_univ",name:"双一流建设",cd:8,desc:"集中资源建设世界一流大学与学科，夯实国家 ",role:"冲锋陷阵的「破局者」",skills:[{id:"mot_project",name:"重大交通工程",cd:6,desc:"推进高铁、高速公路与港航枢纽建设，短期强力拉动投资与就业。",effect:"GDP+20 政绩+20 营商+8 生态-6 财政-12",fn:e=>{e.GDP+=20,e.政绩+=20,e.营商+=8,e.生态-=6,e.财政-=12}},{id:"mot_logistics",name:"物流降本增效",cd:8,desc:"打通多式联运堵点，降低全社会物流成本，直接改善营商环境。",effect:"营商+20 GDP+12 政绩+10 财政-6",fn:e=>{e.营商+=20,e.GDP+=12,e.政绩+=10,e.财政-=6}}],crisis:"重大安全事故",crisisDesc:"交通运输领域一旦发生特别重大安全事故，按安全生产一票否决规定，将直接终结本年度评优评先资格。"},ccdi:{short:"中央纪委国家监委",name:"中央纪律检查委员会 / 国家监察委员会",tagline:"党纪国法的「执剑者」",school:"监督执纪",core:"廉政建设",desc:"党内监督和国家监察的专责机关，履行监督执纪问责与监督调查处置。廉政积分与人脉的取舍在此最为尖锐。",role:"深藏不露的「执棋者」",skills:[{id:"ccdi_inspect",name:"巡视巡察",cd:6,desc:"开展常规巡视与专项巡视，形成有力震慑，但被巡对象对你必然心存戒备。",effect:"廉政积分+22 道德+10 法治+8 政绩+12 人脉-12",fn:e=>{e.廉政积分=(e.廉政积分||0)+22,e.道德+=10,e.法治=(e.法治||60)+8,e.政绩+=12,e.人脉-=12}},{id:"ccdi_clean",name:"整治群众身边腐败",cd:8,desc:"聚焦惠民资金、集体「三资」等领域，查处侵害群众利益的不正之风。",effect:"廉政积分+16 民生+16 法治+8 道德+6",fn:e=>{e.廉政积分=(e.廉政积分||0)+16,e.民生+=16,e.法治=(e.法治||60)+8,e.道德+=6}}],crisis:"灯下黑",crisisDesc:"纪检监察干部自身违纪违法，性质尤为恶劣，一旦查实将从重处理，此前积累的廉政积分一并归零。"},cnao:{short:"审计署",name:"中华人民共和国审计署",tagline:"国家资金的「铁算盘」",school:"监督执纪",core:"财政监督",desc:"国务院组成部门，主管全国审计工作，对财政收支与领导干部经济责任实行审计监督。查得越深，财政越实，人缘越差。",role:"深藏不露的「执棋者」",skills:[{id:"cnao_budget",name:"预算执行审计",cd:6,desc:"对部门预算执行与专项资金开展审计，追回被挤占挪用的财政资金。",effect:"财政+18 廉政积分+16 能力+8 人脉-10",fn:e=>{e.财政+=18,e.廉政积分=(e.廉政积分||0)+16,e.能力+=8,e.人脉-=10}},{id:"cnao_track",name:"政策落实跟踪审计",cd:8,desc:"围绕重大政策落地与重点项目推进持续跟踪，打通「中梗阻」。",effect:"政绩+16 民生+10 财政+8 上司好感+8",fn:e=>{e.政绩+=16,e.民生+=10,e.财政+=8,e.上司好感+=8}}],crisis:"整改落空",crisisDesc:"审计查出问题却屡审屡犯、整改流于形式，将被认定为履职不力，审计成果无法转化为治理效能。"},nbs:{short:"国家统计局",name:"国家统计局",tagline:"国之大数的「看门人」",school:"监督执纪",core:"数据质量",desc:"国务院直属机构，主管全国统计与国民经济核算。数据真实与否，直接关系宏观决策成败，也最能考验操守。",role:"深藏不露的「执棋者」",skills:[{id:"nbs_check",name:"统计执法核查",cd:6,desc:"对地方数据开展执法检查，坚决挤干水分，还原真实经济面貌。",effect:"廉政积分+18 道德+10 法治+8 能力+8 人脉-10",fn:e=>{e.廉政积分=(e.廉政积分||0)+18,e.道德+=10,e.法治=(e.法治||60)+8,e.能力+=8,e.人脉-=10}},{id:"nbs_census",name:"国情国力普查",cd:8,desc:"组织实施人口 eof n.assets||(n.assets={"总额":0,"已洗白":0}),n.assets.总额=Math.max(0,Math.round(10*((n.assets.总额||0)+e))/10)}catch(e){}}function S_foe(){try{if(!S.敌对派系)return null;const e=Object.keys(S.敌对派系);if(!e.length)return null;let n=null;return e.forEach(e=>{const t=S.敌对派系[e]||{};(!n||(t.对立||0)>((S.敌对派系[n]||{}).对立||0))&&(n=e)}),n}catch(e){return null}}function S_campDelta(e,n){try{const t=S_foe();if(!t)return;const a=S.敌对派系[t],s="血仇"===e?200:100;a[e]=Math.max(0,Math.min(s,(a[e]||0)+n))}catch(e){}}const STORY_DEFS=[{id:"town_land",name:"征地风波",emoji:"🚩",cat:"乡镇",brief:"产业园要落地，三个自然村、四百余户要签字。",chapters:[{t:"一 · 三张表格",body:"县里定下在你镇落地装备制造产业园，征地涉及三个自然村、四百余户。动员会上，镇长把三张纸推到你面前：红线图、补偿测算表，还有一张写着交地时间的进度表。散会时，十几个村民代表堵在办公楼下，要个说法。",opts:[{t:"连夜带人入户",d:"一家一家谈。慢，但谈得透",e:{"民生":6,"健康":-5,"人脉":3},log:"你带着驻村干部连着走了七个晚上，把政策一条条讲给村民听。",to:1},{t:"村两委分片包干",d:"交给村干部，进度最快",e:{"政绩":5,"信访":8,"民生":-3},log:"任务压到村两委头上，进度上去了，可有几户是被“做工作”做通的。",to:1},{t:"如实向上报告难度",d:"把实情摆到县里桌面上",e:{"上司好感":5,"政绩":-4,"能力":2},log:"你写了一份三千字的情况报告，把三村的实际困难如实报了上去。",to:1}]},{t:"二 · 村东头那户",body:"进度过了七成，只剩村东头老周家。老周的儿子在县城某局当副科长，本人懂政策、认死理，翻着《土地管理法》跟你说程序不合法。书记在会上撂下一句：办法你自己想，地必须按时交。",opts:[{t:"请他儿子单位领导出面",d:"借力施压，快，但留话柄",e:{"人脉":-4,"暴露":3,"攀附":2},log:"你绕了一层关系，请他单位的领导“帮忙做做工作”。第二天老周就签了，可镇上开始有人议论。",to:2},{t:"走公告催告、依法交地",d:"程序走到哪算哪",e:{"法治":6,"政绩":-4,"健康":-3},log:"你把程序一步步走完：公告、听证、催告、依法交地。慢了半个月，但经得起查。",to:2},{t:"在政策上限内提高补偿",d:"花钱买太平",e:{"财政":-6,cash:-10,"信访":10},log:"你在政策允许的上限内给足了补偿。老周签了字，隔壁村听说后，第二天来了二十多人要求“同等待遇”。",to:2}]},{t:"三 · 交地那天",body:"推土机开进村东头的那天，你也站在地头。老周没来，他儿子来了，站在人群最后面，没跟你打招呼。镇长拍着你的肩膀说：行了，这一关算过去了。可你知道，真正的账在后面。",opts:[{t:"把后续安置盯到底",d:"签完字才是开始",e:{"民生":7,"政绩":4,"健康":-4},log:"交地后你半月一次回访安置点，督促兑现承诺。三年后这里成了全县征地安置的样板。",to:-1,end:"产业园如期开工，四百余户全部安置到位。多年后你路过这片厂区，还能说出每个村当初卡在哪一户上。<b>「征地风波」</b>——你把最难的一段路走成了样板。"},{t:"交完就交，不回头看",d:"事已了结",e:{"政绩":3,"民生":-4,"信访":6},log:"地交了，你转头去忙下一个项目。安置点的承诺兑现得磕磕绊绊，几年后仍有人在信访窗口提起你的名字。",to:-1,end:"项目落地了，你也因此被记了一功。只是那片安置区的水泥路，直到你调离都还没修完。<b>「征地风波」</b>——过关了，但没有收尾。"},{t:"写成材料，向上反映",d:"把问题留给制度",e:{"能力":6,"法治":4,"上司好感":-3},log:"你写了一份基层征地工作的调研报告，直陈补偿标准与程序衔接的问题。县里有人不高兴，但市里转发了。",to:-1,end:"你写的那份调研报告后来被市里转发，成了修订补偿标准的参考之一。为此你得罪了几个人，也记住了几个人。<b>「征地风波」</b>——你把一件事做成了一份材料。"}]}]},{id:"county_year",name:"换届之年",emoji:"🗳️",cat:"县市主官",brief:"换届在即，空气里都是消息。",chapters:[{t:"一 · 饭桌上的一句话",body:"省里换届的风声下来，县里空气都变了。周末饭局上，一位与市委书记走得近的老兄半真半假地说：今年要动一批，你得主动些。说完就转了话题，像是什么都没说过。",opts:[{t:"找机会向书记当面汇报",d:"把想法摆到明处",e:{"上司好感":6,"道德":2,"政绩":-2},log:"你借汇报工作的机会，把自己的想法和不便直说的顾虑都摊开了。书记没表态，但听得很认真。",to:1},{t:"按兵不动，把当年工作干好",d:"不跑不要",e:{"政绩":6,"道德":4,"能力":3},log:"你谁也没找，一头扎进年底的收官工作。有人说你不懂事，也有人说你沉得住气。",to:1},{t:"托人打点，送点“心意”",d:"规矩之外有路子",e:{"灰产":18,"暴露":6,"攀附":5,"道德":-8},log:"你托人递了话，也递了东西。回话说“领导心里有数”，可你心里并没底。",to:1}]},{t:"二 · 一封举报信",body:"就在最关键的时候，市纪委收到一封举报信，指你任内那个产业园项目违规变更土地用途。信写得很内行，连会议纪要的编号都对得上。组织部的考察组后天就到。",opts:[{t:"主动配合，把账摊开",d:"经得起查就不怕查",e:{"廉政":8,"道德":5,"政绩":-5,"健康":-4},log:"你主动调出全部会议纪要与批复文件，配合核查。结论是程序有瑕疵、无个人问题，但贻误了时机。",to:2},{t:"找关系把信压下来",d:"查无此事",e:{"暴露":9,"攀附":6,"道德":-10,"灰产":12},log:"你找人打听过信的来路，也托人“打了招呼”。事情暂时没声了，可你知道这封信还在某份卷宗里。",to:2},{t:"反查举报人",d:"是谁在背后",e:{"人脉":-6,"对立":14,"道德":-5,"能力":3},log:"你让人摸了摸写信的人。查出是当初落选的另一个副手的旧部。你记下了这个名字。",to:2}]},{t:"三 · 考察组走后",body:"考察组待了三天，谈话十七人次，走的时候没留下任何结论。一周后，市委的任免文件下来了。你把那张纸看了两遍，然后放进抽屉。",opts:[{t:"去报到，什么也不说",d:"服从组织",e:{"政绩":8,"能力":4,"道德":2},log:"你按文件去新岗位报到，只带了一个纸箱。多年后有人问起那年，你说：组织安排的。",to:-1,end:"那一年你动了一级，也留下了一个至今说不清的举报信。你按文件报到，什么也没解释。<b>「换届之年」</b>——你过了这一关，代价是记住了几个名字。"},{t:"向上申诉，要求澄清",d:"要一个说法",e:{"上司好感":-8,"道德":6,"法治":5,"政绩":-6},log:"你向组织递交了书面申诉，要求就举报事项作出结论。结论下来了，你被“另行安排”。",to:-1,end:"你坚持要一个说法，也确实拿到了——结论写着“反映问题不实”。只是那之后的三年，你再没动过。<b>「换届之年」</b>——你要到了清白，也付了代价。"},{t:"找书记长谈一次",d:"把话挑明",e:{"上司好感":10,"人脉":5,"道德":-3},log:"你约了书记，把那封信、那些传言、还有自己的打算一股脑说了。书记只回了一句：我了解你，但你得等。",to:-1,end:"那次长谈之后，你在原地又坐了两年，然后一次性解决了两级的台阶。有人说你会来事，也有人说你沉得住。<b>「换届之年」</b>——你等到了，也懂了。"}]}]},{id:"prov_env",name:"督察进驻",emoji:"🏭",cat:"省市主官",brief:"中央环保督察组进驻，第一站就是你这里。",chapters:[{t:"一 · 纳税大户",body:"中央生态环保督察组进驻全省，第一批交办件里，排在第一个的是临江化工园——你省里的纳税大户，也是上下游几十万人的饮水隐患。分管副省长在会上说：能不能“边生产边整改”？",opts:[{t:"立即停产整改",d:"断腕，但干净",e:{"生态":12,GDP:-8,"财政":-6,"环保":-25},log:"你签了停产令。当天园区四十家企业全部停产，当月工业增加值掉了三个点，省里议论了整整一个月。",to:1},{t:"边生产边整改",d:"两全其美？",e:{GDP:3,"生态":3,"环保":-8,"暴露":5},log:"你批了“边生产边整改”。整改报告写得很漂亮，可群众举报件每周还在增加。",to:1},{t:"先打招呼，缓一缓",d:"等风头过去",e:{"攀附":8,"暴露":10,"道德":-10,"环保":6},log:"你让人带了话，希望“把握节奏”。督察组没理这套，第二批交办件直接点了你的名。",to:1}]},{t:"二 · 约谈",body:"督察组约谈你的那天，会议室里坐着七个人。主持人把一沓举报件推过来，问：这些情况，省政府此前是否掌握？所有的目光都落在你身上。",opts:[{t:"如实认领，立行立改",d:"认账，才有整改",e:{"上司好感":6,"道德":6,"政绩":-8,"生态":6},log:"你把情况全认了，没有推给任何部门。督察组的通报里，你的表态被原文引用。",to:2},{t:"说明客观困难，请求支持",d:"讲道理",e:{"能力":4,"上司好感":-3,"生态":2},log:"你讲了几十万人的就业、讲了历史遗留、讲了财政压力。督察组记下了，也记下了你的态度。",to:2},{t:"把责任往下分解",d:"各负其责",e:{"人脉":-8,"道德":-6,"政绩":-4},log:"你把责任分到了市县两级。通报出来后，基层的怨气比污染还难消。",to:2}]},{t:"三 · 回头看",body:"一年后，督察组“回头看”。你站在江边，水色比去年清了些，岸上关停的厂房还没拆完。随行的人说，这次肯定过关。你没接话。",opts:[{t:"借势推动产业转型",d:"把危机变成机会",e:{"政绩":12,"生态":8,GDP:5,"能力":6},log:"你把督察整改做成了产业转型的切口，三年后这里成了新材料基地，上下游产值翻了一番。",to:-1,end:"三年后，那条江的水质稳定在Ⅲ类，新材料基地的产值超过了当年的化工园。<b>「督察进驻」</b>——你把一次问责，做成了一次转身。"},{t:"达标即止，恢复生产",d:"过关就好",e:{"政绩":4,"生态":-3,"环保":10},log:"整改达标后，园区陆续复产。指标回来了，可上下游的群众还在买桶装水。",to:-1,end:"督察“回头看”顺利过关，园区复产，数据好看。只有江边那几个村子，至今还在买桶装水喝。<b>「督察进驻」</b>——你过了关，河还没。"},{t:"主动加码，公开承诺",d:"给自己上压力",e:{"政绩":8,"上司好感":8,"生态":6,"健康":-6},log:"你在新闻发布会上公开承诺三年水质达标，并把承诺写进了政府工作报告。退路就此断了。",to:-1,end:"你把承诺写在政府工作报告里，每年向人大报告进度。压力大到你掉了十斤，但那条江真的清了。<b>「督察进驻」</b>——你把自己逼到了墙上，然后翻了过去。"}]}]},{id:"zone_bid",name:"龙头之争",emoji:"🏗️",cat:"开发区",brief:"一个百亿级项目，两个省在抢。",chapters:[{t:"一 · 凌晨三点的电话",body:"一家新能源整车企业要建第二基地，投资一百二十亿，带动配套企业上百家。隔壁省的分管副省长跟你是一个学校的，昨晚给你打了电话：老同学，这个我们志在必得。你放下电话，把团队叫了起来。",opts:[{t:"拼政策：地价、补贴、配套",d:"真金白银",e:{"财政":-10,GDP:6,cash:-15,"攀附":3},log:"你拿出了最优惠的条件：地价七折、设备补贴、配套基金。谈判桌上，对方的态度松动了。",to:1},{t:"拼服务：承诺“拿地即开工”",d:"用效率说话",e:{"营商":12,"能力":6,"健康":-6},log:"你不谈钱，谈时间：45天完成“拿地即开工”，全流程代办。对方半信半疑，但记下了这句话。",to:1},{t:"拼产业链：拿出配套清单",d:"用生态说话",e:{GDP:8,"营商":6,"能力":5},log:"你摊开全省的产业链图谱，两百家配套企业、三小时物流圈。对方的技术团队当场改了行程。",to:1}]},{t:"二 · 最后一轮的价码",body:"谈判到了最后一轮，对方 CFO 把一张清单推过来：地方配套基金出资三十亿、十年税收返还、代建厂房、高管个税奖励。财务的人在你耳边说：这个价，我们十年回不了本。",opts:[{t:"咬牙接下",d:"先把龙头拉进来",e:{"财政":-14,"债务":14,GDP:12,"政绩":10},log:"你签了。签字那天所有人都很高兴，只有财政局长没笑。三年后，这笔账成了你的隐性债务。",to:2},{t:"砍掉税收返还，其余照给",d:"守一条底线",e:{"财政":-6,"债务":6,GDP:8,"法治":5},log:"你把十年税收返还改成“依法依规、一事一议”。对方犹豫了三天，最终还是签了。",to:2},{t:"拉第三方基金进来分担",d:"不一个人扛",e:{"能力":7,"人脉":6,GDP:8,"财政":-4},log:"你引入了省产业基金和社会资本，把地方出资压到十亿。方案复杂了，但风险分摊了。",to:2}]},{t:"三 · 开工典礼",body:"开工那天，礼炮响了十二下。你站在奠基碑前，身后是省里来的领导，身前是三十台等待的挖掘机。手机震了一下——是老同学发来的三个字：恭喜啊。",opts:[{t:"把配套企业一并招进来",d:"一个项目变一条链",e:{GDP:12,"营商":8,"政绩":10,"健康":-6},log:"你带着招商图谱跑了十四趟，硬是把上下游三十多家企业拉到了周边。五年后，这里成了一个集群。",to:-1,end:"五年后，这里不只是一个整车厂，而是一整条新能源产业链，年产值过千亿。<b>「龙头之争」</b>——你赢的不只是一个项目，是一个集群。"},{t:"按部就班推进建设",d:"先建起来",e:{"政绩":6,GDP:6},log:"项目按节点推进，如期投产。它成了你任内最大的一块政绩，也成了后任最重的一块包袱。",to:-1,end:"整车厂如期投产，你任内的 GDP 曲线漂亮地抬了一截。只是那三十亿配套基金，在你调离后成了审计报告上的一行字。<b>「龙头之争」</b>——你赢了当下。"},{t:"主动公开协议条款",d:"把账摊在阳光下",e:{"法治":8,"上司好感":5,"政绩":-4,"道德":5},log:"你把招商协议的主要条款主动向社会公开，接受监督。有人说你傻，也有人大代表专门为此写了建议。",to:-1,end:"你公开了协议条款，引来一轮议论，也引来了一批更干净的项目。多年后，“阳光招商”成了这个开发区的招牌。<b>「龙头之争」</b>——你定了一条规矩。"}]}]},{id:"disc_first",name:"第一案",emoji:"🔍",cat:"纪检",brief:"初核的对象，是老领导的关系人。",chapters:[{t:"一 · 卷宗上的名字",body:"第一份需要你签字初核的线索，涉及一个熟悉的名字——市交通局的副局长。此人是你刚参加工作时的老领导的妻弟，当年你借调到市里，他还帮你租过房子。线索只有一条：某高速标段的中标异常。",opts:[{t:"按规定申请回避",d:"避嫌，也避事",e:{"道德":3,"廉政":2,"能力":-3,"政绩":-3},log:"你打了回避报告。案子转给了别人，从此与你无关。有人说你明哲保身，也有人说你懂规矩。",to:1},{t:"照查不误",d:"线索就是线索",e:{"廉政":10,"道德":6,"人脉":-8,"对立":10},log:"你在初核报告上签了字。当晚老领导打来电话，只说了一句“你还年轻”，就挂了。",to:1},{t:"先向纪委书记汇报再定",d:"把球传给组织",e:{"上司好感":6,"廉政":5,"能力":3},log:"你把情况原原本本向纪委书记汇报。书记说：案子照办，你照查，出了问题我担着。",to:1}]},{t:"二 · 老领导的那通电话",body:"初核进行到第二周，老领导约你吃饭。饭桌上他没提案子，只讲当年怎么把你从乡镇要上来、怎么在你最困难的时候保过你。临走时他说了一句：他家里两个孩子还小。",opts:[{t:"把话听完，案子继续",d:"情分归情分",e:{"廉政":8,"道德":5,"健康":-5,"对立":12},log:"你听完了，什么也没答应。第二天照常去核查组。老领导再也没有联系过你。",to:2},{t:"在权限内从轻处理",d:"留一线余地",e:{"廉政":-8,"道德":-8,"暴露":8,"人脉":6},log:"你把“涉嫌犯罪”改成了“违纪”，把移送改成了诫勉。老领导打来电话说：谢谢你。",to:2},{t:"把饭局如实报备",d:"把事情摆到明面",e:{"廉政":6,"法治":6,"上司好感":5,"对立":6},log:"你按规定填报了这次饭局，并把通话内容记入工作日志。核查组因此更加谨慎，也更加主动。",to:2}]},{t:"三 · 移送",body:"三个月后，案子查实：标的额两千余万，涉及三名处级干部。移送那天，你在办公室坐到很晚。桌上摆着当年老领导送你的那支钢笔。",opts:[{t:"一案一整改，堵塞漏洞",d:"办案之外还有制度",e:{"廉政":8,"法治":8,"能力":6,"政绩":6},log:"你推动交通局重构了招投标流程，把“评定分离”写了进去。此后三年，该领域信访量下降了七成。",to:-1,end:"案子办结，你推动的“评定分离”改革被省纪委推广。老领导退休后再没见过你，但每年春节会给你发一条短信。<b>「第一案」</b>——你办的是案子，改的是规矩。"},{t:"到此为止，见好就收",d:"不深挖",e:{"政绩":4,"廉政":-4,"道德":-3},log:"你把案子结在了现有证据上，没有再往上追。有人说你会办事，也有人在背后说你“留了尾巴”。",to:-1,end:"案子办结，三人获刑。你没再往上追，也没有人追问为什么不追。<b>「第一案」</b>——你学会了在恰当的地方停下。"},{t:"向上追，一查到底",d:"拔出萝卜带出泥",e:{"廉政":12,"道德":8,"对立":20,"血仇":12,"健康":-8},log:"你顺着资金流继续追，牵出了两名厅级干部。震动了整个系统，也得罪了整整一批人。",to:-1,end:"你一查到底，牵出两名厅级干部。系统震动，你也成了某些名单上的常客。<b>「第一案」</b>——你把一条线索追成了一场风暴，从此再没有退路。"}]}]}],STORY_DEFS_2=[{id:"judge_dust",name:"尘封卷宗",emoji:"⚖️",cat:"法检",brief:"一份二十年前的申诉材料，牵着一位现任领导。",chapters:[{t:"一 · 申诉材料",body:"信访窗口转来一份申诉材料，纸都脆了。案子是二十年前的一起合同诈骗，被告人判了十一年，服刑八年，出狱后申诉至今。你翻卷宗时发现，当年的一份关键证言笔录，签字日期在讯问日期之前。",opts:[{t:"调齐原卷，逐页核",d:"先把事实弄清楚",e:{"法治":8,"能力":6,"健康":-6},log:"你把尘封的二十三册卷宗全部调出，逐页核对签名、日期、笔迹。同事们陪你加了两个月的班。",to:1},{t:"先报审判委员会",d:"把问题交给组织",e:{"上司好感":6,"法治":4,"能力":2},log:"你把疑点整理成书面报告，提交审判委员会讨论。会议开了三次，没有结论。",to:1},{t:"先找当年办案人聊聊",d:"听听当事人的说法",e:{"人脉":5,"道德":-3,"法治":3},log:"你私下找了当年已退休的主办人。他抽了半包烟，只说：那个年代，都那样。",to:1}]},{t:"二 · 有人来电话",body:"核到第六册时，你发现当年的证人如今是邻市一位现任领导的亲属。也就在这一周，你接连接到三个电话：一个是老同事，一个是政法委的朋友，还有一个你甚至叫不出名字。他们都没提案子，只说：最近忙不忙。",opts:[{t:"照常推进，记录在案",d:"把招呼记下来",e:{"法治":8,"道德":8,"廉政":6,"对立":12},log:"你把三次来电的时间、号码、内容按规定记入工作日志，案子照查。此后电话没了。",to:2},{t:"暂缓，等一等",d:"让子弹飞一会",e:{"法治":-6,"道德":-6,"暴露":5,"上司好感":4},log:"你把案子压了压。申诉人每个月来一次，最后一次是在台阶上坐了半天。",to:2},{t:"请示院长",d:"请上级定夺",e:{"上司好感":7,"法治":4,"能力":3},log:"你向院长汇报了全部情况。院长沉默了很久，说：依法办，出了问题党组担。",to:2}]},{t:"三 · 再审",body:"再审开庭那天，申诉人已经五十七岁，头发全白了。他站在法庭中央，把二十年前的话又讲了一遍，讲得比卷宗里的笔录还清楚。休庭时，你在走廊上遇到当年那位证人的亲属，双方都没说话。",opts:[{t:"依法改判，并启动追责",d:"错了就要纠正",e:{"法治":12,"道德":8,"廉政":8,"对立":20,"血仇":10},log:"法院依法改判无罪，并建议对当年的程序违法问题启动调查。追责名单上有三个人。",to:-1,end:"改判无罪那天，他在法庭上哭了。你推动的错案追责动了三个人，也得罪了一片人。<b>「尘封卷宗」</b>——你把二十年前的错案纠正了过来。"},{t:"改判，但不追责",d:"纠错不揪人",e:{"法治":8,"道德":3,"廉政":-3},log:"法院改判无罪。至于当年怎么办的，谁办的，没有人再提起。申诉人给你送了一面锦旗。",to:-1,end:"案子改判了，人放出来了，锦旗挂在会议室。至于当年那份笔录是谁造的，再没人问。<b>「尘封卷宗」</b>——你纠正了结果，没有追问原因。"},{t:"维持原判",d:"证据不足以推翻",e:{"法治":-8,"道德":-8,"上司好感":6,"政绩":5},log:"审判委员会最终决定维持原判。你在决定书上签了字，那天回家很早，也很晚睡。",to:-1,end:"申诉被驳回。三年后他病逝，家属把那份申诉材料寄给了省高院。<b>「尘封卷宗」</b>——你在卷宗上签了字，也在心里记了一辈子。"}]}]},{id:"org_two",name:"两个名单",emoji:"🧭",cat:"党委部门",brief:"一个位置，两个人选，还有一张条子。",chapters:[{t:"一 · 考察",body:"一个重要的局长位置空了出来。考察下来，两个人选：老周，资历老、人缘好，任内没出过大事，也没干成过什么；小林，年轻、能干，三年前那场处置他冲在最前面，但有人说他“个性强、不好配合”。",opts:[{t:"拉长考察期，再看半年",d:"让时间说话",e:{"能力":6,"政绩":-4,"道德":3},log:"你把考察期延长了半年。半年后，小林主导的一项改革出了成果，老周那边平平。",to:1},{t:"听多数人意见",d:"德才看口碑",e:{"人脉":6,"上司好感":4,"能力":2},log:"你扩大了谈话范围，三十六人次。谈话记录里，老周出现最多的评价是“稳”，小林是“敢”。",to:1},{t:"按岗位需要定人",d:"因岗择人",e:{"能力":7,"法治":4,"道德":3},log:"你把岗位需要的三项能力与两人逐项比对，形成了一份岗位适配分析，摆到了部务会上。",to:1}]},{t:"二 · 条子",body:"上会前一天，你的桌上出现了一张条子，没有署名，只有一行字：老周的事，请予关照。同一天，一位老领导打来电话，说小林“还需要再锻炼锻炼”。这两件事，你在部务会上都没提。",opts:[{t:"把条子交纪检组备案",d:"按规定办",e:{"廉政":8,"法治":6,"对立":10,"上司好感":-4},log:"你把条子原件交给了派驻纪检组，并在部务会上说明。会场安静了很久。",to:2},{t:"不提条子，按自己的判断报",d:"只认岗位需要",e:{"能力":5,"道德":4,"廉政":3},log:"你什么也没说，按考察结论报了方案。至于那张条子，你锁进了抽屉。",to:2},{t:"向书记单独汇报",d:"把压力上移",e:{"上司好感":8,"廉政":4,"能力":3},log:"你把条子和电话都向书记作了汇报。书记说：你按程序报，其他的我来担。",to:2}]},{t:"三 · 票决",body:"常委会票决那天，你列席汇报。读完成绩和缺点，书记问：还有没有要补充的？你想起那张条子，想起那位老领导的电话，也想起小林三年前站在堤上的样子。",opts:[{t:"如实补充两张条子的情况",d:"把话说在桌面上",e:{"廉政":10,"法治":6,"道德":6,"对立":15},log:"你把两张条子的来龙去脉在会上原原本本说了。会场气氛凝重，但表决时没有一张反对票给小林。",to:-1,end:"小林上任后干成了三件硬事，也印证了你那次如实汇报的价值。<b>「两个名单」</b>——你把桌下的东西摆到了桌面上。"},{t:"只报考察结论",d:"不节外生枝",e:{"能力":4,"上司好感":5,"廉政":2},log:"你只汇报了考察结论，没有提条子。方案顺利通过，各方面都满意。",to:-1,end:"方案顺利通过，没有人得罪，也没有人记住你做过什么。<b>「两个名单」</b>——你把一个用人决定做成了一次程序。"},{t:"推荐老周，保平稳",d:"稳字当头",e:{"人脉":8,"上司好感":6,"道德":-5,"政绩":-4},log:"你在汇报中突出了老周的“稳”。最终老周上任，岗位三年没有起色。",to:-1,end:"老周上任后三年，那个局没有出事，也没有干事。<b>「两个名单」</b>——你选了最不容易出错的那个人。"}]}]},{id:"min_doc",name:"一份文件",emoji:"📑",cat:"部委",brief:"你起草的文件，动了地方的钱袋子。",chapters:[{t:"一 · 征求意见",body:"你牵头起草的一份规范性文件到了征求意见阶段。核心是一条：把某项补贴的发放标准从“地方自定”改为“全国统一底线”。稿子发出去第三天，反馈意见收到两百多条，其中一百八十条来自地方。",opts:[{t:"逐条梳理，能吸收的尽量吸收",d:"开门立法",e:{"能力":6,"法治":5,"健康":-6,"上司好感":-2},log:"你带着处里的人把两百多条意见逐条归类，吸纳了其中四十余条。文件更厚了，也更实了。",to:1},{t:"守住底线，其余不放",d:"该坚持的坚持",e:{"法治":6,"道德":5,"上司好感":3,"人脉":-5},log:"你只在表述上作了微调，核心条款一个字没动。地方的意见会上，有人当场摔了门。",to:1},{t:"先下去调研一趟",d:"到现场看看",e:{"能力":7,"民生":4,"健康":-5,"上司好感":4},log:"你带着稿子去了三个省，蹲了十一天。回来后改了七处，都是农民跟你说的话。",to:1}]},{t:"二 · 部领导的修改意见",body:"稿子报上去，部领导批了两行字：方向是对的，步子是不是迈得太大？再稳一稳。你知道“稳一稳”是什么意思——隔壁司去年一份文件，稳了两年就没了。",opts:[{t:"书面说明为什么不能退",d:"据理力争",e:{"能力":6,"上司好感":-5,"法治":4,"道德":3},log:"你写了一份两千字的说明，附上三个省的调研数据。部领导批：再议。",to:2},{t:"分步走，先试点",d:"用时间换空间",e:{"能力":7,"上司好感":6,"民生":4},log:"你把“一步到位”改成“三年过渡、先行试点”。文件当年就印发了，试点省份第一年效果不错。",to:2},{t:"照领导意思办",d:"执行就是了",e:{"上司好感":8,"能力":-3,"道德":-2},log:"你把核心条款改成了“鼓励”“支持”。文件印发后，没有人反对，也没有人执行。",to:2}]},{t:"三 · 印发之后",body:"文件印发那天，你在印厂校最后一遍清样。铅字味很重，窗外天已经亮了。印发之后，是你的名字第一次以起草人的身份出现在部委公报上——也可能是最后一次。",opts:[{t:"盯住落地，跟踪评估",d:"发了不等于完了",e:{"政绩":8,"能力":6,"民生":5,"健康":-5},log:"你推动建立了季度跟踪机制，两年后拿出了评估报告。文件因此修订了一次，也更管用了。",to:-1,end:"两年后，这份文件因跟踪评估而修订，成了同类文件中执行得最好的一份。<b>「一份文件」</b>——你不但把它发了出去，还盯着它落了地。"},{t:"交出去，接下一个",d:"流程走完",e:{"政绩":4,"能力":3},log:"文件印发后，你交了档，接手了下一个任务。执行得怎么样，你再没过问。",to:-1,end:"文件发了，任务交了。多年后你翻到那份公报，已经想不起里面写了什么。<b>「一份文件」</b>——你完成了一件工作。"},{t:"写成文章，把思考留下来",d:"留下点东西",e:{"能力":8,"政绩":3,"法治":4},log:"你把起草过程中的思考写成了一篇两万字的长文，发在内部刊物上。三年后，有人引用了它。",to:-1,end:"你写的那篇长文后来被反复引用，成了这个领域的入门材料。<b>「一份文件」</b>——文件会过期，思考留下了。"}]}]},{id:"last_mile",name:"最后一程",emoji:"🍂",cat:"二线",brief:"退居二线之后，说还是不说。",chapters:[{t:"一 · 调研中的发现",body:"转任人大之后，你有了更多时间下基层。这半年你跑了十一个县，发现一个共同的问题：某项专项资金层层截留，到村一级只剩六成。你把数据整理成了一张表。",opts:[{t:"写进调研报告",d:"白纸黑字",e:{"能力":5,"道德":4,"政绩":-3,"上司好感":-4},log:"你把那张表写进了调研报告，措辞克制，但数字刺眼。报告报送后，很长时间没有回音。",to:1},{t:"先跟老同事通个气",d:"先私下说说",e:{"人脉":5,"道德":-2,"上司好感":3},log:"你找了还在任上的老同事，把情况说了。他听完只说了一句：你已经是人大了。",to:1},{t:"多跑几个县，把证据坐实",d:"再扎实一点",e:{"能力":7,"健康":-6,"道德":3},log:"你又跑了六个县，跑了整整两个月，把每一笔资金的流向都核了一遍。材料厚得像砖头。",to:1}]},{t:"二 · 座谈会上的三分钟",body:"省里开座谈会，主题是“发挥老同志作用”。前面几位都讲得很得体。轮到你时，主持人看了一眼表，笑着说：老领导，三分钟。",opts:[{t:"照着三分钟讲，讲那张表",d:"只讲事实",e:{"道德":6,"廉政":5,"上司好感":-8,"对立":10},log:"你在三分钟里只讲了三组数字。会场很静。会后没有人跟你讨论这三组数字。",to:2},{t:"讲体面话，材料另送",d:"换个方式抵达",e:{"上司好感":4,"道德":2,"能力":3},log:"你在会上讲了些得体的话，会后把材料单独送给了主要领导。一周后，领导约你谈了一次。",to:2},{t:"不讲了",d:"到此为止",e:{"人脉":4,"道德":-5,"政绩":2},log:"你把材料收了起来，讲了几句场面话。那天你回家很早，睡得也早。",to:2}]},{t:"三 · 卸任之前",body:"任期将满，办公室要腾出来了。你收拾东西时又翻出那张表，纸边已经卷了。窗外的梧桐还是你刚来那年种的，如今已经高过三楼。",opts:[{t:"把材料留给来接任的年轻人",d:"交给下一代",e:{"能力":6,"道德":6,"人脉":4},log:"你把材料交给了新来的副主任，一个三十出头的年轻人。他翻了两页，抬头问：这我能用吗？你说：能。",to:-1,end:"两年后，那项资金的拨付方式真的改了。改的人是你交材料的那个年轻人。<b>「最后一程」</b>——你把火把递了出去。"},{t:"公开发表，把话说出去",d:"说给所有人听",e:{"道德":8,"廉政":6,"对立":18,"上司好感":-6},log:"你把调研报告发在了公开刊物上。引起了一场不大不小的风波，也推动了一次专项清理。",to:-1,end:"报告公开发表后，省里开展了专项清理，追回资金两个多亿。<b>「最后一程」</b>——你在最后一程说了该说的话。"},{t:"带走，什么都不说",d:"留作纪念",e:{"道德":-4,"政绩":3},log:"你把材料带回了家，锁进书柜。那件事此后与你无关，也与任何人无关。",to:-1,end:"你把那张表带回了家，锁进书柜最底层。<b>「最后一程」</b>——你走完了这一程，什么也没留下。"}]}]},{id:"r_first_draft",name:"第一份材料",emoji:"✍️",cat:null,minRank:0,maxRank:2,brief:"领导让你写份材料，明天早上要。",chapters:[{t:"一 · 明天早上要",body:"下班前十分钟，科长把你叫过去：明天上午有个会，你写个发言材料，不长，两千来字。说完他就走了，没说给谁写的、讲什么主题、什么口径。办公室的人陆续走了，灯还亮着。",opts:[{t:"翻出前两年的同类材料对照",d:"先学样子",e:{"能力":6,"健康":-4},log:"你把档案柜里三年的同类材料都翻出来，一句句对着看，看出了口径和套路。天亮时，稿子成型了。",to:1},{t:"打电话问清楚再动笔",d:"问明白再写",e:{"能力":3,"上司好感":3,"人脉":2},log:"你给科长家打了个电话，问清了场合、对象和调门。科长说了十分钟，最后一句是：小同志还挺细。",to:1},{t:"按自己的理解一气写完",d:"写完再说",e:{"能力":4,"健康":-5,"政绩":2},log:"你没问，按自己对工作的理解写到凌晨两点。稿子很用心，但调门不对。",to:1}]},{t:"二 · 红笔",body:"第二天下午，稿子回到了你桌上，红笔改了十七处。科长在最后一页写了一句：思路可以，但这是给局长念的。你把那页纸看了很久。",opts:[{t:"把十七处改动逐条琢磨透",d:"改在哪，为什么",e:{"能力":8,"健康":-3},log:"你把每一处改动的原因都想明白了：这句太满、这个提法没有出处、那里该留余地。你把它们记在了一个本子上。",to:2},{t:"主动重写一遍",d:"推倒重来",e:{"能力":6,"健康":-5,"上司好感":4},log:"你把稿子整个重写了一遍，当晚交给科长。他看了看，说：这才像话。",to:2},{t:"改完就算了",d:"完成任务",e:{"能力":2,"政绩":2},log:"你按改动改完，交了上去。材料用了，事也就过去了。",to:2}]},{t:"三 · 会议室外",body:"开会那天你没资格进会场，只负责在门口候着。中场休息时，局长走出来，跟科长说了句：这材料谁写的？科长朝你的方向抬了抬下巴。局长看了你一眼，没说话。",opts:[{t:"把那个本子一直记下去",d:"把本事长在身上",e:{"能力":10,"政绩":4},log:"你把那十七处改动的本子一直记了下去，记了整整八年，记满了七个本子。后来你成了单位里写材料最快的人。",to:-1,end:"多年以后，你的稿子很少再被改。那个记了七年的本子还放在抽屉里。<b>「第一份材料」</b>——你从一份被改了十七处的稿子里，学到了一辈子的手艺。"},{t:"找机会让领导记住自己",d:"抓住这一眼",e:{"上司好感":8,"人脉":5,"道德":-2},log:"此后每次有机会，你都主动往前站一点。半年后，局长记住了你的名字。",to:-1,end:"半年后，局长能叫出你的名字。这在单位里，是第一步。<b>「第一份材料」</b>——你让关键的人记住了一个名字。"},{t:"踏实干活，不刻意",d:"路还长",e:{"能力":4,"道德":3,"政绩":3},log:"你什么也没做，继续写你的材料。三年后，你成了科里最离不开的那个人。",to:-1,end:"你没刻意做什么，只是每一份材料都认真写。三年后，科里离不了你。<b>「第一份材料」</b>——你把一件小事做到了别人做不了。"}]}]},{id:"r_first_lead",name:"第一次担纲",emoji:"🎒",cat:null,minRank:3,maxRank:7,brief:"第一次有人跟着你干活了。",chapters:[{t:"一 · 两个兵",body:"你第一次有了自己的摊子：两个兵，一个比你早来十年的老张，一个刚入职的小姑娘。第一个任务是清一批积压了三年的档案，两周内完成。第一天，老张泡了杯茶，说：不急，这些年都是这么过来的。",opts:[{t:"自己先干，干给他们看",d:"身先士卒",e:{"能力":5,"人脉":4,"健康":-5},log:"你没说话，自己搬来第一箱档案开始清。第二天老张没泡茶，第三天小姑娘提前到了。",to:1},{t:"分好工，压责任到人",d:"定岗定责",e:{"能力":6,"法治":3,"人脉":-2},log:"你把任务切成三块，每人一块，贴在了墙上。老张的脸色不太好，但两周后三块都完成了。",to:1},{t:"先跟老张喝顿酒",d:"先把关系理顺",e:{"人脉":7,"道德":-2,cash:-3},log:"你请老张喝了顿酒。酒过三巡，他说：你跟前几个领导不一样，我陪你干一把。",to:1}]},{t:"二 · 出错的那天",body:"第十二天，发现一份关键档案缺失。追下来是小姑娘弄混了两箱编号。老张说：我早就说别用新方法。距离交账还有两天。",opts:[{t:"自己担下来，一起重查",d:"责任我来负",e:{"道德":6,"人脉":6,"健康":-6},log:"你在汇报时说是我定的方案有问题。那两天三个人翻遍了整间档案室，最后一夜找到了。",to:2},{t:"就事论事，让她重做",d:"是谁的就是谁的",e:{"能力":4,"法治":3,"人脉":-3},log:"你把责任分清楚了，让她把两箱重新核。她红着眼做完了，此后半年没主动说过话。",to:2},{t:"如实上报，请求延期",d:"按程序来",e:{"法治":5,"上司好感":-3,"道德":3},log:"你如实上报了情况，请求延期三天。领导没批，但也记住了你没有瞒。",to:2}]},{t:"三 · 交账",body:"档案按时交了，比要求的还多清出两百余卷。总结会上领导点了你的名。散会后老张递给你一支烟，说：下次还跟你干。",opts:[{t:"把两个人的名字都报上去",d:"功劳是大家的",e:{"人脉":8,"道德":5,"政绩":-2},log:"你在总结材料里把两个人的名字都写在了前面。老张后来跟别人说：这人能处。",to:-1,end:"两个兵的名字都写在了材料前面。此后很多年，你走到哪儿，总有人愿意跟着你。<b>「第一次担纲」</b>——你第一次明白，带人是把人放在前面。"},{t:"只汇报结果，不提人",d:"本分而已",e:{"政绩":5,"能力":3,"人脉":-2},log:"你汇报了完成情况，没有提谁干的。会后老张什么也没说。",to:-1,end:"任务完成了，功劳记在了你名下。老张从此不再多说一句话。<b>「第一次担纲」</b>——你学会了带队伍，也学会了什么叫不值。"},{t:"借机立规矩",d:"把方法固定下来",e:{"能力":7,"法治":5,"政绩":4},log:"你把这次的编号方法写成了操作规程，在全单位推广。三年后还在用。",to:-1,end:"你写的操作规程，三年后这个单位还在用。<b>「第一次担纲」</b>——你不只做了一件事，还留下了做事的方法。"}]}]},{id:"r_one_shoulder",name:"一肩挑",emoji:"🏔️",cat:null,minRank:8,maxRank:10,brief:"书记镇长一肩挑，所有事最后都到你这儿。",chapters:[{t:"一 · 第一个会",body:"书记镇长一肩挑的第一天，你主持班子会。十二个人的会，开了四个小时，议题从修路一直扯到某个干部的职称。散会后，办公室主任悄悄说：以前不是这样开的。",opts:[{t:"立规矩：议题预审、限时发言",d:"先立规矩",e:{"能力":6,"法治":5,"人脉":-3},log:"你定了三条规矩：议题提前报、发言限时、议而必决。第一次会有人不适应，第三次会就快了。",to:1},{t:"先逐个谈话，摸清人心",d:"先摸情况",e:{"人脉":7,"能力":3,"上司好感":3},log:"你用了两周跟十一个人逐个谈了一遍。谁想干事、谁在混、谁跟谁不对付，你心里有了数。",to:1},{t:"先干一件看得见的事",d:"用结果说话",e:{"政绩":6,"民生":4,"健康":-4},log:"你把搁了两年的镇区路灯修好了。灯亮那晚，有人在镇政府门口放了挂鞭炮。",to:1}]},{t:"二 · 发不出工资的那个月",body:"年中，上级配套资金没到位，镇里两个月的绩效发不出来。二十几号干部在食堂里议论。有人已经把话传到了县里：新来的镇长镇不住。",opts:[{t:"先垫上，再向上要",d:"自己先扛",e:{cash:-20,"人脉":8,"财政":-5},log:"你先从镇里能动的钱里挤出来发了。第二天就跑去县里要钱，在财政局门口等了三个小时。",to:2},{t:"开诚布公，把账摊开",d:"跟大家说实话",e:{"道德":6,"上司好感":4,"人脉":3,"政绩":-2},log:"你在会上把账全部摊开，说明什么时候能补上。有人当场说：镇长，我们信你。",to:2},{t:"压一压，等资金到位",d:"拖一拖",e:{"人脉":-6,"政绩":-3,"信访":6},log:"你让大家再等等。等了两个月，钱到位了，人心散了。",to:2}]},{t:"三 · 年底考核",body:"年底考核，你们镇从全县倒数第三进到了中游。总结会上，县领导说了一句：这个镇有点变化。散会后你站在院子中央，看着新装的路灯。",opts:[{t:"把没干完的事写进下一年的账",d:"接续干",e:{"政绩":8,"能力":5,"道德":3},log:"你在总结里只写了三件事，都是没干完的。第二年这三件事都干成了。",to:-1,end:"你在总结里只写没干完的三件事，第二年一件件干成了。<b>「一肩挑」</b>——你学会了把一肩的担子，分成年份来挑。"},{t:"把成绩讲足",d:"该争的要争",e:{"政绩":8,"上司好感":6,"道德":-3},log:"你在会上把每项成绩都讲透了，也讲了困难。县里给你们多拨了一笔。",to:-1,end:"你把成绩讲足，也把困难讲透，县里多拨了一笔钱。<b>「一肩挑」</b>——你懂得了成绩也要有人替它说话。"},{t:"推荐几个年轻人上去",d:"把人送出去",e:{"人脉":9,"道德":5,"政绩":-3},log:"你把镇上三个能干的年轻人推荐到了县里。他们走的那天，你在食堂加了几个菜。",to:-1,end:"你送出去的三个年轻人，十年后有两个到了市里。<b>「一肩挑」</b>——你挑起了一个镇，也托起了一批人。"}]}]},{id:"r_ninth_seat",name:"班子里的第九位",emoji:"🪑",cat:null,minRank:11,maxRank:16,brief:"班子八个人，你是第九个，也是最年轻的。",chapters:[{t:"一 · 座次",body:"第一次参加常委会，你坐在长桌最末端。八个人，你是第九个，也是最年轻的。议题依次过，轮到你分管的领域时，你说得很快，也说得很满。会后一位老常委拍拍你：年轻人，会上不用急。",opts:[{t:"少说，先听三个月",d:"先学会听",e:{"能力":6,"上司好感":5,"人脉":3},log:"此后三个月你几乎没有在会上主动发言，只在本子上记。三个月后，你摸清了每个人的立场。",to:1},{t:"该说的还是要说",d:"有观点才有人记得",e:{"政绩":4,"能力":3,"上司好感":-2},log:"你继续每会必发言。有人说你冲，也有人开始引用你的话。",to:1},{t:"私下逐个拜访",d:"一个一个走",e:{"人脉":8,"上司好感":4,"健康":-4},log:"你用两个月把八位常委的门都走了一遍。没谈工作，只聊各自分管的事。",to:1}]},{t:"二 · 一票",body:"半年后，一个争议议题上会：要不要上一个投资八个亿的项目。书记倾向上，两位常委反对，还有人看你的表态。你知道这个项目的数据有问题，但它是书记牵头引进的。",opts:[{t:"把数据问题摆出来",d:"就事论事",e:{"法治":6,"道德":6,"上司好感":-8,"能力":5},log:"你在会上把三组数据的矛盾之处说了出来。会场很静。最终项目暂缓，书记没再说什么。",to:2},{t:"支持，但留个书面意见",d:"服从，也自保",e:{"上司好感":6,"法治":4,"道德":-3},log:"你投了赞成票，但另附了一份书面意见存档。一年后项目果然出了问题，那份意见救了你。",to:2},{t:"弃权",d:"不表态",e:{"上司好感":-4,"人脉":-4,"道德":-2},log:"你选择了弃权。会后两边都不满意，你第一次体会到什么叫里外不是人。",to:2}]},{t:"三 · 分工调整",body:"一年后分工调整，你从最边缘的领域被调去分管一块硬骨头。有人说你运气好，有人说这是明升暗降。你知道，是因为那次会上你说过的话。",opts:[{t:"接下，先把情况摸透",d:"硬骨头也要啃",e:{"政绩":8,"能力":6,"健康":-5},log:"你接了，用三个月跑遍了下属二十三个单位。一年后，这块硬骨头成了你的招牌。",to:-1,end:"那块硬骨头一年后被你啃了下来，成了你往上走的台阶。<b>「班子里的第九位」</b>——你用一年时间，从末端走到了中间。"},{t:"争取一个更容易出成绩的口子",d:"挑好干的",e:{"政绩":6,"上司好感":-3,"道德":-2},log:"你私下争取了一个更容易出彩的分工。出彩了，但有人说你精。",to:-1,end:"你挑了容易出成绩的口子，也确实出彩了。只是班子会上，再没人认真听你的意见。<b>「班子里的第九位」</b>——你赢了位置，输了分量。"},{t:"跟着一位老常委学",d:"拜个师父",e:{"人脉":9,"能力":5,"上司好感":5},log:"你主动靠向一位口碑好的老常委，跟着他跑了两年。他退休那年说：你可以了。",to:-1,end:"那位老常委退休时说了一句：你可以了。此后你再没坐过末位。<b>「班子里的第九位」</b>——你找到了一个愿意带你的人。"}]}]},{id:"r_enter_stand",name:"入常",emoji:"🏛️",cat:null,minRank:22,maxRank:29,brief:"进不进得了那个会议室，是两种人生。",chapters:[{t:"一 · 风声",body:"市里要补一位常委，你进了考察范围。这周你见了四拨人：有人来道贺，有人来交底，还有人来提醒你某位领导对你有看法。妻子说你这几天睡得不踏实。你说没有。",opts:[{t:"谁也不见，把工作干好",d:"不跑不要",e:{"道德":6,"政绩":5,"上司好感":-2},log:"你谢绝了所有走动，一头扎进分管工作。考察组来时，你汇报的全是工作。",to:1},{t:"该走动还是要走动",d:"人情世故",e:{"人脉":7,"上司好感":6,"道德":-5,"灰产":8},log:"你挑了两个关键的人走了一遍。话说得很含蓄，但都听懂了。",to:1},{t:"找主要领导当面汇报思想",d:"把话说到位",e:{"上司好感":9,"能力":3,"道德":2},log:"你约了书记，汇报了自己对全市工作的一些想法，没提半句自己的事。出来时他送你到门口。",to:1}]},{t:"二 · 考察谈话",body:"考察组谈话的第七个人出来后，你从侧面听到了一句评价：能力强，但有时不太注意方法。你想起三年前那次会上，你当众否了一个老同志的方案。",opts:[{t:"找那位老同志道歉",d:"把旧账了了",e:{"道德":6,"人脉":8,"上司好感":4},log:"你约那位老同志吃了顿饭，为三年前的事道了歉。他愣了一下，然后说：都过去了。",to:2},{t:"在后续工作中刻意注意方法",d:"用行动改评价",e:{"能力":6,"人脉":5,"政绩":4},log:"此后三个月，你在每一次分歧上都先听后说。有人说你变了。",to:2},{t:"不管它，本来就是性格",d:"做自己",e:{"能力":3,"道德":2,"上司好感":-4},log:"你没改。考察组的报告里，那句话还是留下了。",to:2}]},{t:"三 · 文件下来",body:"文件下来的那天你在基层调研。办公室主任打电话来，只说了三个字：成了。你站在田埂上，看着远处的水渠，很久没说话。",opts:[{t:"上任先跑一圈基层",d:"先摸底",e:{"政绩":6,"民生":5,"能力":5,"健康":-5},log:"上任第一个月，你跑遍了全市所有的乡镇。笔记本记满了两本，也记住了几十张脸。",to:-1,end:"上任第一个月你跑遍了所有乡镇，此后五年每一项决策都踩得住地。<b>「入常」</b>——你进了那间会议室，先去了地头。"},{t:"先把分管的口子理顺",d:"先安内",e:{"能力":7,"政绩":6,"上司好感":5},log:"你用两个月把分管系统的班子逐个谈了一遍，换了三个人，也起用了三个人。",to:-1,end:"你把分口的班子理顺了，此后三年这一块年年有亮点。<b>「入常」</b>——你先把自己的一亩三分地种好了。"},{t:"记住这次，也记住帮过你的人",d:"人情要还",e:{"人脉":8,"上司好感":6,"攀附":4},log:"你把这次帮过你的人一个个记在了心里。此后几年，你也都还了。",to:-1,end:"你把帮过你的人一个个记住，也一个个还了。<b>「入常」</b>——你进了一间会议室，也进了一张网。"}]}]},{id:"r_frontier",name:"封疆",emoji:"🗺️",cat:null,minRank:30,maxRank:41,brief:"一方水土，几千万人，都在你手上。",chapters:[{t:"一 · 交接",body:"前任临走前只跟你说了两句话：第一，这里的账比看上去难；第二，有些事急不得。你上任第一周，财政局长把一本厚厚的表报放在你桌上，没说话就出去了。你翻到最后一页，数字不太好看。",opts:[{t:"先花两个月摸清全部底数",d:"知己知彼",e:{"能力":8,"政绩":-4,"健康":-5},log:"你用两个月把债务、存量、欠账全部核了一遍。最后你一个人去看了那条修了一半的路。",to:1},{t:"先干三件看得见的事",d:"先声夺人",e:{"政绩":8,"上司好感":4,"债务":8},log:"你上任百日内推了三个项目，开工那天省市媒体都来了。热闹过后，钱的问题还在。",to:1},{t:"先找几个老同志聊",d:"听听老人言",e:{"人脉":7,"能力":4,"道德":3},log:"你拜访了五位退下来的老同志。他们讲了很多，也讲了很多没写在材料上的。",to:1}]},{t:"二 · 取舍",body:"第二年，你必须做出选择：是保一条修了一半的高速，还是保几十所乡村学校的危房改造。财政只够一个。班子上争论了三次，最后都看着你。",opts:[{t:"保学校",d:"先保人",e:{"民生":12,"道德":8,GDP:-6,"上司好感":-3},log:"你压下了高速，把钱投进了学校。当年 GDP 掉了零点几个点，但第二年没有一个孩子在有裂缝的教室里上课。",to:2},{t:"保高速",d:"先保发展",e:{GDP:8,"政绩":8,"民生":-6,"信访":8},log:"高速通了，物流成本降了，三年后这片区域的产业起来了。危房改造推到了下一任。",to:2},{t:"各压一半，分年实施",d:"两难之中找第三条路",e:{"能力":7,"财政":-4,"债务":6,"政绩":3},log:"你把两个都砍了一半，分三年做完。两边都不满意，但两边都还在推进。",to:2}]},{t:"三 · 离任那天",body:"离任那天，班子送你到楼下。有人提到当年那条高速，有人提到那几十所学校。你上车前回头看了一眼办公楼，楼还是那栋楼，楼前的树高了不少。",opts:[{t:"留下一份交接清单",d:"账要交清楚",e:{"能力":6,"法治":5,"道德":5},log:"你留下了一份三十页的交接清单，写清楚了哪些干完了、哪些没干完、哪些还有坑。后任打来电话说了句谢谢。",to:-1,end:"那份三十页的交接清单，后任一直留着。<b>「封疆」</b>——你走的时候，把账交清楚了。"},{t:"只带走该带走的",d:"不多不少",e:{"道德":4,"政绩":4},log:"你交了钥匙，带走了一个纸箱。此后这里的事与你无关。",to:-1,end:"你带走了一个纸箱，留下了一栋楼。<b>「封疆」</b>——你来过，也走得体面。"},{t:"把没做完的事托付下去",d:"有人接着干",e:{"人脉":7,"道德":5,"政绩":4},log:"离任前你把三件没做完的事，一件件托付给了具体的人。三年后，三件都成了。",to:-1,end:"你托付的三件事，三年后都成了。<b>「封疆」</b>——你走了，事还在接着走。"}]}]},{id:"r_entrust",name:"托付",emoji:"🌅",cat:null,minRank:47,maxRank:51,brief:"到了这个位置，想的已经不是自己了。",chapters:[{t:"一 · 一份名单",body:"桌上有两份东西：一份是下一批重要岗位的拟任人选，另一份是你推动多年的一项改革的阻力清单。两份东西上都有一些名字，有些名字是重合的。秘书进来添了次茶，又轻轻出去了。",opts:[{t:"先定人",d:"事在人为",e:{"能力":6,"人脉":5,"政绩":5},log:"你先把人定下来，用了三个能扛事的人。改革因此有了执行的班底。",to:1},{t:"先定事",d:"制度比人长久",e:{"法治":7,"能力":5,"政绩":4},log:"你先把改革的制度框架定了下来，把个人因素压到最低。人换了，事还能走。",to:1},{t:"先听一听不同意见",d:"再听一次",e:{"道德":5,"能力":6,"上司好感":3},log:"你把两份东西都发给了三位老同志征求意见。反馈回来的意见，你看了整整一夜。",to:1}]},{t:"二 · 有人来求情",body:"阻力清单上有一个名字，是你在基层时一起扛过洪水的老同事。他的儿子牵涉其中。他没来电话，只是托人带了一句话：孩子还年轻。",opts:[{t:"照规矩办",d:"规矩就是规矩",e:{"廉政":10,"法治":8,"道德":6,"人脉":-10,"血仇":8},log:"你什么也没做，按程序走。老同事此后再没联系过你。多年后你在一份名单上看到他儿子的名字，已是另一番模样。",to:2},{t:"在法律允许范围内从轻",d:"留一线",e:{"廉政":-10,"道德":-8,"暴露":8,"人脉":6},log:"你在权限内递了一句话，事情从轻了。老同事送来一盒茶，你把茶退了回去。",to:2},{t:"回避，交给别人办",d:"交给制度",e:{"廉政":6,"法治":6,"能力":3},log:"你按规定作了回避申报，把这件事交了出去。有人赞你懂规矩，也有人说你不敢担。",to:2}]},{t:"三 · 交出去的那天",body:"交接那天天气很好。你把办公室的钥匙交出去，桌上什么都没留下，只有一个用了十几年的旧茶杯。走廊尽头，新来的人正在等你。",opts:[{t:"只说一句：按制度办",d:"不留话",e:{"法治":8,"道德":6,"政绩":5},log:"你只留了一句话：一切都按制度办。此后很多年，这句话被反复提起。",to:-1,end:"你只留下一句“按制度办”。多年后这句话被反复引用。<b>「托付」</b>——你交出去的是位置，留下的是规矩。"},{t:"把三件要做的事写下来",d:"留下方向",e:{"能力":8,"政绩":8,"道德":4},log:"你留下了三页纸，写着三件必须做完的事。十年后，三件都成了。",to:-1,end:"你留下的三页纸，十年后变成了现实。<b>「托付」</b>——你把方向留给了后来的人。"},{t:"什么也不留",d:"功过自有评说",e:{"道德":5,"廉政":5,"政绩":3},log:"你什么都没留下，只带走了那个旧茶杯。功过自有后人评说。",to:-1,end:"你什么也没留下，只带走了那个旧茶杯。<b>「托付」</b>——你来了，做了，走了。"}]}]}];function ALL_STORIES(){const e=Array.isArray(STORY_DEFS)?STORY_DEFS:[],n=Array.isArray(STORY_DEFS_2)?STORY_DEFS_2:[];return e.concat(n)}function storyState(){if(!S)return null;S.故事&&"object"==typeof S.故事||(S.故事={});const e=S.故事;return e.已解锁&&"object"==typeof e.已解锁||(e.已解锁={}),e.已完成&&"object"==typeof e.已完成||(e.已完成={}),e.提示过&&"object"==typeof e.提示过||(e.提示过={}),void 0===e.进行中&&(e.进行中=null),e}function storyById(e){return ALL_STORIES().filter(n=>n.id===e)[0]||null}function storyMatches(e){return!(!S||!e)&&(e.cat?"function"==typeof postCategory&&postCategory()===e.cat:!("number"==typeof e.minRank&&S.rank<e.minRank)&&!("number"==typeof e.maxRank&&S.rank>e.maxRank))}function storyUnlockCheck(e){const n=storyState();if(!n)return;let t=null;if(ALL_STORIES().forEach(e=>{n.已解锁[e.id]||storyMatches(e)&&(n.已解锁[e.id]=!0,t||(t=e))}),e&&t&&!n.提示过[t.id]){n.提示过[t.id]=!0;try{"funct
