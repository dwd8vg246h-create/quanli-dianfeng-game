<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>权利的巅峰</title>
<style>
  :root{
    --red:#b01e23; --dark-red:#7a1418; --gold:#c9a96a; --ink:#222;
    --paper:#f4f0e6; --paper2:#ebe5d6; --line:#c8bfa8; --green:#2f7d4f;
    --shadow:0 2px 12px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    background:#2c2c2c; color:var(--ink);
    max-width:480px; margin:0 auto; min-height:100vh;
    background:#3a3a3a;
  }
  #app{
    background:var(--paper); min-height:100vh; position:relative;
    overflow-x:hidden;
  }
  /* 顶部状态栏 */
  #topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#8a1a1e,#b01e23);
    color:#fff; padding:8px 12px; box-shadow:var(--shadow);
  }
  .tb-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .tb-title{font-size:15px; font-weight:700; letter-spacing:1px;}
  .tb-sub{font-size:11px; opacity:.85; margin-top:2px;}
  .attrs{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .attr{background:rgba(255,255,255,.16); border-radius:4px; padding:2px 6px; font-size:10px;}
  .attr b{color:var(--gold);}
  .bar-wrap{height:4px; background:rgba(255,255,255,.25); border-radius:2px; margin-top:3px; width:40px; display:inline-block; vertical-align:middle;}
  .bar{height:100%; background:var(--gold); border-radius:2px;}

  /* 主体区域 */
  #main{padding:12px; padding-bottom:80px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
  }
  .card-h{
    background:var(--paper2); border-bottom:1px solid var(--line);
    padding:8px 12px; font-weight:700; font-size:13px; color:var(--dark-red);
  }
  .card-b{padding:12px; font-size:13px; line-height:1.7;}
  .muted{color:#7a7364; font-size:12px;}
  .tag{display:inline-block; background:var(--red); color:#fff; font-size:10px; padding:1px 6px; border-radius:3px; margin-right:4px;}

  /* 指标条 */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .stat{background:var(--paper2); border-radius:5px; padding:6px 8px; font-size:11px;}
  .stat .n{font-weight:700; font-size:13px;}
  .stat .lbl{color:#6b6354;}

  /* 按钮 */
  .btn{
    display:block; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-left:4px solid var(--red);
    border-radius:5px; padding:10px 12px; margin:8px 0 0; font-size:13px;
    cursor:pointer; transition:.15s; line-height:1.5;
  }
  .btn:active{background:var(--paper2); transform:scale(.99);}
  .btn .bt{font-weight:700; color:var(--dark-red);}
  .btn .bd{font-size:11px; color:#7a7364; margin-top:2px;}
  .btn.primary{background:var(--red); color:#fff; border-color:var(--red);}
  .btn.primary .bt,.btn.primary .bd{color:#fff;}

  /* 底部导航 */
  #nav{
    position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    background:#fff; border-top:1px solid var(--line); display:flex; z-index:50;
  }
  #nav .tab{flex:1; text-align:center; padding:8px 0; font-size:10px; color:#7a7364; cursor:pointer;}
  #nav .tab.active{color:var(--red); font-weight:700;}
  #nav .tab .ic{font-size:18px; display:block;}

  /* 弹窗 */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:none; align-items:center; justify-content:center; padding:20px;}
  .modal.show{display:flex;}
  .modal-box{background:var(--paper); border-radius:10px; max-width:420px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 8px 30px rgba(0,0,0,.4);}
  .modal-h{background:var(--red); color:#fff; padding:12px; font-weight:700; text-align:center; font-size:15px;}
  .modal-b{padding:16px;}

  /* 闪屏提示 */
  #toast{position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:200; display:none;}
  .toast-item{background:rgba(0,0,0,.82); color:#fff; font-size:12px; padding:8px 14px; border-radius:20px; margin-top:6px; white-space:nowrap;}

  .scene-title{font-size:16px; font-weight:700; color:var(--dark-red); border-left:4px solid var(--gold); padding-left:10px; margin:4px 0 10px;}
  .event-text{font-size:13px; line-height:1.8; text-indent:2em; margin-bottom:6px;}
  .result-box{background:#faf6ec; border:1px dashed var(--gold); border-radius:6px; padding:10px; margin-top:10px; font-size:12px; line-height:1.7;}
  .result-box b{color:var(--red);}

  .mini{font-size:11px; color:#6b6354;}
  .center{text-align:center;}
  .hidden{display:none !important;}

  /* 开始/结束页 */
  .cover{padding:40px 20px; text-align:center;}
  .cover h1{font-size:28px; color:var(--red); letter-spacing:3px; margin:0;}
  .cover .sub{color:#7a7364; font-size:13px; margin-top:8px;}
  .cover .seal{width:90px; height:90px; border:3px solid var(--red); border-radius:8px; color:var(--red); font-size:40px; line-height:84px; margin:24px auto; font-weight:700;}
</style>
</head>

/* 级联：根据所选省份刷新城市下拉 */
function updateCities(){
  const pvEl=$("ci_province"), ctEl=$("ci_city");
  if(!pvEl||!ctEl) return;
  const cities=PROVINCE_CITY[pvEl.value]||[];
  ctEl.innerHTML=cities.map(c=>`<option>${c}</option>`).join("");
}
/* 籍贯全称：省 + 市（直辖市/特别行政区只显示一次） */
function hometownFull(prov, city){
  if(!prov) return "";
  if(!city || prov===city) return prov;
  if(prov==="北京市"||prov==="天津市"||prov==="上海市"||prov==="重庆市"||
     prov.indexOf("特别行政区")>=0) return prov;
  return prov + " " + city;
}

/* ---- 存储层：兼容 file:// 离线打开（localStorage 可能被浏览器禁用） ---- */
const MEM = {};             // 内存兜底：localStorage 不可用时暂存进度
let storageOK = true;       // localStorage 是否可用
try {
  const probe = "__qlp_probe__";
  localStorage.setItem(probe, "1");
  localStorage.removeItem(probe);
} catch(e) {
  storageOK = false;        // Safari/某些浏览器 file:// 下会禁用
}

function _rawSet(k, v){
  if(storageOK){ try{ localStorage.setItem(k, v); return true; }catch(e){ storageOK=false; } }
  MEM[k] = v;               // 降级到内存（本次会话仍可存档/续玩）
  return false;
}
function _rawGet(k){
  if(storageOK){ try{ const v = localStorage.getItem(k); if(v!==null) return v; }catch(e){ storageOK=false; } }
  return MEM[k] || null;
}
function _rawDel(k){
  if(storageOK){ try{ localStorage.removeItem(k); }catch(e){ storageOK=false; } }
  delete MEM[k];
}

function save(){ _rawSet("qlp_top", JSON.stringify(S)); }
function load(){
  const t = _rawGet("qlp_top");
  if(t){ try{ S = JSON.parse(t); }catch(e){ _rawDel("qlp_top"); } }
}
function hasSave(){ return !!_rawGet("qlp_top"); }
function clearSave(){ _rawDel("qlp_top"); }

/* 统一收敛所有数值指标到合理区间（部委技能等大额增减后调用） */
function clampAll(){
  if(!S) return;
  const range = {
    能力:[0,999], 政绩:[0,99999], 政绩点:[0,9999],
    道德:[0,100], 健康:[0,100], 人脉:[0,100], 上司好感:[0,100],
    财政:[0,100], GDP:[0,100], 民生:[0,100], 生态:[0,100],
    营商:[0,100], 治安:[0,100], 廉政积分:[0,999], 法治:[0,100],
    国际声望:[0,100], 科创:[0,100], 金融风险:[0,100], 科技长期:[0,99],
    partyRep:[0,100], neutralRep:[0,100], reformRep:[0,100],
  };
  Object.keys(range).forEach(k=>{
    if(typeof S[k]==='number'){ S[k]=clamp(Math.round(S[k]), range[k][0], range[k][1]); }
  });
  if(S.cash<0) S.cash=0;
}

function addToast(msg){
  const box=$("toast"); box.style.display="block";
  const el=document.createElement("div"); el.className="toast-item"; el.textContent=msg;
  box.appendChild(el);
  setTimeout(()=>{el.remove(); if(!box.children.length)box.style.display="none";},1800);
}

/* 每月结算 */
function monthlySettlement(){
  const r=S.rank>=6?0.6:1; // 前期事件密集
  // 自然衰减/增长
  // 轮岗适应期：政绩产出下降50%（政绩真空期）
  const adapt = (S.rotation && S.rotation.adaptation>0) ? 0.5 : 1;
  S.政绩 += Math.round((S.GDP*0.3 + S.民生*0.3 + S.营商*0.2 + S.生态*0.1 + S.治安*0.1)*r*0.15*adapt);
  // 适应期倒计时
  if(S.rotation && S.rotation.adaptation>0){
    S.rotation.adaptation--;
    if(S.rotation.adaptation===0){
      pushLog("✅ 轮岗适应期结束：你已完全熟悉新部门业务，政绩产出恢复正常。");
      addToast("📈 适应期结束，政绩产出恢复");
    }
  }
  // Buff：懂基层的部委大员（政策接地气，不易引发群体性事件）
  if(hasBuff('grassroots_insight')){
    S.民生 = clamp(S.民生 + 0.5, 0, 100);
    S.治安 = clamp(S.治安 + 0.5, 0, 100);
  }
  S.健康 = clamp(S.健康 - (S.rank>=12?0:1) - (S.健康>90?0:0), 0, 100);
  // 指标缓慢回归
  const drift=(cur,target)=> cur + (target-cur)*0.03;
  S.生态=clamp(drift(S.生态,65),0,100);
  S.治安=clamp(drift(S.治安,60),0,100);
  // 部委专属技能冷却递减
  if(S.deptCd){ Object.keys(S.deptCd).forEach(k=>{ if(S.deptCd[k]>0) S.deptCd[k]--; }); }
  S.month++;
  if(S.month>12){
    S.month=1; S.year++;
    const gain = Math.floor(S.政绩/100);
    S.政绩点 += hasBuff('multi_post') ? Math.ceil(gain*1.2) : gain;  // 复合型干部+20%
  }
  // ==== 选调生墩苗计时 ====
  if(S.mode==='selective' && S.dunmiao && !S.returned){
    S.dunmiaoMonths = (S.dunmiaoMonths||0) + 1;
    if(S.dunmiaoMonths >= 24){
      // 墩苗期满：100%回流部委 + 火箭晋升
      S.dunmiao = false; S.returned = true;
      promoteBy(2); // 回流破格晋升（模拟"火箭晋升"）
      S.政绩 += 50; S.上司好感 += 30; S.人脉 += 20;
      pushLog("🎖️ 墩苗2年考核优秀，100%调回中央部委定岗，进入『火箭式』轮岗培养（职级跃升）。");
      addToast("🔥 回流部委 · 火箭晋升");
      // 回流后分配具体部委
      setTimeout(()=>{ openDeptChoice(); }, 400);
    }
  }
  // 健康检查
  if(S.健康<=0){ endGame("积劳成疾"); return; }
  if(S.道德<=0){ endGame("身陷囹圄"); return; }
  save();
}

/* 检查晋升 */
/* 晋升条件明细（供 UI 展示与判定共用） */
function promotionStatus(){
  const need=RANKS[S.rank+1];
  if(!need) return null;
  const months=S.month + (S.year-2026)*12;
  const routeBonus = S.route==='youth'? 0.85 : 1;
  const needMonths = Math.round(need[3] * routeBonus);
  const 廉政达标 = S.route==='discipline' && (S.廉政积分||0)>=30;
  return {
    need, months, needMonths,
    政绩OK: S.政绩>=need[2],
    年限OK: months>=needMonths,
    道德OK: S.道德>=30,
    上司OK: (S.上司好感>=40) || 廉政达标,
    廉政达标,
    nextTitle: rankTitle(Math.min(S.rank+1, RANKS.length-1)),
    nextLayer: rankLayer(Math.min(S.rank+1, RANKS.length-1)),
  };
}

function checkPromotion(){
  const need=RANKS[S.rank+1];
  if(!need) return;
  const req政绩 = need[2], req年限 = need[3];
  const months=S.month + (S.year-2026)*12;
  const routeBonus = S.route==='youth'? 0.85 : 1;
  const needMonths = Math.round(req年限 * routeBonus);
  const cond1=S.政绩>=req政绩, cond2=months>=needMonths, cond3=S.道德>=30, cond4=S.上司好感>=40;
  // 纪检政法路线：廉政积分达标可突破"上司好感"门槛（反腐干部口碑加成）
  const routeCond = S.route==='discipline' ? (S.廉政积分>=30 || S.上司好感>=40) : true;
  const finalCond4 = S.route==='discipline' ? (S.上司好感>=40 || S.廉政积分>=30) : cond4;
  if(cond1&&cond2&&cond3&&finalCond4){
    if(S.rank===7 && !S.route){
      // 选调生 / 基层扎根模式：不强制在县委常委节点选传统四路线，各自有专属路径
      if(S.mode==='selective' || S.mode==='grassroots'){
        S.route = (S.mode==='selective') ? 'admin' : 'party'; // 给一个默认归属，不影响玩法
        pushLog(`（${MODES[S.mode].name}）你在关键节点延续了专属培养路径，未走传统路线分支。`);
      } else {
        openRouteChoice(); return;
      }
    }
    // 纪检路线：晋升时消耗廉政积分转化为政绩点奖励
    if(S.route==='discipline' && S.廉政积分>0){
      const bonus=Math.min(S.廉政积分, 20);
      S.政绩点+=Math.floor(bonus/5);
      pushLog(`凭借扎实的廉政口碑，你的晋升考核获得额外认可（廉政积分+${Math.floor(bonus/5)}政绩点）。`);
      S.廉政积分-=bonus;
    }
    doPromote();
  }
}
function doPromote(){
  S.rank++;
  const ttl=rankTitle(S.rank), lyr=rankLayer(S.rank), grd=rankGrade(S.rank);
  addToast("🎉 晋升："+ttl);
  pushLog(`晋升为【${ttl}】（${lyr}${grd&&grd!=="—"?" · "+grd:""}）`);
  // 晋升奖励
  S.能力+=5; S.政绩点+=3; S.上司好感+=10; S.cash+=60;
  // 到达顶层？
  if(S.rank>=RANKS.length-1){ endGame("大国领袖"); return; }
  save();
  // ==== 跨部委轮岗触发（副处级/正处级）====
  if(S.dept && ROTATION_RANKS.includes(S.rank)){
    S.rotation = S.rotation || {};
    S.rotation.triggeredRanks = S.rotation.triggeredRanks || [];
    if(!S.rotation.triggeredRanks.includes(S.rank)){
      S.rotation.triggeredRanks.push(S.rank);
      save();
      setTimeout(()=>{ openRotationChoice(); }, 600);
    }
  }
}

  // 部委专属危机事件：仅当玩家已归属该部委时才进入池子
  const myDept = (S && S.dept) ? S.dept : null;
  let pool=EVENTS.filter(e=>!recentEventIds.includes(e.id))
                 .filter(e=> !e.dept || e.dept===myDept)
                 .filter(e=> !e.cond || (S && e.cond(S)))   // 前置条件（如长期主义回报）
                 .map(e=>({e,w:1}));
  if(pool.length < EVENTS.length/2) recentEventIds=[]; // 池太小时重置近期列表
  if(!pool.length){ recentEventIds=[]; pool=EVENTS.map(e=>({e,w:1})); } // 兜底：池空则全量重开
  // 路线 / 开局模式偏好加权
  if(S && S.route){
    pool.forEach(item=>{
      const e=item.e; let w=item.w;
      if(S.route==='discipline' && e.route==='discipline') w=4.5;
      else if(S.route==='party' && e.id==='promotion_eval') w=3;
      else if(S.route==='admin' && (e.id==='invest'||e.id==='economic_pressure')) w=3;
      else if(S.route==='youth' && (e.id==='school'||e.id==='promotion_eval')) w=2.5;
      if(S.rank>=12 && (e.id==='economic_pressure'||e.id==='national_plan'||e.id==='corruption_case')) w=2.5;
      if(S.mode==='selective'){
        if(e.route==='selective') w=(e.weight||3)*2;
        if(S.dunmiao && e.id==='sel_dunmiao') w=8;
        if(!S.dunmiao && S.returned && (e.id==='sel_plan_draft'||e.id==='sel_crosspost')) w=6;
      }
      if(S.mode==='grassroots'){
        if(e.route==='grassroots') w=(e.weight||3)*2;
        if(e.id==='invest'||e.id==='economic_pressure') w*=0.4;
      }
      // ---- 所属部委：专属危机事件加权（回流部委后生效） ----
      if(S.dept && e.dept===S.dept){
        w = Math.max(w, 7);
        // 跨部门协作与博弈：中期核心挑战，副处级以上大幅加权
        if(e.id && e.id.indexOf('clash_')===0 && S.rank>=5) w = Math.max(w, 10);
      }
      item.w=w;
    });
  }
  // 加权随机选取
  const total=pool.reduce((a,b)=>a+b.w,0);
  let r=Math.random()*total, chosen=null;
  for(const item of pool){ r-=item.w; if(r<=1e-9){ chosen=item.e; break; } }
  if(!chosen) chosen=pool[pool.length-1].e; // 浮点精度兜底
  recentEventIds.push(chosen.id);
  if(recentEventIds.length>recencyWindow) recentEventIds.shift();
  return chosen;
}

/* ---------- 7. 交互绑定 ---------- */
function bindActions(){
  document.querySelectorAll('[data-act="choose"]').forEach(b=>{
    b.onclick=()=>{
      const eid=b.dataset.eid, idx=+b.dataset.idx;
      const e=EVENTS.find(x=>x.id===eid);
      const opt=e.opts[idx];
      const snap={道德:S.道德, 政绩:S.政绩, 政绩点:S.政绩点, 改革派:S.reformRep};
      const result=opt.fn(S);
      // 纪检政法路线：道德获取 +20%（持续机制，仅放大增益，不放大减损）
      if(S.route==='discipline'){
        const dGain=S.道德 - snap.道德;
        if(dGain>0){ S.道德 = Math.round(S.道德 + dGain*0.2); }
        // 反腐类抉择（改革派声望增长）也享受加成
        const rGain=S.reformRep - snap.改革派;
        if(rGain>0){ S.reformRep = Math.round(S.reformRep + rGain*0.15); }
        // 廉政积分：廉洁抉择积累，反腐抉择额外加成（专属机制）
        const eDef=EVENTS.find(x=>x.id===eid);
        if(dGain>0){ S.廉政积分 = (S.廉政积分||0) + Math.round(dGain*0.5); }
        if(eDef && eDef.route==='discipline'){ S.廉政积分 = (S.廉政积分||0) + 8; }
      }
      // 政绩点奖励
      S.政绩+=8; S.政绩点+=1;
      showResult(e,opt);
      save();
    };
  });
  // 部委专属技能
  document.querySelectorAll('[data-act="deptskill"]').forEach(b=>{
    b.onclick=()=>{
      const idx=+b.dataset.idx;
      const d=DEPARTMENTS[S.dept]; if(!d) return;
      const sk=d.skills[idx]; if(!sk) return;
      const cd=(S.deptCd && S.deptCd[sk.id])||0;
      if(cd>0){ addToast("技能冷却中，还需 "+cd+" 个月"); return; }
      sk.fn(S);
      S.deptCd = S.deptCd||{}; S.deptCd[sk.id] = sk.cd;
      pushLog(`部委施政【${d.short}·${sk.name}】：${sk.effect}`);
      addToast("⚡ 已施展：" + sk.name);
      clampAll();
      renderTopbar(); renderMain('action');
      checkPromotion();
    };
  });
  document.querySelectorAll('[data-act="do"]').forEach(b=>{
    b.onclick=()=>{
      const idx=+b.dataset.idx;
      const r=_acts[idx].fn(S);
      if(r===false) return;

      pushLog("日常行动："+_acts[idx].t.replace(/^.+? /,""));
      renderTopbar(); renderMain('action');
      checkPromotion();
    };
  });
  document.querySelectorAll('[data-act="next"]').forEach(b=>{
    b.onclick=()=>{ monthlySettlement(); renderTopbar(); renderMain('event'); addToast("进入下一个月"); };
  });
  document.querySelectorAll('[data-act="save"]').forEach(b=>{ b.onclick=()=>{save();addToast("进度已保存");};});
  document.querySelectorAll('[data-act="restart"]').forEach(b=>{
    b.onclick=()=>{ if(confirm("确定重新开始？当前进度将丢失。")){localStorage.removeItem("qlp_top");location.reload();} }
  });
}

function doRotate(newDept){
  const oldDept = S.dept;
  const oldD = DEPARTMENTS[oldDept], newD = DEPARTMENTS[newDept];
  // 1) 硬技能冻结（旧部委专业技能）
  S.rotation.hardFrozen = oldD ? oldD.skills.map(x=>x.id) : [];
  // 2) 软技能保留并升级
  const ss = S.rotation.softSkills || {writing:1,crisis:1,mediate:1};
  ss.writing=(ss.writing||1)+1; ss.crisis=(ss.crisis||1)+1; ss.mediate=(ss.mediate||1)+1;
  S.rotation.softSkills = ss;
  // 3) 切换部委：新专业技能进入"学习期"（初始冷却）
  S.dept = newDept;
  S.deptCd = {};
  newD.skills.forEach(sk=>{ S.deptCd[sk.id] = sk.cd; });
  // 4) 代价：人脉断层 + 政治点数
  S.人脉 = clamp((S.人脉||0) - 15, 0, 100);
  S.cash = Math.max(0, (S.cash||0) - 40);
  // 5) 政绩真空期（适应期12个月）
  S.rotation.adaptation = 12;
  S.rotation.count = (S.rotation.count||0) + 1;
  S.rotation.history = S.rotation.history || [];
  S.rotation.history.push(oldDept);
  // 6) 增益判定
  S.rotation.buffs = S.rotation.buffs || [];
  const gained = [];
  if(newDept==='mee' && (oldDept==='ndrc'||oldDept==='mof') && !S.rotation.buffs.includes('green_finance')){
    S.rotation.buffs.push('green_finance'); gained.push(ROTATION_BUFFS.green_finance.name);
  }
  if((S.mode==='grassroots' || (S.dunmiaoMonths||0)>0) && !S.rotation.buffs.includes('grassroots_insight')){
    S.rotation.buffs.push('grassroots_insight'); gained.push(ROTATION_BUFFS.grassroots_insight.name);
  }
  if(S.rotation.history.length>=2 && !S.rotation.buffs.includes('multi_post')){
    S.rotation.buffs.push('multi_post'); gained.push(ROTATION_BUFFS.multi_post.name);
  }
  // 7) 专属指标初始化
  if(S.国际声望===undefined) S.国际声望=50;
  if(S.科创===undefined) S.科创=50;
  if(S.金融风险===undefined) S.金融风险=30;

  pushLog(`🔄 跨部委轮岗：${oldD.short} → ${newD.short}。软技能（${SOFT_SKILLS.map(x=>x.name).join('/')}）100%保留并升级；原专业技能「${oldD.skills.map(x=>x.name).join('、')}」已冻结，新技能需重新学习（12个月适应期，政绩产出-50%）。`);
  if(gained.length){
    pushLog("✨ 轮岗增益：" + gained.join('、') + "。");
    addToast("✨ 获得增益：" + gained.join('、'));
  }
  clampAll();
  save(); renderTopbar(); renderMain(curTab);
  // 新部门的第一天：感受不同的办公室文化
  setTimeout(()=>{ openDeptFirstDay(); }, 500);
}

  // ---- 轮岗专属结局分支 ----
  if(S.rotation && S.rotation.count>=2){
    ending={t:"🔄 复合型栋梁",d:`你在${S.rotation.count}个中央部委历练过，兼具宏观视野与专业深度。这种复合型履历，正是新时代领导干部最稀缺的品质。`};
  }
  if(S.rotation && S.rotation.buffs && S.rotation.buffs.includes('multi_post') && S.rank>=12){
    ending={t:"🏛️ 跨部门统帅",d:"历经三个以上部委的淬炼，你既能看懂经济模型，也读得懂干部档案。站在全局高度统筹协调，这是单一部门出身的干部难以企及的境界。"};
  }
  $("modalTitle").textContent=ending.t;
  $("modalBody").innerHTML=`
    <div class="result-box" style="border-style:solid">${ending.d}</div>
    <div class="mini center" style="margin-top:12px">
      开局模式：<b>${MODES[S.mode||'normal'].name}</b><br>
      最终职务：<b>${rankTitle(S.rank)}</b>（${rankLayer(S.rank)}${rankGrade(S.rank)!=="—"?" · "+rankGrade(S.rank):""}）<br>
      政绩：${S.政绩} · 道德：${S.道德} · 健康：${S.健康}<br>
      任期：${S.year}年${S.month}月 · 路线：${S.route?ROUTES[S.route].name:"—"}
      ${S.mode==='selective'?`<br>墩苗：${S.dunmiaoMonths||0}个月 · 已${S.returned?'回流部委':'在基层'}`:""}
      ${S.dept?`<br>所属部委：<b>${DEPARTMENTS[S.dept].name}</b>（${DEPARTMENTS[S.dept].school}）`:""}
      <br>干部：${S.name}（${S.gender}，${S.age}岁，${S.hometownCity||S.hometown}人，${S.edu}）
      ${(S.tags&&S.tags.length)?`<br>人设标签：${S.tags.join(' · ')}`:""}
      ${(S.rotation&&S.rotation.count>0)?`<br>轮岗履历：${(S.rotation.history||[]).map(k=>DEPARTMENTS[k]?DEPARTMENTS[k].short:k).join(' → ')} → <b>${S.dept&&DEPARTMENTS[S.dept]?DEPARTMENTS[S.dept].short:'—'}</b>（共${S.rotation.count}次）`:""}
      ${(S.rotation&&S.rotation.buffs&&S.rotation.buffs.length)?`<br>轮岗增益：${S.rotation.buffs.map(b=>ROTATION_BUFFS[b]?ROTATION_BUFFS[b].name:b).join('、')}`:""}
      ${(S.achievements&&S.achievements.length)?`<div style="margin-top:8px;border-top:1px dashed #ccc;padding-top:8px"><b>🏆 解锁成就（${S.achievements.length}）</b><br>${S.achievements.map(a=>`【${a.name}】${a.desc||''}`).join('<br>')}</div>`:""}
    </div>
    <button class="btn primary" id="again" style="margin-top:14px">再来一局</button>`;
  $("modal").classList.add("show");
  $("again").onclick=()=>{ localStorage.removeItem("qlp_top"); location.reload(); };
  save();
}

/* ---------- 10. 导航 & 启动 ---------- */
function renderNav(){
  const nav=$("nav");
  nav.innerHTML=`
    <div class="tab ${curTab==='event'?'active':''}" data-t="event"><span class="ic">📋</span>事件</div>
    <div class="tab ${curTab==='action'?'active':''}" data-t="action"><span class="ic">🗂️</span>施政</div>
    <div class="tab ${curTab==='faction'?'active':''}" data-t="faction"><span class="ic">🤝</span>派系</div>
    <div class="tab ${curTab==='archive'?'active':''}" data-t="archive"><span class="ic">📁</span>档案</div>`;
  nav.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{ curTab=t.dataset.t; renderNav(); renderMain(curTab); };
  });
}
let curTab='event';

/* ---------- 开局：选择模式 ---------- */
function startScreen(){
  $("topbar").innerHTML="";
  $("nav").innerHTML="";
  let modeCards="";
  Object.keys(MODES).forEach(k=>{
    const m=MODES[k];
    modeCards+=`<button class="btn" data-mode="${k}">
      <span class="bt">${m.name} <span class="mini">${m.badge}</span></span>
      <span class="bd">${m.desc}</span>
    </button>`;
  });
  $("main").innerHTML=`
    <div class="cover">
      <div class="seal">巅峰</div>
      <h1>权利的巅峰</h1>
      <div class="sub">政务模拟 · 策略经营 · 文字冒险</div>
      <div class="card" style="text-align:left;margin-top:24px">
        <div class="card-h">🎮 选择开局模式</div>
        <div class="card-b" style="padding-top:0">
          <div class="muted" style="font-size:12px;margin-bottom:10px">不同模式拥有截然不同的起点、门槛与晋升路径。请审慎选择：</div>
          ${modeCards}
        </div>
      </div>
      <div class="card" style="text-align:left;margin-top:12px">
        <div class="card-b">
          <span class="mini">核心机制：六城指标 · 派系博弈 · 突发事件 · 五维考核 · 多结局分支</span>
        </div>
      </div>
      ${localStorage.getItem("qlp_top")?'<button class="btn center" id="contGame" style="margin-top:10px;width:80%;border-left-color:#999"><span class="bt">继续上次进度</span></button>':''}
    </div>`;
  document.querySelectorAll('[data-mode]').forEach(b=>{
    b.onclick=()=>{ openCharCreate(b.dataset.mode); };
  });
  const cg=$("contGame"); if(cg){ cg.onclick=()=>{ load(); curTab='event'; renderTopbar(); renderNav(); renderMain(); }; }
}

/* ---------- 创建角色 / 资格筛选（选调生走完整门槛） ---------- */
function openCharCreate(mode){
  if(mode!=="selective"){
    // 普通 / 基层模式：简易开局，直接进入
    $("modalTitle").textContent="📝 创建角色（"+MODES[mode].name+"）";
    $("modalBody").innerHTML=`
      <div class="event-text" style="text-indent:0">
        <div style="border:1px solid #ddd;border-radius:8px;padding:10px">
          <label style="display:block;margin:6px 0">姓名：<input id="ci_name" class="ipt" value="李为民" style="width:55%" maxlength="8" placeholder="请输入姓名"></label>
          <label style="display:block;margin:6px 0">性别：
            <select id="ci_gender" class="ipt"><option>男</option><option>女</option></select></label>
          <label style="display:block;margin:6px 0">年龄：
            <input id="ci_age" class="ipt" type="number" value="22" min="18" max="60" style="width:70px"> 岁</label>
          <label style="display:block;margin:6px 0">籍贯：
            <select id="ci_province" class="ipt" onchange="updateCities()">${HOMETOWNS.map(h=>`<option>${h}</option>`).join("")}</select>
            <select id="ci_city" class="ipt" style="margin-top:4px"></select></label>
          <label style="display:block;margin:6px 0">学历：
            <select id="ci_edu" class="ipt">
              <option>本科</option><option>硕士</option><option>博士</option>
            </select></label>
        </div>
        <div class="mini" style="margin-top:10px">${MODES[mode].rules}</div>
      </div>
      <button class="btn primary" id="ci_ok">进入仕途</button>`;
    $("modal").classList.add("show");
    updateCities();   // 初始化城市下拉（默认第一个省）
    $("ci_ok").onclick=()=>{
      const name=($("ci_name").value||"李为民").trim();
      const age=parseInt($("ci_age").value,10)||22;
      const province=$("ci_province").value;
      const city=$("ci_city").value;
      const hometown=hometownFull(province, city);
      const gender=$("ci_gender").value;
      const edu=$("ci_edu").value;
      if(age<18||age>60){ addToast("年龄须在 18-60 岁之间"); return; }
      $("modal").classList.remove("show");
      newGame({mode, name, age, hometown, province, city, gender, edu});
      curTab='event'; renderTopbar(); renderNav(); renderMain();
    };
    return;
  }
  // ==== 选调生：资格筛选 ====
  const schools=["北京大学","清华大学","中国人民大学","复旦大学","上海交通大学","浙江大学","南京大学","武汉大学","华中科技大学","中国科学技术大学","北京师范大学","天津大学","南开大学","山东大学","厦门大学","东南大学","中山大学","华南理工大学","哈尔滨工业大学","西安交通大学","吉林大学","四川大学","电子科技大学","中南大学","湖南大学","重庆大学","大连理工大学","西北工业大学","北京航空航天大学","北京理工大学","中国农业大学","华东师范大学","中央财经大学","中国政法大学"];
  let opt=""; schools.forEach(s=>{ opt+=`<option>${s}</option>`; });
  $("modalTitle").textContent="🎖️ 中央选调生 · 资格筛选";
  $("modalBody").innerHTML=`
    <div class="event-text" style="text-indent:0;font-size:12px">
      <b>「黄金开局 · 隐藏最高难度精英路线」</b><br>
      须同时满足以下四项硬性门槛，任一不达标即<b>无法选择此路线</b>：
      <ol style="padding-left:18px;line-height:1.8">
        <li>院校锁定：34所顶尖高校（32所985 + 中央财经/中国政法2所特殊211）</li>
        <li>政治面貌：中共党员（含预备党员）</li>
        <li>履历：连续担任学生干部满1年 + 校级及以上荣誉</li>
        <li>年龄：本科≤25 / 硕士≤28 / 博士≤30</li>
      </ol>
    </div>
    <div style="border:1px solid #ddd;border-radius:8px;padding:12px;margin-top:8px">
      <label style="display:block;margin:6px 0">姓名：<input id="ci_name" class="ipt" value="李为民" style="width:55%" maxlength="8" placeholder="请输入姓名"></label>
      <label style="display:block;margin:6px 0">性别：
        <select id="ci_gender" class="ipt"><option>男</option><option>女</option></select></label>
      <label style="display:block;margin:6px 0">年龄：
        <input id="ci_age" class="ipt" type="number" value="24" min="18" max="40" style="width:70px"> 岁
        <span id="ci_agetip" class="mini" style="margin-left:6px;color:#666"></span></label>
      <label style="display:block;margin:6px 0">籍贯：
        <select id="ci_province" class="ipt" onchange="updateCities()">${HOMETOWNS.map(h=>`<option>${h}</option>`).join("")}</select>
        <select id="ci_city" class="ipt" style="margin-top:4px"></select></label>
      <label style="display:block;margin:6px 0">毕业院校：<select id="ci_school" class="ipt">${opt}</select></label>
      <label style="display:block;margin:6px 0">学历：
        <select id="ci_edu" class="ipt">
          <option value="本科">本科（年龄≤25岁）</option>
          <option value="硕士">硕士（年龄≤28岁）</option>
          <option value="博士">博士（年龄≤30岁）</option>
        </select></label>
      <label style="display:block;margin:6px 0"><input type="checkbox" id="ci_party" checked> 中共党员（含预备）</label>
      <label style="display:block;margin:6px 0"><input type="checkbox" id="ci_cadre" checked> 连续学生干部满1年</label>
      <label style="display:block;margin:6px 0"><input type="checkbox" id="ci_honor" checked> 获校级及以上荣誉</label>
    </div>
    <button class="btn primary" id="ci_ok" style="margin-top:12px">提交资格审核</button>`;
  $("modal").classList.add("show");
  updateCities();   // 初始化城市下拉
  $("ci_ok").onclick=()=>{
    const edu=$("ci_edu").value;
    const age=parseInt($("ci_age").value,10)||0;
    const data={
      mode, name:($("ci_name").value||"李为民").trim(), school:$("ci_school").value,
      edu, age, gender:$("ci_gender").value,
      province:$("ci_province").value, city:$("ci_city").value,
      hometown:hometownFull($("ci_province").value, $("ci_city").value),
      partyMember:$("ci_party").checked, studentCadre:$("ci_cadre").checked, honors:$("ci_honor").checked,
    };
    const AGE_LIMIT={本科:25,硕士:28,博士:30};
    const lim=AGE_LIMIT[edu]||25;
    const fail=[];
    if(!data.partyMember) fail.push("政治面貌须为中共党员");
    if(!data.studentCadre) fail.push("需连续担任学生干部满1年");
    if(!data.honors) fail.push("需获得校级及以上荣誉");
    if(age<18) fail.push("年龄不得低于18岁");
    else if(age>lim) fail.push(`${edu}学历年龄须≤${lim}岁（当前${age}岁）`);
    if(fail.length){
      $("modalBody").insertAdjacentHTML("beforeend",
        `<div class="result-box" style="margin-top:10px;border-color:#c0392b;color:#c0392b">⚠️ 资格不达标：${fail.join("；")}<br>请调整或返回选择其他开局模式。</div>`);
      return;
    }
    // 进入选拔流程：校内推荐 + 笔试 + 面试（用事件模拟）
    $("modal").classList.remove("show");
    newGame(data);
    S.examStage = 0;       // 选拔阶段：0推荐函 1笔试 2面试 3入职
    save();
    curTab='event'; renderTopbar(); renderNav(); renderMain();
    setTimeout(()=>{ runSelectiveExam(); }, 300);
  };
}

/* 选调生选拔流程：用连续事件模拟校内推荐→笔试→面试 */
function runSelectiveExam(){
  const steps = [
    {title:"第一步：争取校内推荐函", text:"中央选调不对外网报，须在校内综合评分（绩点+荣誉+学生工作）中胜出、拿到推荐函。请审慎抉择：",
     opts:[
       {t:"全力冲击综合第一",d:"能力+15，政绩+10，健康-8", fn:s=>{s.能力+=15;s.政绩+=10;s.健康-=8;}, ok:true},
       {t:"扎实积累履历",d:"政绩+12，人脉+10，道德+8", fn:s=>{s.政绩+=12;s.人脉+=10;s.道德+=8;}, ok:true},
     ]},
    {title:"第二步：副省级行测+申论笔试", text:"采用高难度『副省级』试卷，侧重宏观政策与综合分析能力。",
     opts:[
       {t:"宏观破题立意",d:"政绩+20，能力+12，改革派+15", fn:s=>{s.政绩+=20;s.能力+=12;s.reformRep+=15;}, ok:true},
       {t:"稳扎稳打作答",d:"政绩+12，能力+8，健康-5", fn:s=>{s.政绩+=12;s.能力+=8;s.健康-=5;}, ok:true},
     ]},
    {title:"第三步：部委面试（权重极高）", text:"考官连续追问宏观议题，极其考验政治素养与临场应变。面试通过即获得中央选调生资格。",
     opts:[
       {t:"沉着辩证作答",d:"上司好感+25，政绩+18，能力+15", fn:s=>{s.上司好感+=25;s.政绩+=18;s.能力+=15;}, ok:true},
       {t:"务实表态",d:"上司好感+15，政绩+10", fn:s=>{s.上司好感+=15;s.政绩+=10;}, ok:true},
     ]},
  ];
  let i = S.examStage || 0;
  if(i >= steps.length){
    // 选拔完成 → 入职 + 强制墩苗
    S.dunmiao = true; S.dunmiaoMonths = 0; S.returned = false;
    pushLog("✅ 通过全部选拔环节，正式成为中央选调生，入职中央部委并下沉基层墩苗。");
    addToast("🎖️ 中央选调生资格获取成功");
    delete S.examStage; save();
    renderTopbar(); renderMain('event');
    return;
  }
  const st = steps[i];
  $("modalTitle").textContent="🎖️ 选调选拔 · "+st.title;
  let btns="";
  st.opts.forEach((o,idx)=>{ btns+=`<button class="btn" data-idx="${idx}"><span class="bt">${o.t}</span><span class="bd">${o.d}</span></button>`; });
  $("modalBody").innerHTML=`<div class="event-text" style="text-indent:0">${st.text}</div>${btns}`;
  $("modal").classList.add("show");
  document.querySelectorAll('[data-idx]').forEach(b=>{
    b.onclick=()=>{
      const o=st.opts[+b.dataset.idx];
      o.fn(S);
      pushLog("选拔环节【"+st.title+"】："+o.t);
      S.examStage = i+1; save();
      $("modal").classList.remove("show");
      renderTopbar(); renderMain('event');
      setTimeout(()=>{ runSelectiveExam(); }, 350);
    };
  });
}

function init(){
  load();
  if(!S){ startScreen(); return; }
  // 载入后若选调生选拔流程未完成，恢复选拔弹窗
  if(S.mode==='selective' && S.examStage && S.examStage>0 && S.examStage<3){
    curTab='event'; renderTopbar(); renderNav(); renderMain();
    setTimeout(()=>{ runSelectiveExam(); }, 300);
    return;
  }
  renderTopbar(); renderNav(); renderMain();
}

/* 自动存档提示 */
setInterval(()=>{ if(S&&!S.gameOver)save(); }, 30000);

init();
</script>
