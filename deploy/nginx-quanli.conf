# ============================================================
# 权路巅峰 · Nginx 站点配置
# 放置位置：/etc/nginx/conf.d/quanli.conf
#          或 /etc/nginx/sites-available/quanli（再软链到 sites-enabled）
# 启用：nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    # 有域名就改成你的域名，用 IP 访问保持 _ 即可
    server_name _;

    root /var/www/quanli-dianfeng;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;

    # ---- 压缩：index.html 2.2MB → 约 0.5MB，首屏快 4 倍 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml;

    # ---- 缓存策略：一律 no-cache（必须与源站校验）----
    # 原因：游戏靠 version.json 判断更新，缓存住就永远停在旧版本，
    #       会出现「刷新一百次还是提示更新」的死循环。
    # no-cache 不等于不缓存：命中时返回 304，流量几乎为零。
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 可选：Supabase 反向代理 ----
    # 作用：浏览器只连你自己的服务器，由服务器去连 Supabase。
    #      国内直连 supabase.co 常超时/被干扰，走服务器出海线路通常更稳。
    #      启用它需要 deploy.sh 同步把 CLOUD_CONFIG.url 改成 "/supabase"。
    # 不需要就整段删掉（脚本用 --no-proxy 时会跳过注入）。
    location /supabase/ {
        proxy_pass https://zgkovjgkkvxoajcqxwfw.supabase.co/;
        proxy_ssl_server_name on;
        proxy_set_header Host zgkovjgkkvxoajcqxwfw.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # 运行状态（可选，便于你自己在服务器上排查）
    location = /nginx-status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
