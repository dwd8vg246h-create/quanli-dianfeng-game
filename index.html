<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>权利的巅峰</title>
<style>
  :root{
    --red:#b01e23; --dark-red:#7a1418; --gold:#c9a96a; --ink:#222;
    --paper:#f4f0e6; --paper2:#ebe5d6; --line:#c8bfa8; --green:#2f7d4f;
    --shadow:0 2px 12px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    background:#2c2c2c; color:var(--ink);
    max-width:480px; margin:0 auto; min-height:100vh;height:100dvh;min-height:100dvh;
    background:#3a3a3a;
  }
  #app{
    background:var(--paper); min-height:100vh;height:100dvh;min-height:100dvh; position:relative;
    overflow-x:hidden;
  }
  /* 顶部状态栏 */
  #topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#8a1a1e,#b01e23);
    color:#fff; padding:8px 12px; box-shadow:var(--shadow);
  }
  .tb-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .tb-title{font-size:15px; font-weight:700; letter-spacing:1px;}
  .tb-sub{font-size:11px; opacity:.85; margin-top:2px;}
  .attrs{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .attr{background:rgba(255,255,255,.16); border-radius:4px; padding:2px 6px; font-size:10px;}
  .attr b{color:var(--gold);}
  .bar-wrap{height:4px; background:rgba(255,255,255,.25); border-radius:2px; margin-top:3px; width:40px; display:inline-block; vertical-align:middle;}
  .bar{height:100%; background:var(--gold); border-radius:2px;}

  /* 主体区域 */
  #main{padding:12px; padding-bottom:80px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
  }
  .card-h{
    background:var(--paper2); border-bottom:1px solid var(--line);
    padding:8px 12px; font-weight:700; font-size:13px; color:var(--dark-red);
  }
  .card-b{padding:12px; font-size:13px; line-height:1.7;}
  .muted{color:#7a7364; font-size:12px;}
  .tag{display:inline-block; background:var(--red); color:#fff; font-size:10px; padding:1px 6px; border-radius:3px; margin-right:4px;}

  /* 指标条 */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .stat{background:var(--paper2); border-radius:5px; padding:6px 8px; font-size:11px;}
  .stat .n{font-weight:700; font-size:13px;}
  .stat .lbl{color:#6b6354;}

  /* 按钮 */
  .btn{
    display:block; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-left:4px solid var(--red);
    border-radius:5px; padding:10px 12px; margin:8px 0 0; font-size:13px;
    cursor:pointer; transition:.15s; line-height:1.5;
  }
  .btn:active{background:var(--paper2); transform:scale(.99);}
  .btn .bt{font-weight:700; color:var(--dark-red);}
  .btn .bd{font-size:11px; color:#7a7364; margin-top:2px;}
  .btn.primary{background:var(--red); color:#fff; border-color:var(--red);}
  .btn.primary .bt,.btn.primary .bd{color:#fff;}

  /* 底部导航 */
  #nav{
    position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    background:#fff; border-top:1px solid var(--line); display:flex; z-index:50;
  }
  #nav .tab{flex:1; text-align:center; padding:8px 0; font-size:10px; color:#7a7364; cursor:pointer;}
  #nav .tab.active{color:var(--red); font-weight:700;}
  #nav .tab .ic{font-size:18px; display:block;}

  /* 弹窗 */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:none; align-items:center; justify-content:center; padding:20px;}
  .modal.show{display:flex;}
  .modal-box{background:var(--paper); border-radius:10px; max-width:420px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 8px 30px rgba(0,0,0,.4);}
  .modal-h{background:var(--red); color:#fff; padding:12px; font-weight:700; text-align:center; font-size:15px;}
  .modal-b{padding:16px;}

  /* 闪屏提示 */
  #toast{position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:200; display:none;}
  .toast-item{background:rgba(0,0,0,.82); color:#fff; font-size:12px; padding:8px 14px; border-radius:20px; margin-top:6px; white-space:nowrap;}

  .scene-title{font-size:16px; font-weight:700; color:var(--dark-red); border-left:4px solid var(--gold); padding-left:10px; margin:4px 0 10px;}
  .event-text{font-size:13px; line-height:1.8; text-indent:2em; margin-bottom:6px;}
  .result-box{background:#faf6ec; border:1px dashed var(--gold); border-radius:6px; padding:10px; margin-top:10px; font-size:12px; line-height:1.7;}
  .result-box b{color:var(--red);}

  .mini{font-size:11px; color:#6b6354;}
  .center{text-align:center;}
  .hidden{display:none !important;}

  /* 开始/结束页 */
  .cover{padding:40px 20px; text-align:center;}
  .cover h1{font-size:28px; color:var(--red); letter-spacing:3px; margin:0;}
  .cover .sub{color:#7a7364; font-size:13px; margin-top:8px;}
  .cover .seal{width:90px; height:90px; border:3px solid var(--red); border-radius:8px; color:var(--red); font-size:40px; line-height:84px; margin:24px auto; font-weight:700;}

/* ============ 干部人事档案建档（注册）· 纸质表格风格 ============ */
.form-paper{
  background:#f5ecd9;
  background-image:
    linear-gradient(rgba(180,160,120,.16) 1px, transparent 1px),
    linear-gradient(90deg, rgba(180,160,120,.10) 1px, transparent 1px);
  background-size:100% 26px, 100% 26px;
  border:1px solid #c8b48c;
  border-radius:3px;
  box-shadow:inset 0 0 28px rgba(160,130,80,.14), 0 2px 10px rgba(0,0,0,.08);
  padding:16px 14px;
  font-family:"FangSong","仿宋","STFangsong","SimSun","宋体",serif;
  position:relative;
}
.form-paper::before{
  content:"";position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(circle at 20% 30%, rgba(200,180,140,.10) 0%, transparent 60%),
             radial-gradient(circle at 80% 70%, rgba(190,165,120,.10) 0%, transparent 55%);
  pointer-events:none;border-radius:3px;
}
.form-title{
  text-align:center;font-family:"FangSong","仿宋","STFangsong",serif;
  font-size:19px;font-weight:700;color:#8a1e23;letter-spacing:4px;
  padding-bottom:6px;border-bottom:2px double #b01e23;margin-bottom:4px;
}
.form-sub{
  text-align:center;font-size:11px;color:#8a6a35;letter-spacing:2px;margin-bottom:12px;
  font-family:"FangSong","仿宋",serif;
}
.form-seal{
  position:absolute;right:10px;top:8px;width:56px;height:56px;
  border:2.5px solid #b01e23;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#b01e23;font-weight:800;font-size:12px;line-height:1.15;text-align:center;
  transform:rotate(-14deg);opacity:.5;letter-spacing:1px;
  font-family:"FangSong","仿宋",serif;pointer-events:none;
}
.frow{margin-bottom:12px;position:relative;z-index:1}
.flabel{
  font-size:12px;color:#5a4a30;margin-bottom:3px;display:block;
  font-family:"FangSong","仿宋",serif;letter-spacing:1px;
}
.flabel .req{color:#b01e23}
.finput{
  width:100%;padding:8px 10px;border:1px solid #b8a480;border-radius:2px;
  background:rgba(255,252,244,.85);font-size:16px;color:#3a2f1f;
  font-family:"FangSong","仿宋",serif;box-sizing:border-box;
  border-bottom:1px dashed #b8a480;
}
.finput:focus{outline:none;border-color:#b01e23;background:#fffdf6;
  box-shadow:0 0 0 2px rgba(176,30,35,.08)}
.finput.err{border-color:#b01e23;background:#fff5f5}
.fhint{font-size:11px;color:#8a6a35;margin-top:3px;line-height:1.5;
  font-family:"FangSong","仿宋",serif}
  /* 核验码展示卡（演示模式：醒目呈现，避免用户找不到） */
  .codebox{
    margin-top:8px;padding:10px 12px;border:1px dashed #2f7d4f;border-radius:4px;
    background:rgba(47,125,79,.07);text-align:center;
  }
  .codebox .ct{font-size:11px;color:#5a4a30;font-family:"FangSong","仿宋",serif;line-height:1.6}
  .codebox .cc{
    font-size:28px;font-weight:800;letter-spacing:7px;color:#2f7d4f;margin:7px 0 4px;
    font-family:"Courier New",Courier,monospace;text-indent:7px;
  }
  .codebox .cfill{
    display:inline-block;margin-top:4px;padding:7px 18px;border:1px solid #2f7d4f;
    border-radius:3px;background:#2f7d4f;color:#fff;font-size:13px;font-weight:700;
    letter-spacing:1px;cursor:pointer;
  }
  .codebox .cfill:active{transform:translateY(1px);opacity:.88}
  .codebox .cdone{font-size:12px;color:#2f7d4f;font-weight:700;margin-top:6px}
.ferr{font-size:11px;color:#b01e23;margin-top:3px;line-height:1.5;
  font-family:"FangSong","仿宋",serif;display:none}
.ferr.show{display:block}
.fnote{
  font-size:11px;color:#6a5a40;line-height:1.7;
  font-family:"FangSong","仿宋",serif;
  background:rgba(255,250,238,.7);border-left:3px solid #b01e23;
  padding:6px 9px;margin-bottom:12px;
}
.strength-bar{display:flex;gap:3px;margin-top:5px}
.strength-bar i{
  flex:1;height:5px;background:#ddd5c2;border-radius:2px;display:block;
}
.strength-bar i.on{background:#2f7d4f}
.strength-bar i.on.warn{background:#8a6a35}
.strength-bar i.on.bad{background:#b01e23}
.strength-txt{font-size:11px;margin-top:3px;font-family:"FangSong","仿宋",serif}
.steps{display:flex;gap:4px;margin-bottom:12px;position:relative;z-index:1}
.steps div{
  flex:1;text-align:center;font-size:10px;padding:4px 2px;
  border-bottom:2px solid #d5c8ad;color:#9a8a6a;
  font-family:"FangSong","仿宋",serif;
}
.steps div.on{border-bottom-color:#b01e23;color:#b01e23;font-weight:700}
.steps div.done{border-bottom-color:#8a6a35;color:#8a6a35}
.avatar-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px}
.avatar-item{
  width:56px;height:66px;border:2px solid #d5c8ad;border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;background:rgba(255,252,244,.8);transition:all .15s;
}
.avatar-item.sel{border-color:#b01e23;background:#fff5f0;
  box-shadow:0 0 0 2px rgba(176,30,35,.15)}
.avatar-item .em{font-size:24px;line-height:1}
.avatar-item .nm{font-size:9px;color:#6a5a40;margin-top:3px;text-align:center;
  font-family:"FangSong","仿宋",serif}
.pledge-box{
  max-height:170px;overflow-y:auto;background:rgba(255,253,246,.9);
  border:1px solid #c8b48c;padding:10px;font-size:11px;line-height:1.9;
  color:#4a3f2f;font-family:"FangSong","仿宋",serif;margin-bottom:10px;
}
.pledge-box b{color:#8a1e23}
.pledge-check{
  display:flex;align-items:flex-start;gap:7px;cursor:pointer;
  font-family:"FangSong","仿宋",serif;font-size:12px;color:#4a3f2f;
  padding:6px;border:1px dashed #c8b48c;border-radius:3px;
  background:rgba(255,250,238,.6);
}
.pledge-check input{margin-top:2px;flex-shrink:0}
.reg-nav{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.reg-nav .btn{flex:1}
.seal-stamp{
  position:absolute;right:14px;bottom:14px;width:76px;height:76px;
  border:3px solid #b01e23;border-radius:6px;color:#b01e23;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:11px;line-height:1.3;transform:rotate(-12deg);
  opacity:.28;letter-spacing:1px;font-family:"FangSong","仿宋",serif;
  pointer-events:none;text-align:center;
}
.login-quick{display:flex;gap:8px;margin-top:10px}
.login-quick .btn{flex:1}
.login-quick .btn .bt{font-size:12px}

/* 盖章/打字机音效按钮反馈 */
.btn.stamping{animation:stampPulse .18s ease}
@keyframes stampPulse{
  0%{transform:scale(1)}
  40%{transform:scale(.965)}
  100%{transform:scale(1)}
}


/* ============================================================
   全局 UI 美化 · 政务质感视觉体系
   策略：纯样式增强，不改动任何 HTML 结构与类名
   ============================================================ */

/* —— 1. 色彩体系升级 —— */
:root{
  --red:#9e1b20; --dark-red:#6f1418; --gold:#c9a227; --ink:#1f1c17;
  --paper:#f7f4ec; --paper2:#efe9da; --line:#ddd5c0; --green:#2f7d4f;
  --shadow:0 2px 12px rgba(0,0,0,.10);
  --shadow-lg:0 8px 28px rgba(0,0,0,.16);
  --radius:10px;
  --sans:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",-apple-system,sans-serif;
  --serif:"Songti SC","STSong","SimSun","宋体",serif;
}

/* —— 2. 页面底色：深色画布 + 微妙纹理 —— */
body{
  background:#2a2724;
  background-image:radial-gradient(circle at 50% 0%, #3a352f 0%, #232120 70%);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
#app{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(201,162,39,.05) 0%, transparent 45%),
    radial-gradient(circle at 85% 92%, rgba(158,27,32,.04) 0%, transparent 45%);
  box-shadow:0 0 40px rgba(0,0,0,.5);
}

/* —— 3. 顶栏：红金纵深渐变 + 底部光边 —— */
#topbar{
  background:linear-gradient(160deg,#a51f24 0%,#8c1a1f 45%,#6f1418 100%);
  padding:10px 14px 11px;
  box-shadow:0 2px 14px rgba(111,20,24,.32);
  position:relative;
}
#topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.75;
}
.tb-title{
  font-size:17px;letter-spacing:1.5px;font-weight:800;
  text-shadow:0 1px 2px rgba(0,0,0,.28);
}
.tb-sub{font-size:11px;opacity:.9;line-height:1.5;margin-top:3px;letter-spacing:.2px;}
.attrs{gap:5px;margin-top:7px}
.attr{
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.14);
  border-radius:5px;padding:3px 7px;font-size:10px;
  backdrop-filter:blur(4px);
}
.attr b{color:#f0d67a;font-weight:800;}
.bar-wrap{
  height:5px;background:rgba(0,0,0,.24);border-radius:3px;
  overflow:hidden;margin-top:5px;
}
.bar{
  background:linear-gradient(90deg,#e8c95a,#c9a227);
  border-radius:3px;box-shadow:0 0 6px rgba(201,162,39,.55);
  transition:width .45s cubic-bezier(.4,0,.2,1);
}

/* —— 4. 卡片：细腻层次 —— */
.card{
  background:#fffdf8;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 3px rgba(60,50,35,.06), 0 6px 18px rgba(60,50,35,.05);
  margin-bottom:12px;overflow:hidden;
  transition:box-shadow .2s, transform .2s;
}
.card:hover{
  box-shadow:0 2px 6px rgba(60,50,35,.08), 0 10px 26px rgba(60,50,35,.09);
}
.card-h{
  background:linear-gradient(180deg,#f7f2e4,#efe8d6);
  border-bottom:1px solid var(--line);
  padding:9px 13px;font-weight:800;font-size:13px;color:var(--dark-red);
  letter-spacing:.6px;position:relative;
}
.card-h::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--red),var(--gold));
}
.card-b{padding:13px;font-size:13px;line-height:1.75;color:#332e26;}

/* —— 5. 指标格 —— */
.stat-grid{gap:8px}
.stat{
  background:linear-gradient(180deg,#faf7ee,#f2ecdd);
  border:1px solid #e8e0cc;border-radius:8px;padding:8px 10px;
  box-shadow:inset 0 1px 0 #fff;
  transition:transform .18s;
}
.stat:active{transform:scale(.975)}
.stat .n{font-weight:800;font-size:16px;color:var(--dark-red);letter-spacing:.5px}
.stat .lbl{color:#7a7160;font-size:10px;letter-spacing:.3px}

/* —— 6. 按钮：立体质感 + 明确反馈 —— */
.btn{
  background:linear-gradient(180deg,#fffefb,#faf6ea);
  border:1px solid var(--line);
  border-left:4px solid var(--red);
  border-radius:8px;padding:11px 13px;margin:9px 0 0;
  font-size:13px;cursor:pointer;line-height:1.55;
  box-shadow:0 1px 2px rgba(60,50,35,.05);
  transition:transform .14s cubic-bezier(.4,0,.2,1), box-shadow .14s, background .14s;
}
.btn:active{
  transform:scale(.978);
  background:var(--paper2);
  box-shadow:inset 0 1px 3px rgba(60,50,35,.10);
}
.btn .bt{font-weight:800;color:var(--dark-red);font-size:13px;letter-spacing:.3px}
.btn .bd{font-size:11px;color:#7a7160;margin-top:3px;display:block}
.btn.primary{
  background:linear-gradient(180deg,#b02328,#8c1a1f);
  border-color:#7f171b;border-left-color:var(--gold);
  box-shadow:0 2px 8px rgba(140,26,31,.28);
}
.btn.primary:active{
  background:linear-gradient(180deg,#9a1e22,#7a161a);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.22);
}
.btn.primary .bt,.btn.primary .bd{color:#fff}
.btn.primary .bd{opacity:.88}
.btn:disabled{opacity:.45;filter:grayscale(.5);cursor:not-allowed}
/* 通用触摸目标下限：确保任何按钮都点得中 */
.btn{min-height:38px}
@media (max-width:380px){ .btn{min-height:42px} }
.btn.mini-btn{
  display:inline-block;width:auto;margin:0;
  /* 触摸目标：4px 内边距在手机上太小，指腹难以点准。
     提到 8px 并设 min-height，兼顾苹果(44pt)与安卓(48dp)的可点击性。 */
  padding:8px 11px;min-height:34px;border-radius:6px;border-left-width:3px;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn.mini-btn .bt{font-size:11px;font-weight:700}
/* 小屏进一步加大触摸区 */
@media (max-width:380px){
  .btn.mini-btn{padding:9px 12px;min-height:38px}
}

/* —— 7. 底部导航：毛玻璃 + 顶部指示条 —— */
#nav{
  background:rgba(255,253,248,.94);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  box-shadow:0 -2px 16px rgba(60,50,35,.08);
  padding-bottom:env(safe-area-inset-bottom);
}
#nav .tab{
  padding:7px 0 6px;font-size:10px;color:#8a8170;
  position:relative;transition:color .18s;
}
#nav .tab .ic{font-size:19px;display:block;margin-bottom:1px;transition:transform .18s}
#nav .tab.active{color:var(--red);font-weight:800}
#nav .tab.active .ic{transform:translateY(-1px) scale(1.08)}
#nav .tab.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:24px;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,var(--red),var(--gold));
}
#nav .tab:active{background:rgba(158,27,32,.05)}

/* —— 8. 弹窗：柔和圆角 + 入场动画 —— */
.modal{background:rgba(30,26,22,.55);backdrop-filter:blur(3px);padding:18px}
.modal-box{
  background:var(--paper);border-radius:14px;max-width:430px;
  max-height:86vh;box-shadow:0 16px 48px rgba(0,0,0,.36);
  border:1px solid rgba(201,162,39,.28);
  animation:modalIn .26s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(22px) scale(.965)}
  to{opacity:1;transform:translateY(0) scale(1)}

#b01e23">45%</b> 折算。<br>\n          晋升至 <b style="color:#b01e23">${rankTitle(SECRETARY_MIN_RANK)}</b>（副处级）后，\n          方可配备专职秘书并解锁差遣、背锅、外放等完整玩法。\n        </div>\n        ${liaison?secretaryStatBlock(liaison):`\n          <button class="btn primary" data-act="hire_liaison" style="margin-top:10px">\n            <span class="bt">安排一名联络员</span>\n            <span class="bd">从机关内选定一名年轻同志协助你的日常工作</span>\n          </button>`}\n      </div>\n    </div>`}if(!hasSecretary()){const types=secretaryTypeList();return`<div class="card">\n      <div class="card-h">🖋️ 配备专职秘书</div>\n      <div class="card-b">\n        <div class="mini" style="line-height:1.9;margin-bottom:10px">\n          晋升至副处级，组织上同意为你配备专职秘书。\n          <b>秘书是你的"手脚延伸"</b>——能提效、过滤信息、替你分忧，\n          跟满 3 年后可外放为门生。\n        </div>\n        ${types.map(T=>`\n          <button class="btn" data-act="hire_sec" data-type="${T.id}">\n            <span class="bt">${T.emoji} ${T.name}</span>\n            <span class="bd"><b style="color:#2f7d4f">${T.perk}</b></span>\n            <span class="bd" style="color:#b01e23;font-size:11px">⚠ ${T.risk}</span>\n            <span class="bd" style="color:#8a8170;font-size:10px;margin-top:2px">${T.desc}</span>\n          </button>`).join("")}\n      </div>\n    </div>`}const sec=S.秘书;const T=SECRETARY_TYPES[sec.type];const canRelease=canReleaseSecretary();const tasks=SECRETARY_TASKS;return`<div class="card">\n    <div class="card-h">🖋️ 专职秘书 · ${T?T.emoji+T.name:""}</div>\n    <div class="card-b">\n      ${secretaryStatBlock(sec)}\n\n      <div style="margin-top:10px;border-top:1px dashed #ddd;padding-top:9px">\n        <div class="mini" style="font-weight:700;color:#b01e23;margin-bottom:6px">\n          📋 差遣（每季度可办 1 件次级任务）\n        </div>\n        ${tasks.map(t=>`\n          <button class="btn mini-btn" data-act="sec_task" data-tid="${t.id}"\n                  style="width:100%;display:block">\n            <span class="bt" style="font-size:12px">${t.icon} ${t.name}</span>\n r("👁️ 机敏度（情报力）",sec.intelligence,"#8a6a35")}\n    ${bar("🛡️ 忠诚度",sec.loyalty,lt.c)}\n    <div class="mini" style="font-size:10px;color:#8a8170;margin-top:5px;line-height:1.6">\n      ${isL?"联络员能力有限，建议尽早晋升至副处级配备专职秘书。":SECRETARY_TYPES[sec.type]?SECRETARY_TYPES[sec.type].perk:""}\n    </div>`}function pProtegeTree(){const all=(S.门生||[]).filter(p=>!p.retired);const cultivating=cultivatingProteges();const betrayed=(S.门生||[]).filter(p=>p.isBetrayed&&!p.retired);return`<div class="card">\n    <div class="card-h">🕸️ 门生网络（${activeProteges().length} 人在任${cultivating.length?` · ${cultivating.length} 人培养中`:""}${betrayed.length?` · <span style="color:#b01e23">${betrayed.length} 人叛逃</span>`:""}）</div>\n    <div class="card-b">\n      ${S.rank<RECOMMEND_MIN_RANK&&!all.length?`\n        <div class="mini" style="line-height:1.9;color:#8a8170">\n          门生是你的"根系网络"——散落各处的自己人，关键时替你发声、投票、执行暗线任务。<br>\n          <b>三种来源：</b><br>\n          · 🎓 <b>秘书外放</b>（专职秘书跟班满 3 年）— 忠诚继承，最可靠<br>\n          · 📋 <b>下级举荐</b>（晋升至${rankTitle(RECOMMEND_MIN_RANK)}后，每年可遴选后备干部）— 需培养 2 年<br>\n          · 🔥 <b>危难提拔</b>（突发事件中力排众议破格提拔）— 忠诚锁定 90+\n        </div>`:""}\n\n      ${S.rank>=RECOMMEND_MIN_RANK?`\n        <button class="btn primary" data-act="recommend_open">\n          <span class="bt">📋 后备干部遴选</span>\n          <span class="bd">每年组织部门推荐 3 名年轻干部，由你判断潜力</span>\n        </button>`:""}\n\n      \x3c!-- 人脉树 --\x3e\n      ${all.length?`\n      <div style="margin-top:12px;position:relative;padding-left:14px">\n        \x3c!-- 主干：玩家 --\x3e\n        <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px">\n          <div style="width:34px;height:34px;border-radius:50%;\n                      background:linear-gradient(145deg,#c9a227,#8a6a1f);\n                      color:#fff;display:flex;align-items:center;justify-content:center;\n                      font-size:15px;font-weight:800;border:2px solid #6f1418;flex-shrink:0">\n            ${playerSurname()}\n          </div>\n          <div>\n            <div style="font-size:13px;font-weight:800">${S.name||"你"}</div>\n            <div class="mini" style="font-size:10px">${rankTitle(S.rank)}　权力核心</div>\n          </div>\n        </div>\n        \x3c!-- 连线与门生列表 --\x3e\n        <div style="border-left:2px solid #c9a227;margin-left:16px;padding-left:12px">\n          ${all.map(p=>protegeNode(p)).join("")}\n        </div>\n      </div>`:`\n        <div class="mini" style="margin-top:10px;color:#8a8170;line-height:1.8">\n          你还没有门生。先把秘书带满 3 年外放，是最稳妥的第一步。\n        </div>`}\n\n      ${betrayed.length?`\n      <div style="margin-top:10px;border-top:1px dashed #ddd;padding-top:8px">\n        <div class="mini" style="color:#b01e23;font-weight:700;margin-bottom:4px">⚫ 叛逃者</div>\n        ${betrayed.map(p=>`\n          <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;\n                      background:#fff5f5;border-radius:6px;padding:6px 8px">\n            <span>${p.name}</span>\n            <span class="mini" style="font-size:10px;color:#8a8170">${p.positionName} · ${p.betrayedAt||""}叛逃</span>\n            <button class="btn mini-btn" data-act="purge" data-pid="${p.id}"\n                    style="margin-left:auto;padding:2px 8px">\n              <span class="bt" style="font-size:10px">🧹 清理门户</span>\n            </button>\n          </div>`).join("")}\n        <div class="mini" style="font-size:10px;color:#b01e23;margin-top:4px">\n          清理会剥夺其实权，但将寒了其他门生的心——全体门生忠诚 -10。\n        </div>\n      </div>`:""}\n    </div>\n  </div>`}function protegeNode(p){const lt=loyaltyTier(p.loyalty);const src=PROTEGE_SOURCES[p.source]||PROTEGE_SOURCES.recommend;const fac=PROTEGE_FACTIONS.find(f=>f.id===p.faction)||PROTEGE_FACTIONS[2];const lineColor=p.isBetrayed?"#b01e23":p.loyalty>=80?"#2f7d4f":p.loyalty>=60?"#c9a227":"#b01e23";const lineStyle=p.loyalty<60?"dashed":"solid";const isCultivating=p.cultivating;return`<div style="position:relative;margin-bottom:8px;padding:8px 9px;\n                      background:${p.isBetrayed?"#fff5f5":"#faf8f2"};\n                      border-radius:7px;border-left:3px ${lineStyle} ${lineColor}">\n    <div style="display:flex;align-items:center;gap:7px">\n      <div style="width:30px;height:30px;border-radius:50%;flex-shrink:0;\n                  background:${fac.color};color:#fff;display:flex;\n                  align-items:center;justify-content:center;font-size:13px;font-weight:700">\n        ${(p.name||"?").slice(0,1)}\n      </div>\n      <div style="flex:1;min-width:0">\n        <div style="font-size:13px;font-weight:800">\n          ${p.name}\n          <span style="font-weight:400;color:#8a8170;font-size:10px">${p.gender}·${p.age}岁</span>\n          ${src?`<span style="font-size:10px;margin-left:3px">${src.emoji}</span>`:""}\n          ${p.isDouble&&!p.isBetrayed?`<span style="font-size:9px;color:#b01e23">⚠双面</span>`:""}\n        </div>\n        <div class="mini" style="font-size:10px">\n          <b>${p.positionName||rankTitle(p.level)}</b>\n          　${p.region||"本地"}${p.department?` · ${p.department}`:""}\n        </div>\n      </div>\n      <div style="text-align:right;flex-shrink:0">\n        <div style="font-size:14px;font-weight:800;color:${lt.c}">${Math.round(p.loyalty)}</div>\n        <div class="mini" style="font-size:9px;color:${lt.c}">${lt.emoji}${lt.t}</div>\n      </div>\n    </div>\n\n    <div style="display:flex;gap:8px;margin-top:5px;font-size:10px;color:#6b6354">\n      <span>能力 <b>${Math.round(p.ability)}</b></span>\n      <span>层级 <b>${rankLayer(p.level)||"—"}</b></span>\n      ${p.influence?`<span>辐射 <b>${p.influence}</b></span>`:""}\n      ${p.opsCount?`<span>暗线 ${p.opsCount} 次</span>`:""}\n      <span style="color:${fac.color}">${fac.name}</span>\n    </div>\n\n    ${isCultivating?`\n      <div class="mini" style="font-size:10px;color:#8a6a35;margin-top:4px">\n        📚 培养中 ${p.cultivateMonths||0}/${PROTEGE_CULTIVATE_YEARS*12} 个月，期满后正式纳入体系\n      </div>`:`\n      <div style="display:flex;gap:5px;margin top:8px;font-size:10px;color:#8a8170" class="mini">\n        当前规模：${ev.门生数} 名副处级以上门生 · ${ev.正厅数} 名正厅级 ·\n        覆盖 ${ev.省份数} 省 / ${ev.部门数} 部门\n      </div>\n    </div>\n  </div>`}function pProtegeNews(){const news=S.门生日报||[];if(!news.length)return"";const color={good:"#2f7d4f",bad:"#b01e23",info:"#6b6354"};return`<div class="card">\n    <div class="card-h">📰 门生日报</div>\n    <div class="card-b">\n      ${news.slice(0,6).map(n=>`\n        <div style="display:flex;gap:6px;margin-bottom:6px;padding-bottom:5px;\n                    border-bottom:1px dotted #e8e2d4">\n          <span style="font-size:9px;color:#8a8170;flex-shrink:0;width:52px">${n.时间}</span>\n          <span class="mini" style="font-size:11px;color:${color[n.kind]||"#332e26"};line-height:1.6">\n            ${n.内容}\n          </span>\n        </div>`).join("")}\n      ${news.length>6?`<div class="mini" style="color:#8a8170;font-size:10px">\n        仅显示最近 6 条，共 ${news.length} 条</div>`:""}\n    </div>\n  </div>`}function openHireSecretary(){const types=secretaryTypeList();openModal("🖋️ 配备专职秘书",`\n    <div class="mini" style="line-height:1.9;margin-bottom:10px">\n      晋升至副处级，组织上同意为你配备专职秘书。\n      <b>秘书是你的"手脚延伸"</b>——提效、过滤信息、替你分忧，\n      跟满 <b>3 年</b> 后可外放为门生。\n    </div>\n    ${types.map(T=>`\n      <button class="btn" data-hire="${T.id}">\n        <span class="bt">${T.emoji} ${T.name}<span style="font-weight:400;color:#8a8170;font-size:11px">　${T.tag}</span></span>\n        <span class="bd">${T.desc}</span>\n        <span class="bd" style="color:#2f7d4f">✦ ${T.perk}</span>\n        <span class="bd" style="color:#b01e23">⚠ ${T.risk}</span>\n        <span class="bd" style="color:#8a8170;font-size:10px;margin-top:3px">\n          基准：笔杆子 ${T.base.writing} · 协调 ${T.base.coordination}\n          · 机敏 ${T.base.intelligence} · 忠诚 ${T.base.loyalty}\n        </span>\n      </button>`).join("")}\n    <div class="mini" style="margin-top:10px;color:#8a8170;font-size:10px;line-height:1.6">\n      实际数值会在基准上下浮动。选定后人事关系即行调入，更换需要重新走程序。\n    </div>`,{noAutoOk:true});document.querySelectorAll("[data-hire]").forEach(b=>{b.onclick=()=>{const t=b.dataset.hire;closeModal();const sec=assignSecretary(t);const T=SECRETARY_TYPES[sec.type];openModal("✅ 秘书已到任",`\n        <div style="text-align:center;padding:8px 0">\n          <div style="font-size:40px">${T.emoji}</div>\n          <div style="font-size:16px;font-weight:800;margin-top:6px">\n            ${sec.name}<span style="font-weight:400;color:#8a8170;font-size:12px">\n            　${sec.gender}·${sec.age}岁</span>\n          </div>\n          <div style="color:#9e1b20;font-weight:700;margin-top:2px">${T.name}</div>\n        </div>\n        <div class="mini" style="margin-top:10px;line-height:1.9">\n          ${sec.name}正式到你身边工作。<br>\n          <b>笔杆子 ${sec.writing}</b>　<b>协调力 ${sec.coordination}</b><br>\n          <b>机敏度 ${sec.intelligence}</b>　<b>忠诚 ${sec.loyalty}</b>\n        </div>\n        <div class="mini" style="margin-top:8px;color:#2f7d4f">✦ ${T.perk}</div>\n        <div class="mini" style="margin-top:4px;color:#b01e23">⚠ ${T.risk}</div>\n        <button class="btn primary" data-secok style="margin-top:12px">\n          <span class="bt">开始共事</span>\n        </button>`,{noAutoOk:true});const ok=document.querySelector("[data-secok]");if(ok)ok.onclick=()=>{closeModal();renderTopbar();renderMainSync("network")}}})}function openSecretaryTaskResult(res){openModal(res.success?"✅ 差遣办成":"❌ 差遣办砸",`\n    <div style="text-align:center;padding:6px 0">\n      <div style="font-size:36px">${res.success?"✅":"❌"}</div>\n      <div style="font-size:15px;font-weight:800;margin-top:4px">${res.task.icon} ${res.task.name}</div>\n    </div>\n    <div class="event-text" style="margin-top:10px">${res.text}</div>\n    <div style="background:#f7f4ec;border-radius:6px;padding:9px 10px;margin-top:10px">\n      <div class="mini" style="line-height:1.8">\n        办理得分：<b>${res.score}</b>　任务门槛：<b>${res.need}</b>\n        <span style="color:${res.score>=res.need?"#2f ,"bad");p.loyalty=clamp(p.loyalty-3,0,100)}}function startScreen(){$("topbar").innerHTML="";$("nav").innerHTML="";$("main").innerHTML=`\n    <div class="cover">\n      <div class="seal">巅峰</div>\n      <h1>权利的巅峰</h1>\n      <div class="sub">政务模拟 · 策略经营 · 文字冒险</div>\n      <div class="card" style="text-align:left;margin-top:24px">\n        <div class="card-b" style="text-align:center">\n          <span class="mini">核心机制：六项实绩考核 · 突发事件分级处置 · 派系博弈 · 部门职能 · 多结局分支</span>\n        </div>\n      </div>\n      <div class="card" style="text-align:left;margin-top:12px">\n        <div class="card-h">🎮 三种开局模式</div>\n        <div class="card-b" style="padding-top:0">\n          ${Object.keys(MODES).map(k=>{const m=MODES[k];const f=m.年限系数||{};const 快=Object.keys(f).filter(x=>f[x]<.98);const 慢=Object.keys(f).filter(x=>f[x]>1.02);const 简=a=>a.length?a.map(x=>x.replace(/级.*$/,"")).join("、"):"";return`<div style="margin-bottom:9px;padding-bottom:7px;border-bottom:1px dashed #eee">\n              <div style="font-weight:700;font-size:13px;color:#8a1e23">\n                ${m.name} <span class="mini">${m.badge}</span>\n              </div>\n              <div class="mini" style="line-height:1.7;margin-top:2px">${m.desc}</div>\n              ${m.说明?`<div class="mini" style="line-height:1.7;margin-top:3px;color:#8a6a35">\n                ${m.说明}</div>`:""}\n              ${快.length||慢.length?`<div class="mini" style="line-height:1.7;margin-top:3px">\n                ${快.length?`<span style="color:#2f7d4f">⬆ 晋升较快：${简(快)}</span>`:""}\n                ${快.length&&慢.length?"　":""}\n                ${慢.length?`<span style="color:#b01e23">⬇ 晋升较慢：${简(慢)}</span>`:""}\n              </div>`:""}\n            </div>`}).join("")}\n          <div class="mini" style="color:#8a6a35;margin-top:6px">\n            开局模式将在「新建人事档案」第一步中选择。\n          </div>\n        </div>\n      </div>\n      ${startEntryHTML()}\n      <div id="acctBar" style="margin-top:12px"></div>\n      <div class="mini muted" style="text ems:center;gap:8px;justify-content:center;\n                  background:rgba(245,236,217,.7);border:1px solid #c8b48c;border-radius:4px;padding:7px 10px">\n        <span style="line-height:1;display:inline-block">${avatarHTML(u,34,"border:1px solid #c8b48c")}</span>\n        <div style="text-align:left;font-family:'FangSong','仿宋',serif">\n          <div style="font-size:12px;color:#4a3f2f">\n            <b>${u.character_name!=="—"?u.character_name:"未命名"}</b>\n            <span style="color:#8a6a35">（工号 ${u.emp_id||"—"}）</span>\n          </div>\n          <div style="font-size:10px;color:#8a6a35">\n            档案 ${u.user_id} · ${u.account_status}\n            ${u.age_confirmed?" · 已确认成年":" · 未确认年龄"}\n          </div>\n        </div>\n        <button class="btn" id="acctLogout" style="padding:3px 9px;margin-left:4px">\n          <span class="bt" style="font-size:11px">退出</span>\n        </button>\n      </div>`;const lo=document.getElementById("acctLogout");if(lo)lo.onclick=()=>{if(confirm("确定退出当前人事档案？未保存的进度将保留在本机。")){logout();startScreen()}}}else{bar.innerHTML=`\n      <div style="display:flex;gap:8px;justify-content:center">\n        <button class="btn" id="acctReg" style="flex:1">\n          <span class="bt">📋 新建人事档案</span>\n          <span class="bd" style="font-size:10px">填写《新录用人员信息采集表》</span>\n        </button>\n        <button class="btn" id="acctLogin" style="flex:1">\n          <span class="bt">🔑 登录已有档案</span>\n          <span class="bd" style="font-size:10px">核验身份后继续仕途</span>\n        </button>\n      </div>\n      <div class="mini muted" style="text-align:center;margin-top:6px;font-size:10px">\n        建档后可在本机保存专属进度 · 支持多档案切换\n      </div>`;const r=document.getElementById("acctReg");if(r)r.onclick=()=>openRegister();const l=document.getElementById("acctLogin");if(l)l.onclick=()=>openLogin()}if(typeof bindStampSound==="function")bindStampSound()}const SELECTIVE_SCHOOLS=["北京大学","清华大学","中国人民大学","复旦大学","上海交通大学","浙江大学","南京大学","武汉大学","华中科技大学","中国科学技术大学","北京师范大学","天津大学","南开大学","山东大学","厦门大学","东南大学","中山大学","华南理工大学","哈尔滨工业大学","西安交通大学","吉林大学","四川大学","电子科技大学","中南大学","湖南大学","重庆大学","大连理工大学","西北工业大学","北京航空航天大学","北京理工大学","中国农业大学","华东师范大学","中央财经大学","中国政法大学"];const SELECTIVE_AGE_LIMIT={"本科":25,"硕士":28,"博士":30};function openCharCreate(mode){if(!mode||!MODES[mode])mode="normal";if(mode!=="selective"){$("modalTitle").textContent="📝 创建角色（"+MODES[mode].name+"）";$("modalBody").innerHTML=`\n      <div class="event-text" style="text-indent:0">\n        <div style="border:1px solid #ddd;border-radius:8px;padding:10px">\n          <label style="display:block;margin:6px 0">姓名：<input id="ci_name" class="ipt" value="李为民" style="width:55%" maxlength="8" placeholder="请输入姓名"></label>\n          <label style="display:block;margin:6px 0">性别：\n            <select id="ci_gender" class="ipt"><option>男</option><option>女</option></select></label>\n          <label style="display:block;margin:6px 0">年龄：\n            <input id="ci_age" class="ipt" type="number" value="22" min="18" max="60" style="width:70px"> 岁</label>\n          <label style="display:block;margin:6px 0">籍贯：\n            <select id="ci_province" class="ipt" onchange="updateCities()">${HOMETOWNS.map(h=>`<option>${h}</option>`).join("")}</select>\n            <select id="ci_city" class="ipt" style="margin-top:4px"></select></label>\n          <label style="display:block;margin:6px 0">学历：\n            <select id="ci_edu" class="ipt">\n              <option>本科</option><option>硕士</option><option>博士</option>\n            </select></label>\n        </div>\n        <div class="mini" style="margin-top:10px">${MODES[mode].rules}</div>\n      </div>\n      <button class="btn primary" id="ci_ok">进入仕途</button>`;$("modal").classList.add("show");updateCities();$("ci_ok").onclick=()=>{const name=($("ci_name").value||"李为民").trim();const age=parseInt($("ci_age").value,10)||22;const province=$("ci_province").value;const city=$("ci_city").value;const hometown=hometownFull(province,city);const gender=$("ci_gender").value;const edu=$("ci_edu").value;if(age<18||age>60){addToast("年龄须在 18-60 岁之间");return}$("modal").classList.remove("show");newGame({mode:mode,name:name,age:age,hometown:hometown,province:province,city:city,gender:gender,edu:edu});curTab="event";renderTopbar();renderNav();renderMain()};return}const schools=typeof SELECTIVE_SCHOOLS!=="undefined"?SELECTIVE_SCHOOLS:[];let opt="";schools.forEach(s=>{opt+=`<option>${s}</option>`});$("modalTitle").textContent="🎖️ 中央选调生 · 资格筛选";$("modalBody").innerHTML=`\n    <div class="event-text" style="text-indent:0;font-size:12px">\n      <b>「黄金开局 · 隐藏最高难度精英路线」</b><br>\n      须同时满足以下四项硬性门槛，任一不达标即<b>无法选择此路线</b>：\n      <ol style="padding-left:18px;line-height:1.8">\n        <li>院校锁定：34所顶尖高校（32所985 + 中央财经/中国政法2所特殊211）</li>\n        <li>政治面貌：中共党员（含预备党员）</li>\n        <li>履历：连续担任学生干部满1年 + 校级及以上荣誉</li>\n        <li>年龄：本科≤25 / 硕士≤28 / 博士≤30</li>\n      </ol>\n    </div>\n    <div style="border:1px solid #ddd;border-radius:8px;padding:12px;margin-top:8px">\n      <label style="display:block;margin:6px 0">姓名：<input id="ci_name" class="ipt" value="李为民" style="width:55%" maxlength="8" placeholder="请输入姓名"></label>\n      <label style="display:block;margin:6px 0">性别：\n        <select id="ci_gender" class="ipt"><option>男</option><option>女</option></select></label>\n      <label style="display:block;margin:6px 0">年龄：\n        <input id="ci_age" class="ipt" type="number" value="24" min="18" max="40" style="width:70px"> 岁\n        <span id="ci_agetip" class="mini" style="margin-left:6px;color:#666"></span></label>\n      <label style="display:block;margin:6px 0">籍贯：\n        <select id="ci_province" class="ipt" onchange="updateCities()">${HOMETOWNS.map(h=>`<option>${h}</option>`).join("")}</select>\n        <select id="ci_city" class="ipt" style="margin-top:4px"></select></label>\n      <label style="display:block;margin:6px 0">毕业院校：<select id="ci_school" class="ipt">${opt}</select></label>\n      <label style="display:block;margin:6px 0">学历：\n        <select id="ci_edu" class="ipt">\n          <option value="本科">本科（年龄≤25岁）</option>\n          <option value="硕士">硕士（年龄≤28岁）</option>\n          <option value="博士">博士（年龄≤30岁）</option>\n        </select></label>\n      <label style="display:block;margin:6px 0"><input type="checkbox" id="ci_party" checked> 中共党员（含预备）</label>\n      <label style="display:block;margin:6px 0"><input type="checkbox" id="ci_cadre" checked> 连续学生干部满1年</label>\n      <label style="display:block;margin:6px 0"><input type="checkbox" id="ci_honor" checked> 获校级及以上荣誉</label>\n    </div>\n    <button class="btn primary" id="ci_ok" style="margin-top:12px">提交资格审核</button>`;$("modal").classList.add("show");updateCities();$("ci_ok").onclick=()=>{const edu=$("ci_edu").value;const age=parseInt($("ci_age").value,10)||0;const data={mode:mode,name:($("ci_name").value||"李为民").trim(),school:$("ci_school").value,edu:edu,age:age,gender:$("ci_gender").value,province:$("ci_province").value,city:$("ci_city").value,hometown:hometownFull($("ci_province").value,$("ci_city").value),partyMember:$("ci_party").checked,studentCadre:$("ci_cadre").checked,honors:$("ci_honor").checked};const AGE_LIMIT=typeof SELECTIVE_AGE_LIMIT!=="undefined"?SELECTIVE_AGE_LIMIT:{"本科":25,"硕士":28,"博士":30};const lim=AGE_LIMIT[edu]||25;const fail=[];if(!data.partyMember)fail.push("政治面貌须为中共党员");if(!data.studentCadre)fail.push("需连续担任学生干部满1年");if(!data.honors)fail.push("需获得校级及以上荣誉");if(age<18)fail.push("年龄不得低于18岁");else if(age>lim)fail.push(`${edu}学历年龄须≤${lim}岁（当前${age}岁）`);if(fail.length){$("modalBody").insertAdjacentHTML("beforeend",`<div class="result-box" style="margin-top:10px;border-color:#c0392b;color:#c0392b">⚠️ 资格不达标：${fail.join("；")}<br>请调整或返回选择其他开局模式。</div>`);return}$("modal").classList.remove("show");newGame(data);S.examStage=0;save();curTab="event";renderTopbar();renderNav();renderMain();setTimeout(()=>{runSelectiveExam()},300)}}function runSelectiveExam(){const steps=[{title:"第一步：争取校内推荐函",text:"中央选调不对外网报，须在校内综合评分（绩点+荣誉+学生工作）中胜出、拿到推荐函。请审慎抉择：",opts:[{t:"全力冲击综合第一",d:"能力+15，政绩+10，健康-8",fn:s=>{s.能力+=15;s.政绩+=10;s.健康-=8},ok:true},{t:"扎实积累履历",d:"政绩+12，人脉+10，道德+8",fn:s=>{s.政绩+=12;s.人脉+=10;s.道德+=8},ok:true}]},{title:"第二步：副省级行测+申论笔试",text:"采用高难度『副省级』试卷，侧重宏观政策与综合分析能力。",opts:[{t:"宏观破题立意",d:"政绩+20，能力+12，改革派+15",fn:s=>{s.政绩+=20;s.能力+=12;s.reformRep+=15},ok:true},{t:"稳扎稳打作答",d:"政绩+12，能力+8，健康-5",fn:s=>{s.政绩+=12;s.能力+=8;s.健康-=5},ok:true}]},{title:"第三步：部委面试（权重极高）",text:"考官连续追问宏观议题，极其考验政治素养与临场应变。面试通过即获得中央选调生资格。",opts:[{t:"沉着辩证作答",d:"上司好感+25，政绩+18，能力+15",fn:s=>{s.上司好感+=25;s.政绩+=18;s.能力+=15},ok:true},{t:"务实表态",d:"上司好感+15，政绩+10",fn:s=>{s.上司好感+=15;s.政绩+=10},ok:true}]}];let i=S.examStage||0;if(i>=steps.length){S.dunmiao=true;S.dunmiaoMonths=0;S.returned=false;pushLog("✅ 通过全部选拔环节，正式成为中央选调生，入职中央部委并下沉基层墩苗。");addToast("🎖️ 中央选调生资格获取成功");delete S.examStage;save();renderTopbar();renderMain("event");return}const st=steps[i];$("modalTitle").textContent="🎖️ 选调选拔 · "+st.title;let btns="";st.opts.forEach((o,idx)=>{btns+=`<button class="btn" data-idx="${idx}"><span class="bt">${o.t}</span><span class="bd">${o.d}</span></button>`});$("modalBody").innerHTML=`<div class="event-text" style="text-indent:0">${st.text}</div>${btns}`;$("modal").classList.add("show");document.querySelectorAll("[data-idx]").forEach(b=>{b.onclick=()=>{const o=st.opts[+b.dataset.idx];o.fn(S);pushLog("选拔环节【"+st.title+"】："+o.t);S.examStage=i+1;save();$("modal").classList.remove("show");renderTopbar();renderMain("event");setTimeout(()=>{runSelectiveExam()},350)}})}function init(){load();if(!S){startScreen();return}if(S.mode==="selective"&&S.examStage&&S.examStage>0&&S.examStage<3){curTab="event";renderTopbar();renderNav();renderMain();setTimeout(()=>{runSelectiveExam()},300);return}renderTopbar();renderNav();renderMain()}setInterval(()=>{if(S&&!S.gameOver)save()},3e4);init();
</script>
